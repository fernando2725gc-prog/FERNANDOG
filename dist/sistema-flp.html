<style>
/* =========================================================================
   app.css — AgroRegistro
   Tema claro y oscuro por tokens. Sin dependencias externas.
   ========================================================================= */

:root {
  --verde: #14313f;          /* tinta principal: pizarra fria */
  --verde-claro: #1d4756;
  --verde-suave: #e4ecef;
  --ambar: #a8720f;
  --rojo: #b23a2e;
  --azul: #2f6f8f;

  /* Las tres lineas de producto, tomadas del color de la propia fruta. */
  --linea-1: #c0246b;        /* pitahaya roja */
  --linea-2: #c85a1e;        /* tomate de arbol */
  --linea-3: #b8860b;        /* granadilla */
  --bien: #2f7a56;
  --regular: #a8720f;
  --mal: #b23a2e;

  --fondo: #f2f5f6;
  --superficie: #ffffff;
  --superficie-2: #f9fbfb;
  --borde: #dce3e6;
  --texto: #14202a;
  --texto-tenue: #5a6b75;
  --sombra: 0 1px 2px rgba(16, 34, 28, .06), 0 8px 24px rgba(16, 34, 28, .06);
  --radio: 10px;
  --lateral-ancho: 246px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --verde: #7fb2c4;
    --verde-claro: #9ac8d8;
    --verde-suave: #1a2c35;
    --ambar: #d9a13f;
    --rojo: #e0705f;
    --azul: #6ba3dc;

    --linea-1: #e8639a;
    --linea-2: #e5884b;
    --linea-3: #d9ab3c;
    --bien: #59b087;
    --regular: #d9a13f;
    --mal: #e0705f;

    --fondo: #0f1417;
    --superficie: #171e22;
    --superficie-2: #1c2529;
    --borde: #2a363c;
    --texto: #e8efeb;
    --texto-tenue: #9aaaa3;
    --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  }
}

* { box-sizing: border-box; }

/* Las reglas de este archivo (por ejemplo .campo { display: flex }) tienen
   mas prioridad que el display:none que el navegador aplica al atributo
   [hidden]. Sin esto, un elemento marcado como oculto se seguiria viendo. */
[hidden] { display: none !important; }

:root {
  --fuente: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fuente-datos: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

body {
  margin: 0;
  font-family: var(--fuente);
  font-size: 15px;
  line-height: 1.5;
  color: var(--texto);
  background: var(--fondo);
  -webkit-text-size-adjust: 100%;
}

body.sin-scroll { overflow: hidden; }

h1, h2, h3 { margin: 0 0 .35em; line-height: 1.25; font-weight: 650; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.05rem; }
p { margin: 0 0 .6em; }
code { font-family: var(--fuente-datos); font-size: .86em; letter-spacing: -.01em; }
.kpi-valor, .embudo-num, .hoja-kpis strong { font-family: var(--fuente-datos); font-variant-numeric: tabular-nums; }
.kpi-etiqueta { font-family: var(--fuente); }

.salto {
  position: absolute; left: -999px; top: 0; z-index: 100;
  background: var(--verde); color: #fff; padding: .6rem 1rem; border-radius: 0 0 8px 0;
}
.salto:focus { left: 0; }

:focus-visible { outline: 3px solid var(--verde-claro); outline-offset: 2px; }

.noscript { padding: 2rem; text-align: center; }
.tenue { color: var(--texto-tenue); }
.sub { color: var(--texto-tenue); font-size: .9rem; margin: 0; }

/* ================================ botones ============================= */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  font: inherit; font-weight: 600; padding: .55rem 1rem;
  border: 1px solid transparent; border-radius: 8px; cursor: pointer;
  background: var(--superficie); color: var(--texto);
  transition: background .15s, border-color .15s, transform .05s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primario { background: var(--verde); color: #fff; }
.btn-primario:hover { background: var(--verde-claro); }
.btn-sec { background: var(--verde-suave); color: var(--verde); border-color: var(--verde-suave); }
.btn-sec:hover { border-color: var(--verde); }
.btn-plano { background: transparent; border-color: var(--borde); }
.btn-plano:hover { background: var(--superficie-2); border-color: var(--texto-tenue); }
.btn-peligro { background: transparent; border-color: var(--rojo); color: var(--rojo); }
.btn-peligro:hover { background: var(--rojo); color: #fff; }
.btn-ancho { width: 100%; }

.btn-mini {
  font: inherit; font-size: .8rem; padding: .25rem .55rem; margin-right: .25rem;
  border: 1px solid var(--borde); border-radius: 6px;
  background: var(--superficie); color: var(--texto); cursor: pointer;
}
.btn-mini:hover { border-color: var(--verde); color: var(--verde); }
.btn-mini-peligro:hover { border-color: var(--rojo); color: var(--rojo); }

.chip {
  font: inherit; font-size: .82rem; padding: .3rem .7rem; cursor: pointer;
  border: 1px solid var(--borde); border-radius: 999px;
  background: var(--superficie); color: var(--texto-tenue);
}
.chip:hover { border-color: var(--verde); color: var(--verde); }
.chip-grande { font-size: .88rem; padding: .45rem .9rem; }
.chip-activo { background: var(--verde); border-color: var(--verde); color: #fff; }

/* ================================= login ============================== */

.login-capa {
  min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
  background: linear-gradient(160deg, var(--verde) 0%, #0b3b2c 100%);
}
.login-caja {
  width: min(400px, 100%); background: var(--superficie); color: var(--texto);
  border-radius: 14px; padding: 1.8rem; box-shadow: 0 20px 50px rgba(0, 0, 0, .28);
}
.login-marca, .marca { display: flex; align-items: center; gap: .7rem; margin-bottom: 1.4rem; }
.login-marca .logo, .marca .logo { font-size: 2rem; line-height: 1; }
.login-marca strong, .marca strong { display: block; font-size: 1.15rem; }
.login-marca small, .marca small { display: block; color: var(--texto-tenue); font-size: .78rem; line-height: 1.3; }

.login-demo {
  margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--borde);
  font-size: .84rem; color: var(--texto-tenue);
}
.login-demo ul { margin: .4rem 0 0; padding: 0; list-style: none; }
.login-demo li { margin-bottom: .3rem; }
.demo {
  font: inherit; font-weight: 600; background: var(--verde-suave); color: var(--verde);
  border: 0; border-radius: 5px; padding: .15rem .45rem; cursor: pointer;
}

/* =============================== estructura =========================== */

.capa { display: flex; min-height: 100vh; }

.lateral {
  width: var(--lateral-ancho); flex: 0 0 var(--lateral-ancho);
  background: var(--superficie); border-right: 1px solid var(--borde);
  padding: 1.2rem .9rem; display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.lateral nav { display: flex; flex-direction: column; gap: .15rem; }
.nav-item {
  display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left;
  font: inherit; padding: .6rem .7rem; border: 0; border-radius: 8px; cursor: pointer;
  background: transparent; color: var(--texto-tenue);
}
.nav-item:hover { background: var(--superficie-2); color: var(--texto); }
.nav-item.activo { background: var(--verde-suave); color: var(--verde); font-weight: 650; }
.lateral-pie { margin-top: auto; padding-top: 1rem; font-size: .75rem; }

.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.barra {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .7rem 1.4rem; background: var(--superficie);
  border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 20;
}
.menu-btn {
  display: none; font-size: 1.3rem; background: transparent; border: 0;
  color: var(--texto); cursor: pointer; padding: .2rem .5rem;
}
.barra-usuario { display: flex; align-items: center; gap: .7rem; margin-left: auto; }
.barra-usuario strong { display: block; font-size: .9rem; }
.barra-usuario small { display: block; color: var(--texto-tenue); font-size: .76rem; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--verde); color: #fff; font-weight: 700;
}

main { padding: 1.4rem; flex: 1; max-width: 1400px; width: 100%; }
main:focus { outline: none; }

.vista-cab {
  display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end;
  justify-content: space-between; margin-bottom: 1.1rem;
}
.cab-acciones { display: flex; gap: .5rem; flex-wrap: wrap; }

/* ================================ filtros ============================= */

.filtros {
  display: flex; flex-wrap: wrap; gap: .8rem; align-items: flex-end;
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio); padding: .9rem 1rem; margin-bottom: .6rem;
}
.campo { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
.campo label { font-size: .78rem; font-weight: 600; color: var(--texto-tenue); }
.campo-acciones { flex-direction: row; gap: .4rem; align-items: center; }

input, select, textarea {
  font: inherit; padding: .48rem .6rem; border: 1px solid var(--borde);
  border-radius: 7px; background: var(--superficie); color: var(--texto);
  max-width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--verde); }
input[readonly], select:disabled { background: var(--superficie-2); color: var(--texto-tenue); }
textarea { resize: vertical; }

.atajos {
  display: flex; align-items: center; gap: .4rem; flex-wrap: wrap;
  margin-bottom: 1.2rem; font-size: .82rem; color: var(--texto-tenue);
}

.resumen-linea {
  background: var(--verde-suave); color: var(--texto); border-radius: var(--radio);
  padding: .6rem .9rem; margin-bottom: 1rem; font-size: .9rem;
}

/* ================================== KPIs ============================== */

.kpis {
  display: grid; gap: .8rem; margin-bottom: 1.2rem;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
}
.kpi {
  background: var(--superficie); border: 1px solid var(--borde);
  border-left: 4px solid var(--texto-tenue);
  border-radius: var(--radio); padding: .85rem 1rem; box-shadow: var(--sombra);
}
.kpi-verde { border-left-color: var(--verde); }
.kpi-ambar { border-left-color: var(--ambar); }
.kpi-rojo { border-left-color: var(--rojo); }
.kpi-azul { border-left-color: var(--azul); }
.kpi-etiqueta {
  margin: 0; font-size: .76rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .04em; color: var(--texto-tenue);
}
.kpi-valor { margin: .2rem 0 .15rem; font-size: 1.5rem; font-weight: 700; }
.kpi-detalle { margin: 0; font-size: .8rem; color: var(--texto-tenue); }

/* ================================ paneles ============================= */

.panel {
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio); padding: 1.1rem; margin-bottom: 1.2rem;
  box-shadow: var(--sombra);
}
.grid-2 { display: grid; gap: 1.2rem; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid-2 > .panel { margin-bottom: 0; }
.grid-2 + .grid-2 { margin-top: 1.2rem; }

.conteos { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.conteos > div {
  background: var(--superficie-2); border: 1px solid var(--borde);
  border-radius: 8px; padding: .6rem .8rem;
}
.conteos span { display: block; font-size: .76rem; color: var(--texto-tenue); }
.conteos strong { font-size: 1.3rem; }

.acciones-fila { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .8rem; }

/* ================================ gráficos ============================ */

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart-grid { stroke: var(--borde); stroke-width: 1; }
.chart-tick { font-size: 11px; fill: var(--texto-tenue); }
.chart-tick-y { text-anchor: end; }
.chart-tick-x { text-anchor: middle; }
.chart-label { font-size: 12.5px; fill: var(--texto); dominant-baseline: middle; }
.chart-valor { font-size: 12px; fill: var(--texto-tenue); dominant-baseline: middle; }
.grafico-vacio { color: var(--texto-tenue); font-size: .88rem; padding: 1.5rem 0; text-align: center; }

.leyenda {
  display: flex; flex-wrap: wrap; gap: .3rem 1rem; list-style: none;
  margin: .6rem 0 0; padding: 0; font-size: .82rem; color: var(--texto-tenue);
}
.leyenda-col { flex-direction: column; gap: .3rem; }
.leyenda li { display: flex; align-items: center; gap: .4rem; }
.punto { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: 0 0 auto; }

.dona-wrap { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
.chart-dona { width: 190px; flex: 0 0 auto; }
.dona-total { text-anchor: middle; font-size: 21px; font-weight: 700; fill: var(--texto); }
.dona-sub { text-anchor: middle; font-size: 11px; fill: var(--texto-tenue); }

.medidor-cab { display: flex; justify-content: space-between; font-size: .88rem; margin-bottom: .35rem; }
.medidor-pista {
  position: relative; height: 14px; border-radius: 999px;
  background: var(--superficie-2); border: 1px solid var(--borde); overflow: hidden;
}
.medidor-barra { height: 100%; background: var(--texto-tenue); transition: width .3s; }
.medidor-ok .medidor-barra { background: var(--verde); }
.medidor-alerta .medidor-barra { background: var(--ambar); }
.medidor-bajo .medidor-barra { background: var(--rojo); }
.medidor-pie { font-size: .78rem; color: var(--texto-tenue); margin-top: .3rem; }

/* ================================= tablas ============================= */

.tabla-scroll {
  overflow-x: auto; background: var(--superficie);
  border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra);
}
.tabla { width: 100%; border-collapse: collapse; font-size: .875rem; }
.tabla th, .tabla td { padding: .55rem .7rem; text-align: left; border-bottom: 1px solid var(--borde); }
.tabla th {
  background: var(--superficie-2); font-size: .74rem; text-transform: uppercase;
  letter-spacing: .04em; color: var(--texto-tenue); white-space: nowrap;
  position: sticky; top: 0;
}
.tabla td.num, .tabla th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabla tbody tr:hover { background: var(--superficie-2); }
.tabla tbody tr:last-child td { border-bottom: 0; }
.tabla tfoot td { background: var(--superficie-2); font-weight: 650; border-top: 2px solid var(--borde); }

.vacio {
  background: var(--superficie); border: 1px dashed var(--borde); border-radius: var(--radio);
  padding: 2.2rem 1rem; text-align: center; color: var(--texto-tenue);
}

.etq {
  display: inline-block; padding: .1rem .45rem; border-radius: 5px;
  font-size: .76rem; font-weight: 650; background: var(--superficie-2); color: var(--texto-tenue);
}
.etq-A { background: rgba(18, 104, 77, .14); color: var(--verde); }
.etq-B { background: rgba(181, 118, 17, .16); color: var(--ambar); }
.etq-C { background: rgba(178, 58, 46, .14); color: var(--rojo); }
.etq-ok { background: rgba(18, 104, 77, .14); color: var(--verde); }
.etq-bajo { background: rgba(178, 58, 46, .14); color: var(--rojo); }
.etq-rol { background: rgba(47, 98, 149, .14); color: var(--azul); }

.estado { font-size: .78rem; font-weight: 650; }
.estado-recibido { color: var(--verde); }
.estado-pendiente { color: var(--ambar); }
.estado-inactivo { color: var(--texto-tenue); }

.nota-seguridad {
  margin-top: 1rem; padding: .8rem 1rem; font-size: .84rem;
  background: rgba(181, 118, 17, .1); border-left: 3px solid var(--ambar); border-radius: 6px;
}

/* ================================ reportes ============================ */

.selector-reporte { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }

.hoja {
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio); padding: 1.4rem; box-shadow: var(--sombra);
}
.hoja-cab {
  display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between;
  align-items: flex-start; padding-bottom: 1rem; margin-bottom: 1rem;
  border-bottom: 2px solid var(--verde);
}
.hoja-meta { font-size: .82rem; color: var(--texto-tenue); text-align: right; }
.hoja-meta p { margin: 0; }
.hoja-kpis {
  display: grid; gap: .6rem; margin-bottom: 1.1rem;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
}
.hoja-kpis > div {
  background: var(--superficie-2); border: 1px solid var(--borde);
  border-radius: 8px; padding: .5rem .7rem;
}
.hoja-kpis span { display: block; font-size: .72rem; color: var(--texto-tenue); }
.hoja-kpis strong { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.hoja-pie {
  margin-top: 1rem; padding-top: .8rem; border-top: 1px solid var(--borde);
  font-size: .76rem; color: var(--texto-tenue);
}

/* ================================= modal ============================== */

.modal-capa {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
  padding: 1rem; background: rgba(8, 20, 16, .55); overflow-y: auto;
}
.modal {
  width: min(620px, 100%); background: var(--superficie); color: var(--texto);
  border-radius: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  max-height: 92vh; display: flex; flex-direction: column;
}
.modal-cab {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.2rem; border-bottom: 1px solid var(--borde);
}
.modal-cab h2 { margin: 0; }
.modal-x {
  font-size: 1.6rem; line-height: 1; background: transparent; border: 0;
  color: var(--texto-tenue); cursor: pointer; padding: 0 .3rem;
}
.modal-cuerpo {
  padding: 1.2rem; display: grid; gap: .9rem; overflow-y: auto;
  grid-template-columns: repeat(2, 1fr);
}
.modal-nota, .form-sep, .campo-full, .form-error, .modal-pie { grid-column: 1 / -1; }
.campo-mitad { grid-column: span 1; }
.modal-nota {
  margin: 0; font-size: .84rem; color: var(--texto-tenue);
  background: var(--verde-suave); padding: .6rem .8rem; border-radius: 8px;
}
.form-sep {
  margin: .4rem 0 0; font-size: .78rem; text-transform: uppercase;
  letter-spacing: .05em; color: var(--texto-tenue);
}
.campo-calculado output {
  display: block; font-size: 1.1rem; font-weight: 700; padding: .4rem 0;
}
.campo-calculado output.ok { color: var(--verde); }
.campo-calculado output.bajo { color: var(--rojo); }
.ayuda { font-size: .76rem; color: var(--texto-tenue); }
.req { color: var(--rojo); }
.check { display: flex; align-items: center; gap: .5rem; font-size: .9rem; }
.check input { width: auto; }
.form-error {
  margin: 0; padding: .55rem .8rem; border-radius: 7px; font-size: .86rem;
  background: rgba(178, 58, 46, .12); color: var(--rojo); border-left: 3px solid var(--rojo);
}
.modal-pie {
  display: flex; justify-content: flex-end; gap: .6rem;
  padding-top: .4rem; border-top: 1px solid var(--borde); margin-top: .3rem;
  padding-top: 1rem;
}

/* ================================= avisos ============================= */

.avisos {
  position: fixed; bottom: 1.2rem; right: 1.2rem; z-index: 80;
  display: flex; flex-direction: column; gap: .5rem; max-width: min(380px, calc(100vw - 2rem));
}
.aviso {
  background: var(--texto); color: var(--fondo); padding: .7rem 1rem;
  border-radius: 9px; font-size: .87rem; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  border-left: 4px solid var(--verde-claro); animation: entra .2s ease-out;
}
.aviso-alerta { border-left-color: var(--ambar); }
.aviso-error { border-left-color: var(--rojo); }
.aviso.saliendo { opacity: 0; transform: translateY(6px); transition: opacity .4s, transform .4s; }

@keyframes entra {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ================================ responsive ========================== */

@media (max-width: 900px) {
  .lateral {
    position: fixed; z-index: 40; left: 0; top: 0; transform: translateX(-100%);
    transition: transform .2s ease-out; box-shadow: var(--sombra);
  }
  .lateral.abierto { transform: none; }
  .menu-btn { display: block; }
  main { padding: 1rem; }
  .modal-cuerpo { grid-template-columns: 1fr; }
  .campo-mitad { grid-column: 1 / -1; }
  .hoja-meta { text-align: left; }
}

@media (max-width: 560px) {
  .vista-cab { flex-direction: column; align-items: stretch; }
  .cab-acciones .btn { flex: 1; }
  .filtros { flex-direction: column; align-items: stretch; }
  .kpi-valor { font-size: 1.3rem; }
}


/* ============================ selector de rol ========================= */

.login-intro { color: var(--texto-tenue); font-size: .9rem; margin-bottom: 1rem; }

.roles { border: 0; padding: 0; margin: 0 0 1rem; display: grid; gap: .5rem; }
.roles legend {
  font-size: .78rem; font-weight: 600; color: var(--texto-tenue);
  padding: 0; margin-bottom: .4rem;
}
.rol-tarjeta { display: block; cursor: pointer; }
/* Oculto a la vista pero sigue existiendo para el teclado y el lector de
   pantalla: conserva un tamano de 1px en vez de colapsar a cero. */
.rol-tarjeta input {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  padding: 0; border: 0; overflow: hidden; white-space: nowrap;
  clip: rect(0 0 0 0); clip-path: inset(50%);
}
.rol-cuerpo {
  display: flex; align-items: flex-start; gap: .7rem;
  border: 1px solid var(--borde); border-radius: 10px; padding: .7rem .85rem;
  transition: border-color .15s, background .15s;
}
.rol-tarjeta:hover .rol-cuerpo { border-color: var(--verde); }
.rol-tarjeta input:checked + .rol-cuerpo {
  border-color: var(--verde); background: var(--verde-suave); box-shadow: inset 0 0 0 1px var(--verde);
}
.rol-tarjeta input:focus-visible + .rol-cuerpo { outline: 3px solid var(--verde-claro); outline-offset: 2px; }
.rol-icono { font-size: 1.35rem; line-height: 1.2; }
.rol-cuerpo strong { display: block; font-size: .95rem; }
.rol-cuerpo small { display: block; color: var(--texto-tenue); font-size: .78rem; line-height: 1.35; }

/* ========================= embudo del ciclo de vida =================== */

.embudo { display: flex; align-items: stretch; gap: .5rem; flex-wrap: wrap; }
.embudo-paso {
  flex: 1 1 150px; background: var(--superficie-2); border: 1px solid var(--borde);
  border-radius: 10px; padding: .7rem .85rem; display: flex; flex-direction: column; gap: .1rem;
}
.embudo-num { font-size: 1.6rem; font-weight: 700; line-height: 1.1; color: var(--verde); }
.embudo-nombre { font-weight: 650; font-size: .9rem; }
.embudo-ayuda { font-size: .75rem; color: var(--texto-tenue); line-height: 1.35; }
.embudo-flecha { display: grid; place-items: center; color: var(--texto-tenue); font-size: 1.2rem; }
.embudo-rechazo {
  margin: .8rem 0 0; font-size: .84rem; color: var(--rojo);
  background: rgba(178, 58, 46, .08); padding: .5rem .8rem; border-radius: 7px;
}

.panel-destacado { border-left: 4px solid var(--verde); }
.panel-sub { margin-bottom: .8rem; }

/* ============================ filas de merma ========================== */

.mermas-filas { display: grid; gap: .45rem; margin: .5rem 0; }
.merma-fila { display: grid; grid-template-columns: 1fr 110px auto; gap: .4rem; align-items: center; }
.merma-fila select, .merma-fila input { width: 100%; }
.btn-sm { font-size: .82rem; padding: .35rem .7rem; }

.balance {
  margin-top: .6rem; padding: .55rem .8rem; border-radius: 7px; font-size: .86rem;
  background: var(--superficie-2); border: 1px solid var(--borde);
}
.balance-ok { background: rgba(18, 104, 77, .12); border-color: var(--verde); color: var(--verde); }
.balance-pendiente { background: rgba(181, 118, 17, .12); border-color: var(--ambar); color: var(--ambar); }

.btn-mini-accion { border-color: var(--verde); color: var(--verde); font-weight: 650; }
.btn-mini-accion:hover { background: var(--verde); color: #fff; }

/* =============================== ficha del lote ======================= */

.ficha-mini {
  display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  background: var(--verde-suave); border-radius: 9px; padding: .7rem .85rem; margin-bottom: .3rem;
}
.ficha-mini span { display: block; font-size: .72rem; color: var(--texto-tenue); }
.ficha-mini strong { font-size: .92rem; }

.ficha-linea { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.ficha-hito {
  flex: 1 1 120px; text-align: center; padding: .6rem .4rem;
  border: 1px solid var(--borde); border-radius: 9px; background: var(--superficie-2);
  opacity: .5;
}
.ficha-hito.hito-hecho { opacity: 1; border-color: var(--verde); background: var(--verde-suave); }
.hito-punto {
  display: grid; place-items: center; width: 24px; height: 24px; margin: 0 auto .3rem;
  border-radius: 50%; background: var(--texto-tenue); color: var(--fondo);
  font-size: .78rem; font-weight: 700;
}
.hito-hecho .hito-punto { background: var(--verde); color: #fff; }
.ficha-hito strong { display: block; font-size: .84rem; }
.ficha-hito small { display: block; font-size: .72rem; color: var(--texto-tenue); line-height: 1.35; }

.ficha-bloques { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.ficha-bloques section {
  border: 1px solid var(--borde); border-radius: 9px; padding: .8rem .9rem; background: var(--superficie-2);
}
.ficha-bloques h4 {
  margin: 0 0 .5rem; font-size: .76rem; text-transform: uppercase;
  letter-spacing: .05em; color: var(--texto-tenue);
}
.ficha-bloques dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .25rem .7rem; font-size: .86rem; }
.ficha-bloques dt { color: var(--texto-tenue); }
.ficha-bloques dd { margin: 0; text-align: right; }
.ficha-notas { grid-column: 1 / -1; }
.ficha-notas p { font-size: .85rem; margin: 0 0 .4rem; }

/* Las causas ocupan el ancho completo y se reparten en varias columnas:
   son la parte mas util de la ficha y no deben quedar en una tira estrecha. */
.ficha-mermas { grid-column: 1 / -1; }
.lista-mermas {
  list-style: none; margin: 0; padding: 0; font-size: .84rem;
  display: grid; gap: .35rem .9rem;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.lista-mermas li { display: grid; grid-template-columns: 1fr 60px auto; gap: .5rem; align-items: center; }
.barra-mini { display: block; height: 6px; border-radius: 999px; background: var(--borde); overflow: hidden; }
.barra-mini span { display: block; height: 100%; background: var(--verde); }

.modal-ancho { width: min(880px, 100%); }
.modal-cuerpo-libre { display: block; }
.modal-pie-fijo { border-top: 1px solid var(--borde); padding: 1rem 1.2rem; }

.hoja-grafico { margin-bottom: 1.2rem; }
.nota-info {
  margin-top: 1rem; padding: .8rem 1rem; font-size: .84rem;
  background: var(--verde-suave); border-left: 3px solid var(--verde); border-radius: 6px;
}

.punto-linea { height: 3px; border-radius: 2px; }

.estado-anunciado { color: var(--ambar); }
.estado-procesado { color: var(--azul); }
.estado-cerrado { color: var(--verde); }
.estado-rechazado { color: var(--rojo); }

@media (max-width: 560px) {
  .merma-fila { grid-template-columns: 1fr 80px auto; }
  .embudo-flecha { display: none; }
  .ficha-bloques dl { grid-template-columns: 1fr; }
  .ficha-bloques dd { text-align: left; font-weight: 600; }
}

/* Al imprimir una ficha solo debe salir la ficha, no la pantalla de fondo. */
@media print {
  body.imprimiendo-ficha .capa { display: none !important; }
  body.imprimiendo-ficha .modal-capa {
    position: static; background: none; padding: 0; display: block; overflow: visible;
  }
  body.imprimiendo-ficha .modal {
    display: block; box-shadow: none; max-height: none; width: 100%; border-radius: 0;
  }
  body.imprimiendo-ficha .modal-x, body.imprimiendo-ficha .modal-pie { display: none !important; }
  .ficha-hito, .ficha-bloques section, .embudo-paso { break-inside: avoid; }
}


/* =========================== estado de sincronia ====================== */

.sincro {
  display: flex; align-items: center; gap: .4rem;
  margin: 0 0 .2rem; font-size: .8rem; font-weight: 600;
}
.sincro-punto { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.sincro-on { color: var(--verde); }
.sincro-on .sincro-punto { background: var(--verde); box-shadow: 0 0 0 3px rgba(18, 104, 77, .18); }
.sincro-off { color: var(--texto-tenue); }
.sincro-off .sincro-punto { background: var(--texto-tenue); }
.sincro-ayuda { font-size: .72rem; line-height: 1.35; margin-bottom: .5rem; }

/* ======================== captura desde el celular ==================== */

/* iOS hace zoom sobre cualquier campo con letra menor de 16px al enfocarlo,
   y despues deja la pagina descuadrada. Con 16px no ocurre. */
@media (max-width: 900px) {
  input, select, textarea { font-size: 16px; padding: .6rem .7rem; }

  /* Objetivos tactiles comodos con guantes o a contraluz en el patio. */
  .btn { min-height: 44px; padding: .7rem 1.1rem; }
  .btn-mini { min-height: 38px; padding: .45rem .7rem; margin-bottom: .2rem; }
  .nav-item { min-height: 46px; }
  .chip { min-height: 38px; }
  .rol-cuerpo { padding: .85rem 1rem; }

  /* Una fila de merma por linea: en 390px las tres columnas no caben. */
  .merma-fila { grid-template-columns: 1fr auto; grid-template-areas: "causa causa" "kg quitar"; }
  .merma-fila select { grid-area: causa; }
  .merma-fila .merma-kg { grid-area: kg; width: 100%; }
  .merma-fila .merma-quitar { grid-area: quitar; }

  /* El modal ocupa la pantalla: es una pantalla de captura, no una ventana. */
  .modal-capa { padding: 0; align-items: stretch; }
  .modal { max-height: 100vh; border-radius: 0; width: 100%; }
  /* El pie se queda pegado abajo, así que tapaba el último campo: el
     resumen del envío, que es justo lo que el proveedor quiere ver antes
     de guardar. Se le deja aire al final del cuerpo. */
  .modal-pie {
    position: sticky; bottom: 0; background: var(--superficie);
    box-shadow: 0 -6px 16px rgba(0, 0, 0, .08);
  }
  .modal-pie .btn { flex: 1; }
  .modal-cuerpo { padding-bottom: 1.6rem; }

  /* El aviso no debe tapar el boton de guardar. */
  .avisos { bottom: auto; top: .8rem; right: .8rem; left: .8rem; max-width: none; }
}


/* ========================= tonos de los indicadores =================== */

.kpi-bien { border-left-color: var(--bien); }
.kpi-regular { border-left-color: var(--regular); }
.kpi-mal { border-left-color: var(--mal); }
.kpi-linea1 { border-left-color: var(--linea-1); }
.kpi-linea2 { border-left-color: var(--linea-2); }
.kpi-linea3 { border-left-color: var(--linea-3); }

.panel-bien { border-left: 4px solid var(--bien); }
.panel-regular { border-left: 4px solid var(--regular); }
.panel-mal { border-left: 4px solid var(--mal); }

.seccion-titulo {
  margin: 1.8rem 0 .8rem; font-size: .8rem; text-transform: uppercase;
  letter-spacing: .09em; color: var(--texto-tenue); font-weight: 700;
  padding-bottom: .4rem; border-bottom: 1px solid var(--borde);
}

/* ===================== origen del dato (M / E / S) ==================== */

/* El estandar de rigor del TIC exige declarar de donde sale cada numero.
   La insignia va pegada al valor, no en una columna aparte. */
.origen {
  display: inline-block; font-family: var(--fuente-datos); font-size: .62em;
  font-weight: 700; line-height: 1; padding: .18em .34em; border-radius: 3px;
  vertical-align: super; text-decoration: none; cursor: help;
  border: 1px solid currentColor; opacity: .75;
}
.origen-M { color: var(--bien); }
.origen-E { color: var(--regular); }
.origen-S { color: var(--azul); }

/* ====================== linea de producto ============================= */

.linea-tag { display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap; }
.linea-punto {
  width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
  background: var(--linea, var(--texto-tenue));
}

/* ============================== portada =============================== */

.portada-body { display: grid; place-items: center; min-height: 100vh; padding: 2rem 1.2rem; }
.portada { width: min(900px, 100%); display: flex; flex-direction: column; gap: 1.8rem; }
.portada-cab { text-align: center; }
.portada-eyebrow {
  font-family: var(--fuente-datos); font-size: .74rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--texto-tenue); margin-bottom: .5rem;
}
.portada-cab h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); margin-bottom: .4rem; }
.portada-sub { color: var(--texto-tenue); max-width: 46ch; margin: 0 auto; }

.portada-apps { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.portada-app {
  display: flex; flex-direction: column; gap: .5rem; text-decoration: none; color: inherit;
  background: var(--superficie); border: 1px solid var(--borde); border-top: 4px solid var(--texto-tenue);
  border-radius: var(--radio); padding: 1.5rem; box-shadow: var(--sombra);
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
.portada-app:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(20, 32, 42, .14); }
.portada-app-ext { border-top-color: var(--linea-1); }
.portada-app-int { border-top-color: var(--azul); }
.portada-icono { font-size: 2.2rem; line-height: 1; }
.portada-app h2 { margin: 0; font-size: 1.2rem; }
.portada-app p { color: var(--texto-tenue); font-size: .9rem; margin: 0; flex: 1; }
.portada-cta { font-weight: 650; font-size: .9rem; color: var(--verde); margin-top: .4rem; }
.portada-app-ext .portada-cta { color: var(--linea-1); }
.portada-app-int .portada-cta { color: var(--azul); }

.portada-nota {
  background: var(--verde-suave); border-radius: var(--radio); padding: 1.2rem 1.4rem;
}
.portada-nota h3 { font-size: .95rem; margin-bottom: .4rem; }
.portada-nota p { margin: 0 0 .5rem; font-size: .88rem; color: var(--texto-tenue); }
.portada-nota p:last-child { margin-bottom: 0; }
.portada-prueba { color: var(--texto) !important; }

/* ============================== acceso ================================ */

.acceso-capa { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
.acceso-proveedor { background: linear-gradient(160deg, #c0246b 0%, #6d1340 100%); }
.acceso-interno { background: linear-gradient(160deg, #1d4756 0%, #0d2029 100%); }
.acceso-caja {
  width: min(420px, 100%); background: var(--superficie); color: var(--texto);
  border-radius: 14px; padding: 1.8rem; box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
}
.acceso-marca { display: flex; align-items: center; gap: .7rem; margin-bottom: 1rem; }
.acceso-marca .logo { font-size: 2rem; line-height: 1; }
.acceso-marca strong { display: block; font-size: 1.1rem; }
.acceso-marca small { display: block; color: var(--texto-tenue); font-size: .78rem; }
.acceso-intro { color: var(--texto-tenue); font-size: .9rem; margin-bottom: 1.2rem; }
.acceso-demo {
  margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid var(--borde);
  font-size: .84rem; color: var(--texto-tenue);
}
.acceso-demo ul { margin: .4rem 0 0; padding: 0; list-style: none; }
.acceso-demo li { margin-bottom: .3rem; }
.acceso-pie {
  margin: 1rem 0 0; padding-top: .9rem; border-top: 1px solid var(--borde);
  font-size: .82rem; color: var(--texto-tenue); text-align: center;
}
.acceso-pie a { color: var(--verde); font-weight: 600; }
.btn-grande { min-height: 50px; font-size: 1rem; }

/* ====================== portal del proveedor ========================== */

/* El portal es una app de celular: barra inferior, tarjetas grandes y una
   sola accion principal siempre visible. */
.portal { display: flex; flex-direction: column; min-height: 100vh; }
.portal-barra {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .7rem 1rem; background: var(--superficie);
  border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 20;
}
.portal-marca { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.portal-marca span { font-size: 1.4rem; }
.portal-marca strong { display: block; font-size: .92rem; }
.portal-marca small { display: block; color: var(--texto-tenue); font-size: .75rem; }
.portal main { flex: 1; padding: 1rem; padding-bottom: 5.5rem; max-width: 860px; width: 100%; margin: 0 auto; }

.portal-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; background: var(--superficie); border-top: 1px solid var(--borde);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.portal-nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: .15rem;
  font: inherit; font-size: .72rem; padding: .6rem .3rem; min-height: 56px;
  background: transparent; border: 0; color: var(--texto-tenue); cursor: pointer;
}
.portal-nav-item span { font-size: 1.25rem; line-height: 1; }
.portal-nav-item.activo { color: var(--linea-1); font-weight: 650; }

.portal-saludo { margin-bottom: 1.2rem; }
.portal-saludo h1 { font-size: 1.5rem; margin-bottom: .1rem; }
.portal-saludo .sub { margin-bottom: .9rem; }
.kpis-portal { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

.pila { display: grid; gap: .7rem; }
.lote-tarjeta {
  background: var(--superficie-2); border: 1px solid var(--borde);
  border-radius: 11px; padding: .85rem 1rem; cursor: pointer;
  transition: border-color .15s, transform .1s;
}
.lote-tarjeta:hover, .lote-tarjeta:focus-visible { border-color: var(--linea-1); transform: translateY(-2px); }
.lote-cab { display: flex; justify-content: space-between; align-items: center; gap: .6rem; margin-bottom: .45rem; }
.lote-codigo { font-family: var(--fuente-datos); font-size: .8rem; color: var(--texto-tenue); }
.lote-cuerpo { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; font-size: .9rem; margin-bottom: .6rem; }
.lote-cuerpo strong { font-size: 1.05rem; }
.lote-dato { margin: .5rem 0 0; font-size: .85rem; }
.lote-rechazo {
  margin: .4rem 0 0; font-size: .84rem; color: var(--mal);
  background: rgba(178, 58, 46, .08); padding: .45rem .7rem; border-radius: 7px;
}

/* Recorrido del lote: el proveedor ve donde esta su fruta. */
.pasos { display: flex; list-style: none; margin: 0; padding: 0; gap: 0; }
.paso { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .25rem; position: relative; }
.paso::before {
  content: ""; position: absolute; top: 5px; left: -50%; width: 100%; height: 2px;
  background: var(--borde);
}
.paso:first-child::before { display: none; }
.paso-hecho::before { background: var(--linea-1); }
.paso-punto {
  width: 12px; height: 12px; border-radius: 50%; background: var(--borde);
  position: relative; z-index: 1;
}
.paso-hecho .paso-punto { background: var(--linea-1); }
.paso-texto { font-size: .68rem; color: var(--texto-tenue); }
.paso-hecho .paso-texto { color: var(--texto); font-weight: 600; }

/* ========================= planificador diario ======================== */

.demanda { display: grid; gap: .6rem; }
.demanda-fila {
  display: grid; grid-template-columns: 1fr 120px auto; gap: .7rem; align-items: center;
  background: var(--superficie-2); border: 1px solid var(--borde);
  border-left: 4px solid var(--linea); border-radius: 9px; padding: .6rem .8rem;
}
.demanda-fila label { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; font-weight: 600; }
.demanda-fila label small {
  display: block; width: 100%; font-weight: 400; font-size: .74rem; color: var(--texto-tenue);
}
.demanda-disp { font-size: .76rem; color: var(--texto-tenue); white-space: nowrap; }

.barra-ancha { width: 70px; display: inline-block; vertical-align: middle; }

/* ============================ repetibles ============================== */

.rep-filas { display: grid; gap: .45rem; margin: .5rem 0; }
.rep-fila { display: grid; grid-template-columns: 1.4fr 90px 1.4fr auto; gap: .4rem; align-items: center; }
.rep-fila select, .rep-fila input { width: 100%; min-width: 0; }

/* ============================ credenciales ============================ */

.campo-clave { display: flex; gap: .4rem; align-items: stretch; }
.campo-clave input { flex: 1; min-width: 0; }
.ver-clave {
  flex: 0 0 auto; width: 46px; font-size: 1.05rem; cursor: pointer;
  background: var(--superficie-2); border: 1px solid var(--borde);
  border-radius: 7px; color: var(--texto-tenue);
}
.ver-clave:hover { border-color: var(--verde); color: var(--verde); }
.check-recordar { margin: .2rem 0 .3rem; font-size: .86rem; }
.acceso-ayuda {
  margin: 1rem 0 0; font-size: .8rem; color: var(--texto-tenue); line-height: 1.45;
}

/* La clave temporal se enseña una sola vez: tiene que poder dictarse por
   teléfono e imprimirse sin ambigüedad. */
.credencial { padding: .3rem 0; }
.credencial-datos {
  display: grid; grid-template-columns: auto 1fr; gap: .6rem 1rem;
  background: var(--verde-suave); border-radius: 10px;
  padding: 1rem 1.2rem; margin: 1rem 0; align-items: center;
}
.credencial-datos dt { color: var(--texto-tenue); font-size: .82rem; }
.credencial-datos dd { margin: 0; }
.credencial-datos code {
  font-size: 1.3rem; font-weight: 600; letter-spacing: .06em;
  user-select: all; word-break: break-all;
}
.credencial-nota {
  font-size: .84rem; color: var(--texto-tenue);
  border-left: 3px solid var(--regular); padding-left: .7rem;
}

.portal-acciones { display: flex; gap: .35rem; align-items: center; }

/* Un botón que se lee como enlace: es una acción, no una navegación. */
.enlace {
  font: inherit; font-weight: 600; color: var(--verde); background: none;
  border: 0; padding: 0; cursor: pointer; text-decoration: underline;
  text-underline-offset: 2px;
}
.enlace:hover { color: var(--verde-claro); }
.acceso-proveedor ~ * .enlace, .acceso-caja .enlace { color: var(--linea-1); }

/* ======================= trabajo sin conexión ========================= */

/* Decirlo es parte del trabajo: si la app calla, la persona cree que su
   registro llegó y no vuelve a mirarlo. */
.banda-pendiente {
  background: rgba(168, 114, 15, .14); border-left: 4px solid var(--regular);
  border-radius: 8px; padding: .7rem .9rem; margin: 0 0 1rem;
  font-size: .86rem; line-height: 1.5;
}
.conexion-pendiente { color: var(--regular); }
.conexion-pendiente .conexion-punto { background: var(--regular); }
.conexion-sinred { color: var(--texto-tenue); }
.conexion-sinred .conexion-punto { background: var(--texto-tenue); animation: none; }

.lote-pendiente { border-style: dashed; border-color: var(--regular); }
.estado-pendienteenvio { color: var(--regular); }

/* ===================== cuentas de demostración ======================== */

.demo-cuentas {
  margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--borde);
  font-size: .84rem;
}
.demo-cuentas summary {
  cursor: pointer; color: var(--texto-tenue); font-weight: 600;
  list-style: none; padding: .3rem 0;
}
.demo-cuentas summary::-webkit-details-marker { display: none; }
.demo-cuentas summary::before { content: "▸ "; display: inline-block; transition: transform .15s; }
.demo-cuentas[open] summary::before { content: "▾ "; }
.demo-cuentas summary:hover { color: var(--texto); }
.demo-cuentas ul { list-style: none; margin: .6rem 0 .5rem; padding: 0; display: grid; gap: .45rem; }
.demo-cuentas li { display: flex; align-items: center; gap: .6rem; }
.demo-cuentas li span { color: var(--texto-tenue); font-size: .8rem; min-width: 0; }
.demo-cuentas li strong { color: var(--texto); font-weight: 600; }
.demo-cuentas p { margin: 0; font-size: .76rem; color: var(--texto-tenue); line-height: 1.45; }
.demo {
  font: inherit; font-family: var(--fuente-datos); font-size: .82rem; font-weight: 600;
  background: var(--verde-suave); color: var(--verde); border: 1px solid transparent;
  border-radius: 6px; padding: .3rem .55rem; cursor: pointer; white-space: nowrap; flex: 0 0 auto;
}
.demo:hover { border-color: var(--verde); }
.acceso-proveedor .demo { background: rgba(192, 36, 107, .12); color: var(--linea-1); }
.acceso-proveedor .demo:hover { border-color: var(--linea-1); }

/* ===================== estado de conexión en el acceso ================ */

.conexion {
  display: flex; align-items: center; gap: .45rem; margin: .8rem 0 0;
  font-size: .8rem; color: var(--texto-tenue);
}
.conexion-punto {
  width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
  background: var(--regular); animation: latido 1.4s ease-in-out infinite;
}
.conexion-ok { color: var(--bien); }
.conexion-ok .conexion-punto { background: var(--bien); animation: none; }

@keyframes latido {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}

/* ============================== avisos varios ========================= */

.aviso-inline {
  background: rgba(168, 114, 15, .12); border-left: 3px solid var(--regular);
  border-radius: 7px; padding: .6rem .85rem; font-size: .86rem; margin-bottom: .9rem;
}
.nav-contador {
  margin-left: auto; background: var(--linea-1); color: #fff; font-size: .7rem;
  font-weight: 700; min-width: 20px; height: 20px; border-radius: 999px;
  display: grid; place-items: center; padding: 0 .35rem;
}
.hoja-empresa {
  font-family: var(--fuente-datos); font-size: .72rem; letter-spacing: .06em;
  text-transform: uppercase; color: var(--texto-tenue); margin-bottom: .3rem;
}
.hoja-origenes { margin-top: .4rem; }

@media (max-width: 700px) {
  .demanda-fila { grid-template-columns: 1fr 100px; }
  .demanda-disp { grid-column: 1 / -1; }
  .rep-fila { grid-template-columns: 1fr 80px; grid-template-areas: "causa causa" "kg quitar" "destino destino"; }
  .rep-fila select:nth-of-type(1) { grid-area: causa; }
  .rep-fila input { grid-area: kg; }
  .rep-fila select:nth-of-type(2) { grid-area: destino; }
  .rep-fila .rep-quitar { grid-area: quitar; }
}

/* ================================ impresión =========================== */

@media print {
  :root {
    --superficie: #fff; --superficie-2: #fff; --fondo: #fff;
    --texto: #000; --texto-tenue: #444; --borde: #999; --sombra: none;
  }
  body { background: #fff; font-size: 11pt; }
  .lateral, .barra, .filtros, .atajos, .selector-reporte, .cab-acciones,
  .portal-nav, .portal-barra, .demanda,
  .medidas, .sim-campos, .sim-causas,
  .avisos, .salto, .modal-capa { display: none !important; }
  .capa, .principal { display: block; }
  main { padding: 0; max-width: none; }
  .panel, .hoja, .tabla-scroll, .kpi { box-shadow: none; border-color: #999; break-inside: avoid; }
  .hoja { border: 0; padding: 0; }
  .tabla { font-size: 9.5pt; }
  .tabla th { position: static; }
  .grid-2 { display: block; }
  .costo-partes > div, .comparativo-fila { break-inside: avoid; }
  a[href]::after { content: ""; }
  @page { margin: 1.5cm; }
}

/* ===================== costeo por causa raíz y simulador ================= */

/* Las tres partes que componen el costo, y el total destacado. */
.costo-partes {
  display: grid; gap: .7rem; margin: 1.1rem 0;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}
.costo-partes > div {
  padding: .8rem .9rem; border: 1px solid var(--borde); border-radius: var(--radio);
  background: var(--superficie-2);
}
.costo-partes span {
  display: block; font-size: .78rem; letter-spacing: .02em;
  text-transform: uppercase; color: var(--texto-tenue);
}
.costo-partes strong {
  display: block; margin: .25rem 0 .15rem; font-size: 1.3rem;
  font-family: var(--fuente-datos); font-variant-numeric: tabular-nums;
}
.costo-partes small { color: var(--texto-tenue); font-size: .78rem; line-height: 1.35; }
.costo-partes-total {
  background: var(--verde-suave); border-color: var(--verde-claro);
}
.costo-partes-total strong { color: var(--verde); }

.fila-vital td { background: color-mix(in srgb, var(--linea-1) 7%, transparent); }

.nota-aviso, .nota-ok {
  margin-top: 1rem; padding: .85rem 1rem; font-size: .88rem;
  border-radius: 6px; border-left: 3px solid;
}
.nota-aviso { background: color-mix(in srgb, var(--ambar) 10%, transparent); border-color: var(--ambar); }
.nota-ok { background: color-mix(in srgb, var(--bien) 10%, transparent); border-color: var(--bien); }

.sub-titulo { margin: 1.4rem 0 .6rem; font-size: 1rem; }

/* Medidas del diagnóstico: se activan y desactivan como interruptores. */
.medidas {
  display: grid; gap: .7rem; margin-bottom: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
}
.medida {
  display: grid; gap: .25rem; text-align: left; cursor: pointer;
  padding: .85rem .9rem .8rem; border: 1px solid var(--borde);
  border-radius: var(--radio); background: var(--superficie);
  font: inherit; color: inherit; position: relative;
  transition: border-color .12s, background .12s, transform .12s;
}
.medida:hover { border-color: var(--verde-claro); transform: translateY(-1px); }
.medida strong { font-size: .94rem; padding-right: 1.6rem; }
.medida small { color: var(--texto-tenue); font-size: .8rem; line-height: 1.35; }
.medida-cifras {
  font-family: var(--fuente-datos); font-size: .78rem; color: var(--texto-tenue);
  margin-top: .2rem;
}
.medida-marca {
  position: absolute; top: .7rem; right: .7rem; width: 1.35rem; height: 1.35rem;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--borde); color: var(--texto-tenue); font-size: .8rem; font-weight: 700;
}
.medida-on { border-color: var(--verde); background: var(--verde-suave); }
.medida-on .medida-marca { background: var(--verde); color: #fff; }

.sim-campos { margin-bottom: .6rem; }
.campo-ayuda { color: var(--texto-tenue); font-size: .78rem; }

/* Un deslizador por causa: la reducción que se supone alcanzable. */
.sim-causas { display: grid; gap: .5rem; }
.sim-causa {
  display: grid; align-items: center; gap: .8rem;
  grid-template-columns: minmax(180px, 1fr) minmax(120px, 220px) 4.2rem;
  padding: .55rem .75rem; border: 1px solid var(--borde);
  border-radius: var(--radio); background: var(--superficie-2);
}
.sim-causa-vital { border-left: 3px solid var(--linea-1); }
.sim-causa label { display: grid; gap: .1rem; font-size: .88rem; }
.sim-causa small { color: var(--texto-tenue); font-family: var(--fuente-datos); font-size: .78rem; }
.sim-causa input[type="range"] { width: 100%; accent-color: var(--verde); }
.sim-causa output {
  font-family: var(--fuente-datos); font-variant-numeric: tabular-nums;
  text-align: right; font-weight: 600;
}

.panel-resultado { border-top: 3px solid var(--verde); }

/* Antes → después de cada indicador. */
.comparativo { display: grid; gap: .4rem; }
.comparativo-fila {
  display: grid; align-items: center; gap: .6rem;
  grid-template-columns: minmax(170px, 1fr) 4.5rem 1.2rem 4.5rem 6rem;
  padding: .5rem .75rem; border: 1px solid var(--borde);
  border-radius: var(--radio); background: var(--superficie-2); font-size: .9rem;
}
.comparativo-fila small { display: block; color: var(--texto-tenue); font-size: .76rem; }
.comparativo-antes, .comparativo-despues, .comparativo-dif {
  font-family: var(--fuente-datos); font-variant-numeric: tabular-nums; text-align: right;
}
.comparativo-antes { color: var(--texto-tenue); }
.comparativo-despues { font-weight: 700; }
.comparativo-despues.mejor { color: var(--bien); }
.comparativo-flecha { color: var(--texto-tenue); text-align: center; }
.comparativo-dif { color: var(--texto-tenue); font-size: .82rem; }

.insignia-neutra {
  display: inline-block; padding: .1rem .4rem; border-radius: 4px;
  background: var(--borde); color: var(--texto-tenue); font-size: .72rem;
}

@media (max-width: 560px) {
  .sim-causa { grid-template-columns: 1fr 3.5rem; }
  .sim-causa input[type="range"] { grid-column: 1 / -1; }
  .comparativo-fila { grid-template-columns: 1fr 4.2rem 1rem 4.2rem; }
  .comparativo-dif { grid-column: 2 / -1; text-align: left; }
}

/* Un pedido terminado que lleva demasiado tiempo sin cerrarse. */
.dias-alerta { color: var(--ambar); }

/* ============================== guía de uso ============================= */

/* Texto largo: ancho de lectura cómodo, no el ancho del panel. */
.guia { max-width: 74ch; }
.guia-cab { margin-bottom: 1.6rem; padding-bottom: 1rem; border-bottom: 2px solid var(--verde); }
.guia-eyebrow {
  font-family: var(--fuente-datos); font-size: .72rem; letter-spacing: .07em;
  text-transform: uppercase; color: var(--texto-tenue); margin-bottom: .3rem;
}
.guia-cab h1 { font-size: 1.6rem; }

.guia-seccion { margin-bottom: 2rem; }
.guia-seccion h2 {
  font-size: 1.05rem; padding-bottom: .35rem; margin-bottom: .7rem;
  border-bottom: 1px solid var(--borde);
}
.guia p { line-height: 1.6; }
.guia ul { padding-left: 1.2rem; line-height: 1.6; }
.guia em { font-style: normal; font-weight: 600; color: var(--verde); }

/* Una advertencia que se lee sin leerla entera. */
.guia-ojo {
  background: var(--verde-suave); border-left: 3px solid var(--verde);
  border-radius: 6px; padding: .7rem .9rem; font-size: .9rem; margin: .9rem 0 0;
}

.guia-roles { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.guia-rol {
  display: grid; gap: .15rem; padding: .7rem .85rem; border-radius: var(--radio);
  border: 1px solid var(--borde); background: var(--superficie-2);
}
.guia-rol-icono { font-size: 1.4rem; line-height: 1; }
.guia-rol small { color: var(--texto-tenue); font-size: .82rem; line-height: 1.4; }
.guia-rol-tuyo { border-color: var(--verde); background: var(--verde-suave); }

/* El recorrido: cada estado, quién lo mueve y qué significa. */
.guia-recorrido { list-style: none; margin: .5rem 0; padding: 0; display: grid; gap: .45rem; }
.guia-recorrido li {
  display: grid; align-items: baseline; gap: .3rem .9rem;
  grid-template-columns: 7.5rem 9.5rem 1fr;
  padding: .55rem .8rem; border-radius: var(--radio);
  border: 1px solid var(--borde); border-left: 3px solid var(--verde);
  background: var(--superficie-2); font-size: .88rem;
}
.guia-recorrido-desvio { border-left-color: var(--rojo) !important; }
.guia-estado { font-weight: 700; }
.guia-quien { color: var(--texto-tenue); font-size: .82rem; }

.guia-pasos { margin: .5rem 0; padding-left: 1.3rem; display: grid; gap: .6rem; }
.guia-pasos li { line-height: 1.5; }
/* Solo el título del paso ocupa su propia línea. Antes la regla alcanzaba
   también a las negritas del texto y partía frases por la mitad. */
.guia-pasos > li > strong { display: block; }
.guia-pasos > li > span { display: block; color: var(--texto-tenue); font-size: .9rem; }

.guia-defs { margin: .5rem 0; display: grid; gap: .55rem; }
.guia-defs dt { font-weight: 700; }
.guia-defs dd { margin: .1rem 0 0; color: var(--texto-tenue); font-size: .92rem; line-height: 1.55; }

.guia-origenes { list-style: none; padding: 0; display: grid; gap: .35rem; }

.guia-faq { display: grid; gap: .4rem; }
.guia-faq details {
  border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie-2);
}
.guia-faq summary {
  cursor: pointer; padding: .6rem .85rem; font-weight: 600; font-size: .92rem;
  list-style: none;
}
.guia-faq summary::-webkit-details-marker { display: none; }
.guia-faq summary::before { content: "▸ "; color: var(--texto-tenue); }
.guia-faq details[open] summary::before { content: "▾ "; }
.guia-faq details > div {
  padding: 0 .85rem .75rem 1.5rem; font-size: .9rem; color: var(--texto-tenue); line-height: 1.55;
}

.guia-pie {
  margin-top: 2rem; padding-top: .8rem; border-top: 1px solid var(--borde);
  font-size: .76rem; color: var(--texto-tenue);
}

@media (max-width: 640px) {
  .guia-recorrido li { grid-template-columns: 1fr; gap: .15rem; }
  .guia-quien { order: -1; }
}

/* Al imprimir la guía debe salir entera: nada plegado se queda fuera. */
@media print {
  .guia-faq details { break-inside: avoid; }
  .guia-seccion { break-inside: avoid; }
}

/* ============================ campana y novedades ====================== */

/* Texto solo para lectores de pantalla. */
.sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

.campana { position: relative; padding: .5rem .7rem; }
.campana-contador {
  position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
  padding: 0 .3rem; border-radius: 999px; background: var(--linea-1); color: #fff;
  font-size: .68rem; font-weight: 700; display: grid; place-items: center;
}

.novedades {
  position: absolute; top: calc(100% + .4rem); right: 1rem; z-index: 50;
  width: min(380px, calc(100vw - 2rem)); max-height: min(70vh, 520px);
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio); box-shadow: 0 16px 40px rgba(16, 34, 28, .2);
}
.novedades-cab {
  display: flex; align-items: center; justify-content: space-between;
  padding: .7rem .9rem; border-bottom: 1px solid var(--borde);
}
.novedades-vacio { margin: 0; padding: 1.6rem 1rem; text-align: center; color: var(--texto-tenue); font-size: .88rem; }
.novedades-lista { list-style: none; margin: 0; padding: 0; overflow-y: auto; }

.novedad { border-bottom: 1px solid var(--borde); }
.novedad:last-child { border-bottom: 0; }
.novedad-btn {
  display: grid; width: 100%; text-align: left; cursor: pointer; font: inherit;
  grid-template-columns: 1.6rem 1fr auto; gap: .2rem .6rem; align-items: start;
  padding: .7rem .9rem; background: transparent; border: 0; color: inherit;
  position: relative;
}
.novedad-btn:hover { background: var(--superficie-2); }
.novedad-icono { font-size: 1.05rem; line-height: 1.3; }
.novedad-texto { min-width: 0; }
.novedad-texto strong { display: block; font-size: .88rem; }
.novedad-texto small { display: block; color: var(--texto-tenue); font-size: .8rem; line-height: 1.4; }
.novedad-fecha { font-size: .72rem; color: var(--texto-tenue); white-space: nowrap; }
.novedad-punto {
  position: absolute; left: .35rem; top: 1.05rem;
  width: 7px; height: 7px; border-radius: 50%; background: var(--linea-1);
}
.novedad-nueva { background: color-mix(in srgb, var(--verde-suave) 55%, transparent); }
.novedad-alerta .novedad-icono { filter: none; }
.novedad-alerta .novedad-texto strong { color: var(--ambar); }
.novedad-bueno .novedad-texto strong { color: var(--bien); }

/* ================================ buscador ============================= */

.buscador { display: flex; gap: .5rem; align-items: center; margin-bottom: .6rem; }
.buscador input {
  flex: 1; min-width: 0; padding: .6rem .8rem; border-radius: 999px;
  border: 1px solid var(--borde); background: var(--superficie);
}
.buscador input:focus { border-color: var(--verde); }
.buscador-cuenta { margin: -.2rem 0 .6rem; }

/* El botón de repetir vive dentro de una tarjeta que ya es pulsable. */
.lote-acciones { margin-top: .6rem; display: flex; gap: .4rem; }

@media (max-width: 560px) {
  .novedades { right: .5rem; left: .5rem; width: auto; }
}

@media print {
  .campana, .novedades, .buscador { display: none !important; }
}

/* ===================== cada módulo con su propia cara ================== */

/* Recepción, Producción y Lotes tenían la misma forma —bloque arriba,
   tabla abajo— y el mismo color, así que se leían como la misma pantalla.
   Un acento por módulo basta para saber dónde estás de un vistazo. */
.vista-recepcion .panel-destacado { border-left-color: var(--ambar); }
.vista-recepcion .panel-destacado h2 { color: var(--ambar); }
.vista-produccion .panel-destacado { border-left-color: var(--azul); }
.vista-produccion .panel-destacado h2 { color: var(--azul); }
.vista-lotes .panel-destacado { border-left-color: var(--bien); }
.vista-lotes .panel-destacado h2 { color: var(--bien); }

/* «Lo que buscas está en la otra pantalla»: mejor decirlo que repetir
   la tabla entera en los dos sitios. */
.ir-a {
  margin-top: .9rem; font-size: .86rem; color: var(--texto-tenue);
  background: var(--superficie-2); border: 1px dashed var(--borde);
  border-radius: var(--radio); padding: .7rem .9rem;
}

/* ========================= símbolos del DAP ============================ */

/* Los cinco símbolos de la norma ASME, para leer la tabla de actividades
   como se lee un diagrama de análisis del proceso. */
.dap {
  display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem;
  border-radius: 4px; font-size: .85rem; font-weight: 700; cursor: help;
}
.dap-O { background: color-mix(in srgb, var(--verde) 15%, transparent); color: var(--verde); }
.dap-T { background: color-mix(in srgb, var(--azul) 15%, transparent); color: var(--azul); }
.dap-I { background: color-mix(in srgb, var(--ambar) 18%, transparent); color: var(--ambar); }
.dap-D { background: color-mix(in srgb, var(--rojo) 15%, transparent); color: var(--rojo); }
.dap-A { background: var(--borde); color: var(--texto-tenue); }

.vista-tiempos .panel-destacado { border-left-color: var(--linea-3); }

/* ============================ «¿qué sigue?» ============================= */

/* Ningún estado del lote se marca a mano: se alcanza haciendo el trabajo.
   Este bloque dice cuál es el siguiente paso y a quién le toca, que es la
   pregunta real de quien abre una ficha. */

<script>
/* =========================================================================
   auth.js — Credenciales del Sistema FLP

   Las contraseñas NUNCA se guardan. Se guarda el resultado de derivarlas
   con PBKDF2-SHA256 y una sal distinta por persona, de modo que dos
   personas con la misma contraseña produzcan hashes distintos y no se
   pueda ir hacia atrás desde el almacén.

   Límite honesto de un prototipo sin servidor: quien pueda leer el almacén
   ve los hashes y puede intentar adivinarlos sin conexión. Por eso las
   iteraciones son altas y la política exige longitud. Un despliegue real
   debe verificar la contraseña en el servidor. Ver README §11.
   ========================================================================= */

const Auth = (function () {
  "use strict";

  const ITERACIONES = 150000;
  const LARGO_SAL = 16;
  const LARGO_CLAVE = 32;

  /* crypto.subtle solo existe en contexto seguro (https o localhost). Al
     abrir los archivos con file:// no está, y conviene decirlo en vez de
     fingir que la contraseña quedó protegida igual. */
  function disponible() {
    return typeof crypto !== "undefined" && crypto.subtle &&
      typeof crypto.subtle.deriveBits === "function";
  }

  function aHex(buffer) {
    return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
  }

  function deHex(hex) {
    const out = new Uint8Array(hex.length / 2);
    for (let i = 0; i < out.length; i += 1) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
  }

  function salAleatoria() {
    const s = new Uint8Array(LARGO_SAL);
    crypto.getRandomValues(s);
    return aHex(s);
  }

  async function derivar(clave, salHex, iteraciones) {
    const material = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({
      name: "PBKDF2", salt: deHex(salHex), iterations: iteraciones, hash: "SHA-256"
    }, material, LARGO_CLAVE * 8);
    return aHex(bits);
  }

  /* Reserva para contexto no seguro: sigue siendo con sal, pero es débil.
     Se marca como tal para que la interfaz pueda advertirlo. */
  function derivarDebil(clave, salHex) {
    let h = 0x811c9dc5;
    const texto = salHex + "|" + clave;
    for (let i = 0; i < texto.length; i += 1) {
      h ^= texto.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    let out = "";
    let x = h;
    for (let i = 0; i < 8; i += 1) {
      x = Math.imul(x ^ (x >>> 15), 0x2545f491) >>> 0;
      out += x.toString(16).padStart(8, "0");
    }
    return out;
  }

  async function crearCredencial(clave) {
    if (!disponible()) {
      const sal = "sinseguro" + Math.random().toString(36).slice(2, 10);
      return { algoritmo: "debil", sal: sal, hash: derivarDebil(clave, sal), iteraciones: 0 };
    }
    const sal = salAleatoria();
    return {
      algoritmo: "pbkdf2-sha256",
      sal: sal,
      iteraciones: ITERACIONES,
      hash: await derivar(clave, sal, ITERACIONES)
    };
  }

  async function verificar(clave, cred) {
    if (!cred || !cred.hash) return false;
    if (cred.algoritmo === "debil") return derivarDebil(clave, cred.sal) === cred.hash;
    if (!disponible()) return false;
    const h = await derivar(clave, cred.sal, cred.iteraciones || ITERACIONES);
    /* Comparación de tiempo constante: no revela cuánto acertó el intento. */
    if (h.length !== cred.hash.length) return false;
    let dif = 0;
    for (let i = 0; i < h.length; i += 1) dif |= h.charCodeAt(i) ^ cred.hash.charCodeAt(i);
    return dif === 0;
  }

  /* --------------------------------------------------------- política */

  /* Recepción y producción trabajan en terminales compartidos de planta,
     con guantes y a contraluz: ahí un PIN es más practicable que una
     contraseña larga, y el control de acceso físico lo acompaña.
     Supervisión y los proveedores sí llevan contraseña. */
  const POLITICAS = {
    proveedor: { min: 6, tipo: "text", nombre: "Contraseña",
      ayuda: "Al menos 6 caracteres. La planta te entrega una y la cambias al entrar." },
    recepcion: { min: 4, tipo: "pin", nombre: "PIN",
      ayuda: "4 a 8 dígitos. Es un terminal compartido de planta." },
    produccion: { min: 4, tipo: "pin", nombre: "PIN",
      ayuda: "4 a 8 dígitos. Es un terminal compartido de planta." },
    supervisor: { min: 8, tipo: "text", nombre: "Contraseña",
      ayuda: "Al menos 8 caracteres: este rol edita parámetros y cierra lotes." }
  };

  function politica(rol) { return POLITICAS[rol] || POLITICAS.proveedor; }

  function revisar(clave, rol) {
    const p = politica(rol);
    const v = String(clave || "");
    if (v.length < p.min) {
      return p.nombre + " demasiado corta: mínimo " + p.min +
        (p.tipo === "pin" ? " dígitos." : " caracteres.");
    }
    if (p.tipo === "pin" && !/^\d+$/.test(v)) return "El PIN debe ser solo números.";
    if (p.tipo === "pin" && v.length > 8) return "El PIN no puede pasar de 8 dígitos.";
    if (p.tipo === "text" && /^(\d)\1+$/.test(v)) return "Elige algo menos previsible.";
    return null;
  }

  /* Clave temporal legible en voz alta por teléfono, sin caracteres que se
     confundan (0/O, 1/l). La planta se la dicta al proveedor. */
  function claveTemporal(rol) {
    const p = politica(rol);
    if (p.tipo === "pin") {
      let pin = "";
      const d = new Uint32Array(4);
      crypto.getRandomValues(d);
      for (let i = 0; i < 4; i += 1) pin += String(d[i] % 10);
      return pin;
    }
    const abc = "ABCDEFGHJKMNPQRSTUVWXYZ";
    const num = "23456789";
    const r = new Uint32Array(8);
    crypto.getRandomValues(r);
    let out = "";
    for (let i = 0; i < 4; i += 1) out += abc[r[i] % abc.length];
    out += "-";
    for (let i = 4; i < 8; i += 1) out += num[r[i] % num.length];
    return out;
  }

  /* ----------------------------------------------------- intentos */

  /* Freno simple a la adivinación: tras varios fallos seguidos, la cuenta
     espera. Vive en el propio dispositivo, así que no sustituye a un
     control del servidor; sirve contra el intento manual. */
  const CLAVE_INTENTOS = "flp.intentos";
  const MAX_INTENTOS = 5;
  const ESPERA_MS = 60000;

  function leerIntentos() {
    try { return JSON.parse(localStorage.getItem(CLAVE_INTENTOS) || "{}"); }
    catch (e) { return {}; }
  }

  function guardarIntentos(d) {
    try { localStorage.setItem(CLAVE_INTENTOS, JSON.stringify(d)); } catch (e) { /* noop */ }
  }

  function bloqueo(usuario) {
    const d = leerIntentos()[String(usuario).toLowerCase()];
    if (!d || d.fallos < MAX_INTENTOS) return 0;
    const restante = d.ultimo + ESPERA_MS - Date.now();
    return restante > 0 ? Math.ceil(restante / 1000) : 0;
  }

  /* Devuelve los segundos de espera si este fallo agota los intentos, para
     poder decirlo en el mismo momento en vez de en el intento siguiente. */
  function anotarFallo(usuario) {
    const d = leerIntentos();
    const k = String(usuario).toLowerCase();
    const prev = d[k] && (Date.now() - d[k].ultimo) < ESPERA_MS ? d[k].fallos : 0;
    d[k] = { fallos: prev + 1, ultimo: Date.now() };
    guardarIntentos(d);
    return d[k].fallos >= MAX_INTENTOS ? Math.ceil(ESPERA_MS / 1000) : 0;
  }

  function limpiarFallos(usuario) {
    const d = leerIntentos();
    delete d[String(usuario).toLowerCase()];
    guardarIntentos(d);
  }

  return {
    disponible: disponible,
    crearCredencial: crearCredencial,
    verificar: verificar,
    politica: politica,
    revisar: revisar,
    claveTemporal: claveTemporal,
    bloqueo: bloqueo,
    anotarFallo: anotarFallo,
    limpiarFallos: limpiarFallos,
    MAX_INTENTOS: MAX_INTENTOS
  };
})();

</script>

  /* Deriva las credenciales de la demostración al arrancar. Es asíncrono, así
     que hasta que termina esos usuarios no pueden entrar: la interfaz lo
     refleja con el estado de conexión. */
  async function sembrarCredenciales() {
    const db = load();
    const pendientes = db.usuarios.filter(function (u) {
      return CLAVES_DEMO[u.id] && !u.credencial;
    });
    if (!pendientes.length) return;
    const credenciales = await Promise.all(pendientes.map(function (u) {
      return Auth.crearCredencial(CLAVES_DEMO[u.id]);
    }));
    /* update() reemplaza el registro por una copia nueva, así que funciona
       igual venga el original del almacén o de la semilla local. */
    pendientes.forEach(function (u, i) {
      update("usuarios", u.id, { credencial: credenciales[i] });
    });
  }

  /* Cuentas de la demostración que TODAVÍA tienen su clave original. Se
     comprueba de verdad contra la credencial guardada: si alguien la cambió,
     esa cuenta deja de aparecer en vez de mostrar una clave que ya no sirve.
     En un despliegue con usuarios reales la lista sale vacía sola. */
  async function cuentasDemo(rolesPermitidos) {
    const candidatos = all("usuarios").filter(function (u) {
      return CLAVES_DEMO[u.id] && u.credencial && u.activo &&
        (!rolesPermitidos || rolesPermitidos.indexOf(u.rol) !== -1);
    });
    const validas = await Promise.all(candidatos.map(async function (u) {
      const sirve = await Auth.verificar(CLAVES_DEMO[u.id], u.credencial);
      return sirve ? {
        nombre: u.nombre, usuario: u.usuario, clave: CLAVES_DEMO[u.id], rol: u.rol,
        detalle: u.proveedorId ? (get("proveedores", u.proveedorId) || {}).nombre : null
      } : null;
    }));
    return validas.filter(Boolean);
  }

  /* Busca por nombre de acceso o por código de proveedor, sin distinguir
     mayúsculas: en el campo se escribe como venga. */
  function buscarPorAcceso(texto) {
    const t = String(texto || "").trim().toLowerCase();
    if (!t) return null;
    return all("usuarios").find(function (u) {
      return String(u.usuario || "").toLowerCase() === t;
    }) || null;
  }

  /* Activación por el propio proveedor: se identifica con su código y su
     documento, que es lo que la planta registró y él conoce de memoria.
     Devuelve el usuario si todo cuadra, o el motivo por el que no. */
  function comprobarActivacion(codigo, documento) {
    const u = buscarPorAcceso(codigo);
    if (!u || u.rol !== "proveedor") return { error: "no-coincide" };
    if (u.credencial) return { error: "ya-activa" };

    const prov = get("proveedores", u.proveedorId);
    if (!prov) return { error: "no-coincide" };
    if (!prov.activo) return { error: "inactivo" };

    /* Se comparan solo los dígitos: da igual si escribe guiones o espacios. */
    const limpia = function (x) { return String(x || "").replace(/\D/g, ""); };
    if (!limpia(documento) || limpia(documento) !== limpia(prov.documento)) {
      return { error: "no-coincide" };
    }
    return { usuario: u, proveedor: prov };
  }

  function accesoLibre(usuario, exceptoId) {
    const t = String(usuario || "").trim().toLowerCase();
    return !all("usuarios").some(function (u) {
      return u.id !== exceptoId && String(u.usuario || "").toLowerCase() === t;
    });
  }

  /* ------------------------------------------------- tiempos derivados */

  /* El tiempo estándar NO se guarda: se calcula desde la lectura.
         TN = TO × valoración Westinghouse
         TE = TN × (1 + suplemento OIT)
     Es la cadena del estudio de tiempos, y dejarla a la vista es lo que
     permite que una medición nueva se propague sola a todo lo demás. */
  function tiempoEstandarAct(a) {
    return (Number(a.to) || 0) * (Number(a.v) || 1) * (1 + (Number(a.suplemento) || 0));
  }

  /* Cuántas cajas de exportación salen de una gaveta: es el puente entre
     la unidad que entra del campo y la que sale al contenedor. */
  function cajasPorGaveta(linea) {
    if (!linea || !linea.pesoCajaKg) return 0;
    return (linea.pesoGavetaKg * linea.rendimientoExportable) / linea.pesoCajaKg;
  }

  function actividadesDe(lineaId, lista) {
    return (lista || actividadesBase()).filter(function (a) {
      return a.lineaId === lineaId && a.activa !== false;
    });
  }

  /* Minutos de RELOJ que tarda una gaveta en recorrer la línea. */
  function cicloGavetaMin(linea, lista) {
    const porGaveta = cajasPorGaveta(linea);
    return actividadesDe(linea.id, lista).reduce(function (a, act) {
      return a + tiempoEstandarAct(act) * (act.unidad === "caja" ? porGaveta : 1);
    }, 0);
  }

  /* Minutos-PERSONA que consume esa misma gaveta. Difiere del ciclo en las
     actividades que ocupan a más de una persona a la vez. */
  function contenidoGavetaMin(linea, lista) {
    const porGaveta = cajasPorGaveta(linea);
    return actividadesDe(linea.id, lista).reduce(function (a, act) {
      return a + tiempoEstandarAct(act) * (act.unidad === "caja" ? porGaveta : 1) *
        (Number(act.personas) || 1);
    }, 0);
  }

  /* ---------------------------------------------------------------- semilla */

  function semilla(dias) {
    const r = rng(20260922);
    const historial = dias || 70;

    const lineas = lineasBase();
    const actividades = actividadesBase();
    const causas = causasBase();
    const destinos = destinosBase();
    const proveedores = proveedoresBase();
    const usuarios = usuariosBase();

    /* Cada proveedor declara con su propio sesgo: es lo que hace visible la
       CR6 (variabilidad de proveedor) en los indicadores. */
    const sesgo = { pv_01: 0.995, pv_02: 0.972, pv_03: 0.999, pv_04: 0.962, pv_05: 0.988 };

    const lotes = [];
    let folio = 0;

    for (let d = historial; d >= 0; d -= 1) {
      const fecha = diasAtras(d);
      if (new Date(fecha + "T12:00:00").getDay() === 0) continue;

      const envios = 1 + Math.floor(r() * 3);
      for (let i = 0; i < envios; i += 1) {
        const pv = proveedores[Math.floor(r() * 5)];
        const linea = lineas[Math.floor(r() * lineas.length)];
        const calidad = r() < 0.66 ? "A" : r() < 0.87 ? "B" : "C";
        /* Gavetas por envío, dimensionadas sobre el ingreso diario real de
           cada línea (2000 / 1000 / 860 kg al día). */
        const gavetasDia = linea.ingresoDiarioKg / linea.pesoGavetaKg;
        const gavetas = Math.max(8, Math.round(gavetasDia * (0.25 + r() * 0.55)));
        folio += 1;

        const lote = {
          id: uid("lt"),
          folio: "LOT-" + String(folio).padStart(4, "0"),
          codigoLote: linea.codigo + fecha.replace(/-/g, "").slice(2) + "-" + String(folio).padStart(3, "0"),
          fecha: fecha,
          proveedorId: pv.id,
          lineaId: linea.id,
          gavetasAnunciadas: gavetas,
          /* El proveedor declara cuánto pesa su gaveta: no todas vienen al
             peso nominal, y esa diferencia es parte de la CR6. */
          pesoGavetaDeclarado: Number((linea.pesoGavetaKg * (0.97 + r() * 0.06)).toFixed(2)),
          kgAnunciados: 0,
          calidadDeclarada: calidad,
          /* Se liquida por kilo recibido, no por bulto. */
          precioKg: Number((linea.valorKgProductor * (0.94 + r() * 0.12)).toFixed(3)),
          transporte: r() < 0.5 ? "Propio" : "Contratado",
          observacionesProveedor: "",
          anunciadoPor: "us_01",
          creadoEn: fecha + "T07:30:00",

          fechaRecepcion: null,
          gavetasRecibidas: null,
          kgRecibidos: null,
          calidadVerificada: null,
          observacionesRecepcion: "",
          recibidoPor: null,

          estado: "Anunciado",
          fechaCierre: null,
          cerradoPor: null,
          reporteEnviado: false,
          fechaReporte: null
        };

        lote.kgAnunciados = Math.round(gavetas * lote.pesoGavetaDeclarado);

        if (d > 1) {
          if (r() < 0.03) {
            lote.estado = "Rechazado";
            lote.fechaRecepcion = fecha;
            lote.recibidoPor = "us_03";
            lote.gavetasRecibidas = 0;
            lote.kgRecibidos = 0;
            lote.calidadVerificada = "C";
            lote.observacionesRecepcion = "Lote rechazado: fruta fuera de los mínimos de exportación.";
          } else {
            const s = sesgo[pv.id] || 0.99;
            lote.fechaRecepcion = r() < 0.85 ? fecha : sumarDias(fecha, 1);
            lote.recibidoPor = "us_03";
            lote.gavetasRecibidas = Math.max(1, Math.round(gavetas * (s + (r() - 0.5) * 0.02)));
            /* El peso por gaveta también varía: no todas vienen completas. */
            lote.kgRecibidos = Math.round(lote.gavetasRecibidas * linea.pesoGavetaKg * (0.97 + r() * 0.05));
            lote.calidadVerificada = r() < 0.18
              ? (calidad === "A" ? "B" : "C") : calidad;
            lote.estado = "Recibido";
          }
        }

        lotes.push(lote);
      }
    }

    /* ---------------------- producción ---------------------- */

    const producciones = [];
    let folioP = 0;

    lotes.forEach(function (lote) {
      if (lote.estado !== "Recibido") return;
      if (r() < 0.14) return;

      const linea = lineas.find(function (l) { return l.id === lote.lineaId; });
      const cal = CALIDADES.find(function (c) { return c.id === lote.calidadVerificada; });

      const gavetasProcesadas = lote.gavetasRecibidas;
      const kgProcesados = lote.kgRecibidos;
      /* Rendimiento en KILOS, que es como lo mide el balance de masa: de lo
         que entra a proceso, qué fracción sale empacada para exportación.
         Antes se contaba en «cajas sobre cajas», que con bultos de distinto
         peso a la entrada y a la salida no significa nada. */
      const rend = Math.min(0.995, linea.rendimientoExportable * cal.factor * (0.985 + r() * 0.03));
      const kgExportable = Math.round(kgProcesados * rend);
      const cajasExportables = Math.round(kgExportable / linea.pesoCajaKg);
      const kgMerma = kgProcesados - kgExportable;

      /* Reparto entre causas raíz. CR5-CR8 concentran la mayor parte, como
         indica el diagnóstico; las causas aún sin definir reciben poco. */
      const pesos = {
        CR5: 0.24,
        CR6: lote.calidadVerificada === "A" ? 0.14 : 0.28,
        CR7: 0.16,
        CR8: 0.20,
        CR1: 0.05, CR2: 0.04, CR3: 0.04, CR4: 0.03
      };
      const suma = Object.keys(pesos).reduce(function (a, k) { return a + pesos[k]; }, 0);

      /* Antes de segregar (CR5), casi todo el descarte va a relleno. En los
         lotes recientes ya se aplica la segregación propuesta. */
      const segrega = d3Reciente(lote.fechaRecepcion);
      const mermas = [];
      let repartido = 0;
      const claves = Object.keys(pesos);

      claves.forEach(function (k, idx) {
        let kg;
        if (idx === claves.length - 1) kg = kgMerma - repartido;
        else { kg = Math.round((kgMerma * pesos[k]) / suma); repartido += kg; }
        if (kg <= 0) return;

        let destinoId;
        if (!segrega) {
          destinoId = r() < 0.82 ? "ds_relleno" : "ds_animal";
        } else if (k === "CR6" || k === "CR5") {
          destinoId = r() < 0.5 ? "ds_segunda" : "ds_subproducto";
        } else {
          const opciones = ["ds_subproducto", "ds_animal", "ds_compost", "ds_relleno"];
          destinoId = opciones[Math.floor(r() * (r() < 0.75 ? 3 : 4))];
        }
        mermas.push({ causaId: k, kg: kg, destinoId: destinoId });
      });

      folioP += 1;
      const fechaProc = r() < 0.72 ? lote.fechaRecepcion : sumarDias(lote.fechaRecepcion, 1);

      /* Tiempo real contra el estándar: la brecha alimenta el indicador de
         eficiencia y el análisis de balanceo de línea. */
      const operarios = 3 + Math.floor(r() * 4);
      /* El estándar del lote es el contenido de trabajo —minutos-persona—
         porque es contra eso que se compara el tiempo que de verdad
