      return a + (d && d.valoriza ? (Number(m.kg) || 0) : 0);
    }, 0);
  }

  /* Valor economico recuperado del descarte, segun el destino que se le dio. */
  function valorRecuperado(prod) {
    return (prod.mermas || []).reduce(function (a, m) {
      const d = DB.destino(m.destinoId);
      return a + (d ? (Number(m.kg) || 0) * (Number(d.valorKg) || 0) : 0);
    }, 0);
  }

  /* Tiempo estandar que ese lote deberia haber tomado, segun el estudio de
     tiempos. Es la referencia contra la que se mide la eficiencia. */
  function tiempoEstandar(prod) {
    const l = DB.linea(prod.lineaId);
    return l ? (Number(prod.cajasProcesadas) || 0) * l.tiempoEstandarMin : 0;
  }

  function editable(lote) {
    return lote.estado !== "Cerrado" && lote.estado !== "Rechazado";
  }

  /* --------------------------------------------------------------- filtro */

  function filtrar(filtros) {
    const f = filtros || {};
    const desde = f.desde || "0000-01-01";
    const hasta = f.hasta || "9999-12-31";

    const lotes = DB.all("lotes").filter(function (l) {
      if (l.fecha < desde || l.fecha > hasta) return false;
      if (f.proveedorId && l.proveedorId !== f.proveedorId) return false;
      if (f.lineaId && l.lineaId !== f.lineaId) return false;
      if (f.calidad && (l.calidadVerificada || l.calidadDeclarada) !== f.calidad) return false;
      if (f.estado && l.estado !== f.estado) return false;
      return true;
    });

    const indice = {};
    lotes.forEach(function (l) { indice[l.id] = l; });

    const producciones = DB.all("producciones").filter(function (p) {
      return !!indice[p.loteId];
    });

    return { lotes: lotes, producciones: producciones, indice: indice };
  }

  function suma(lista, campo) {
    return lista.reduce(function (a, x) { return a + (Number(x[campo]) || 0); }, 0);
  }

  /* --------------------------------------------------------------- KPIs */

  function calcular(filtros) {
    const datos = filtrar(filtros);
    const lotes = datos.lotes;
    const prod = datos.producciones;

    const pesados = lotes.filter(function (l) {
      return l.cajasRecibidas !== null && l.estado !== "Rechazado";
    });

    const cajasAnunciadas = suma(lotes, "cajasAnunciadas");
    const cajasAnunPesadas = suma(pesados, "cajasAnunciadas");
    const cajasRecibidas = suma(pesados, "cajasRecibidas");
    const kgRecibidos = suma(pesados, "kgRecibidos");
    const kgAnunPesados = suma(pesados, "kgAnunciados");

    const cajasProcesadas = suma(prod, "cajasProcesadas");
    const kgProcesados = suma(prod, "kgProcesados");
    const cajasExportables = suma(prod, "cajasExportables");
    const kgExportable = suma(prod, "kgExportable");

    const kgMerma = prod.reduce(function (a, p) { return a + totalMerma(p); }, 0);
    const kgValorizado = prod.reduce(function (a, p) { return a + mermaValorizada(p); }, 0);
    const valorDescarte = prod.reduce(function (a, p) { return a + valorRecuperado(p); }, 0);

    const minutosReales = suma(prod, "tiempoRealMin");
    const minutosEstandar = prod.reduce(function (a, p) { return a + tiempoEstandar(p); }, 0);
    const horasHombre = prod.reduce(function (a, p) {
      return a + ((Number(p.tiempoRealMin) || 0) * (Number(p.operarios) || 0)) / 60;
    }, 0);

    const valorCompra = pesados.reduce(function (a, l) {
      return a + (Number(l.cajasRecibidas) || 0) * (Number(l.precioCaja) || 0);
    }, 0);

    /* Meta ponderada por la mezcla realmente procesada: si el periodo tuvo
       mucha granadilla (meta mas baja), la meta del periodo debe bajar. */
    let metaPonderada = 0;
    if (cajasProcesadas > 0) {
      const acc = prod.reduce(function (a, p) {
        const l = DB.linea(p.lineaId);
        return a + (l ? l.metaExportable : 0.8) * (Number(p.cajasProcesadas) || 0);
      }, 0);
      metaPonderada = acc / cajasProcesadas;
    }

    const tasaExportable = cajasProcesadas > 0 ? cajasExportables / cajasProcesadas : 0;
    const diferenciaCajas = cajasRecibidas - cajasAnunPesadas;

    const cerrados = lotes.filter(function (l) { return l.estado === "Cerrado" && l.fechaCierre; });
    const cicloTotal = cerrados.reduce(function (a, l) {
      return a + Math.round((new Date(l.fechaCierre) - new Date(l.fecha)) / 86400000);
    }, 0);

    const porEstado = {};
    DB.ESTADOS.forEach(function (e) {
      porEstado[e.id] = lotes.filter(function (l) { return l.estado === e.id; }).length;
    });

    const rechazados = lotes.filter(function (l) { return l.estado === "Rechazado"; });
    const cajasPerdidas = cajasProcesadas - cajasExportables;

    return {
      /* --- volumen --- */
      cajasAnunciadas: cajasAnunciadas,
      cajasRecibidas: cajasRecibidas,
      kgRecibidos: kgRecibidos,
      diferenciaCajas: diferenciaCajas,
      tasaDiferenciaCajas: cajasAnunPesadas > 0 ? diferenciaCajas / cajasAnunPesadas : 0,
      /* Dos diferencias distintas: pueden llegar todas las cajas y aun asi
         pesar menos, si vienen incompletas. */
      kgAnunciados: kgAnunPesados,
      diferenciaKg: kgRecibidos - kgAnunPesados,
      tasaDiferenciaKg: kgAnunPesados > 0 ? (kgRecibidos - kgAnunPesados) / kgAnunPesados : 0,
      cajasProcesadas: cajasProcesadas,
      kgProcesados: kgProcesados,
      cajasExportables: cajasExportables,
      kgExportable: kgExportable,
      cajasPerdidas: cajasPerdidas,

      /* --- perdidas --- */
      tasaExportable: tasaExportable,
      metaExportable: metaPonderada,
      cumplimientoMeta: metaPonderada > 0 ? tasaExportable / metaPonderada : 0,
      kgMerma: kgMerma,
      tasaMerma: kgProcesados > 0 ? kgMerma / kgProcesados : 0,

      /* --- economia circular --- */
      kgValorizado: kgValorizado,
      tasaValorizacion: kgMerma > 0 ? kgValorizado / kgMerma : 0,
      kgRelleno: kgMerma - kgValorizado,
      valorDescarte: valorDescarte,

      /* --- proceso --- */
      minutosReales: minutosReales,
      minutosEstandar: minutosEstandar,
      eficienciaTiempo: minutosReales > 0 ? minutosEstandar / minutosReales : 0,
      horasHombre: horasHombre,
      productividad: horasHombre > 0 ? cajasProcesadas / horasHombre : 0,
      minutosPorCaja: cajasProcesadas > 0 ? minutosReales / cajasProcesadas : 0,

      /* --- economico --- */
      valorCompra: valorCompra,
      costoPorCajaExportable: cajasExportables > 0 ? valorCompra / cajasExportables : 0,
      perdidaEconomica: cajasPerdidas * (cajasRecibidas > 0 ? valorCompra / cajasRecibidas : 0),

      /* --- flujo --- */
      numLotes: lotes.length,
      numProducciones: prod.length,
      porEstado: porEstado,
      numRechazados: rechazados.length,
      tasaRechazo: lotes.length > 0 ? rechazados.length / lotes.length : 0,
      cajasSinProcesar: Math.max(cajasRecibidas - cajasProcesadas, 0),
      tasaProcesamiento: cajasRecibidas > 0 ? cajasProcesadas / cajasRecibidas : 0,
      cicloPromedio: cerrados.length > 0 ? cicloTotal / cerrados.length : 0,
      numCerrados: cerrados.length,
      proveedoresActivos: new Set(lotes.map(function (l) { return l.proveedorId; })).size
    };
  }

  /* ------------------------------------------------------ agrupaciones */

  function porProveedor(filtros) {
    const datos = filtrar(filtros);
    const mapa = {};

    datos.lotes.forEach(function (l) {
      if (!mapa[l.proveedorId]) {
        mapa[l.proveedorId] = {
          proveedorId: l.proveedorId, nombre: nombreProveedor(l.proveedorId),
          lotes: 0, rechazados: 0, cajasAnunciadas: 0, cajasAnunPesadas: 0,
          cajasRecibidas: 0, kgAnunPesados: 0, kgRecibidos: 0, valor: 0, calidadA: 0,
          cajasProcesadas: 0, cajasExportables: 0, kgMerma: 0
        };
      }
      const m = mapa[l.proveedorId];
      m.lotes += 1;
      m.cajasAnunciadas += Number(l.cajasAnunciadas) || 0;
      if (l.estado === "Rechazado") { m.rechazados += 1; return; }
      if (l.cajasRecibidas === null) return;
      m.cajasAnunPesadas += Number(l.cajasAnunciadas) || 0;
      m.cajasRecibidas += Number(l.cajasRecibidas) || 0;
      m.kgAnunPesados += Number(l.kgAnunciados) || 0;
      m.kgRecibidos += Number(l.kgRecibidos) || 0;
      m.valor += (Number(l.cajasRecibidas) || 0) * (Number(l.precioCaja) || 0);
      if (l.calidadVerificada === "A") m.calidadA += Number(l.cajasRecibidas) || 0;
    });

    datos.producciones.forEach(function (p) {
      const lote = datos.indice[p.loteId];
      if (!lote || !mapa[lote.proveedorId]) return;
      const m = mapa[lote.proveedorId];
      m.cajasProcesadas += Number(p.cajasProcesadas) || 0;
      m.cajasExportables += Number(p.cajasExportables) || 0;
      m.kgMerma += totalMerma(p);
    });

    return Object.keys(mapa).map(function (k) {
      const m = mapa[k];
      m.tasaExportable = m.cajasProcesadas > 0 ? m.cajasExportables / m.cajasProcesadas : 0;
      m.pctCalidadA = m.cajasRecibidas > 0 ? m.calidadA / m.cajasRecibidas : 0;
      m.precioPromedio = m.cajasRecibidas > 0 ? m.valor / m.cajasRecibidas : 0;
      m.diferenciaCajas = m.cajasRecibidas - m.cajasAnunPesadas;
      m.tasaDiferencia = m.cajasAnunPesadas > 0 ? m.diferenciaCajas / m.cajasAnunPesadas : 0;
      m.tasaDiferenciaKg = m.kgAnunPesados > 0
        ? (m.kgRecibidos - m.kgAnunPesados) / m.kgAnunPesados : 0;
      m.pesoCajaReal = m.cajasRecibidas > 0 ? m.kgRecibidos / m.cajasRecibidas : 0;
      m.tasaRechazo = m.lotes > 0 ? m.rechazados / m.lotes : 0;
      /* Indice de variabilidad: es la CR6 hecha numero. Combina lo que el
         proveedor falla al declarar, lo que le rechazan y lo que rinde. */
      m.indiceVariabilidad = Math.abs(m.tasaDiferencia) + m.tasaRechazo +
        Math.max(0, 0.8 - m.tasaExportable);
      return m;
    }).sort(function (a, b) { return b.cajasRecibidas - a.cajasRecibidas; });
  }

  function porLinea(filtros) {
    const datos = filtrar(filtros);
    const mapa = {};

    function bucket(id) {
      if (!mapa[id]) {
        const l = DB.linea(id);
        mapa[id] = {
          lineaId: id, nombre: nombreLinea(id), color: colorLinea(id),
          meta: l ? l.metaExportable : 0, tiempoEstandarMin: l ? l.tiempoEstandarMin : 0,
          cajasRecibidas: 0, cajasProcesadas: 0, cajasExportables: 0,
          kgMerma: 0, kgValorizado: 0, minutosReales: 0, minutosEstandar: 0
        };
      }
      return mapa[id];
    }

    datos.lotes.forEach(function (l) {
      bucket(l.lineaId).cajasRecibidas += Number(l.cajasRecibidas) || 0;
    });
    datos.producciones.forEach(function (p) {
      const b = bucket(p.lineaId);
      b.cajasProcesadas += Number(p.cajasProcesadas) || 0;
      b.cajasExportables += Number(p.cajasExportables) || 0;
      b.kgMerma += totalMerma(p);
      b.kgValorizado += mermaValorizada(p);
      b.minutosReales += Number(p.tiempoRealMin) || 0;
      b.minutosEstandar += tiempoEstandar(p);
    });

    return Object.keys(mapa).map(function (k) {
      const m = mapa[k];
      m.tasaExportable = m.cajasProcesadas > 0 ? m.cajasExportables / m.cajasProcesadas : 0;
      m.brecha = m.tasaExportable - m.meta;
      m.eficiencia = m.minutosReales > 0 ? m.minutosEstandar / m.minutosReales : 0;
      m.minutosPorCaja = m.cajasProcesadas > 0 ? m.minutosReales / m.cajasProcesadas : 0;
      m.tasaValorizacion = m.kgMerma > 0 ? m.kgValorizado / m.kgMerma : 0;
      return m;
    }).sort(function (a, b) { return b.cajasRecibidas - a.cajasRecibidas; });
  }

  /* Pareto por causa raiz: cuanto pesa cada CR en la perdida total. Es el
     indicador que sostiene la priorizacion CR5-CR8 del diagnostico. */
  function porCausaRaiz(filtros) {
    const prod = filtrar(filtros).producciones;
    const mapa = {};

    DB.all("causas").forEach(function (c) {
      mapa[c.id] = {
        causaId: c.id, codigo: c.codigo, nombre: c.nombre,
        etiqueta: c.codigo + " · " + c.nombre,
        origen: c.origen, definida: c.definida, principal: c.principal,
        kg: 0, valorPerdido: 0
      };
    });

    prod.forEach(function (p) {
      const l = DB.linea(p.lineaId);
      const valorKg = l && l.pesoCajaKg ? l.precioCaja / l.pesoCajaKg : 0;
      (p.mermas || []).forEach(function (m) {
        if (!mapa[m.causaId]) return;
        const kg = Number(m.kg) || 0;
        const d = DB.destino(m.destinoId);
        mapa[m.causaId].kg += kg;
        /* Lo perdido es la diferencia entre lo que valia como exportacion y
           lo que finalmente se recupero por su destino. */
        mapa[m.causaId].valorPerdido += kg * (valorKg - (d ? (Number(d.valorKg) || 0) : 0));
      });
    });

    const lista = Object.keys(mapa).map(function (k) { return mapa[k]; })
      .filter(function (x) { return x.kg > 0; })
      .sort(function (a, b) { return b.kg - a.kg; });

    const total = lista.reduce(function (a, x) { return a + x.kg; }, 0);
    let acumulado = 0;
    lista.forEach(function (x) {
      x.porcentaje = total > 0 ? x.kg / total : 0;
      acumulado += x.porcentaje;
      x.acumulado = acumulado;
    });
    return lista;
  }

  /* Reparto del descarte por destino: la foto de la economia circular. */
  function porDestino(filtros) {
    const prod = filtrar(filtros).producciones;
    const mapa = {};

    DB.all("destinos").forEach(function (d) {
      mapa[d.id] = {
        destinoId: d.id, nombre: d.nombre, nivel: d.nivel,
        valoriza: d.valoriza, valorKg: d.valorKg, kg: 0, valor: 0
      };
    });

    prod.forEach(function (p) {
      (p.mermas || []).forEach(function (m) {
        if (!mapa[m.destinoId]) return;
        const kg = Number(m.kg) || 0;
        mapa[m.destinoId].kg += kg;
        mapa[m.destinoId].valor += kg * (Number(mapa[m.destinoId].valorKg) || 0);
      });
    });

    return Object.keys(mapa).map(function (k) { return mapa[k]; })
      .filter(function (x) { return x.kg > 0; })
      .sort(function (a, b) { return a.nivel - b.nivel; });
  }

  function porCalidad(filtros) {
    const lotes = filtrar(filtros).lotes;
    return DB.CALIDADES.map(function (c) {
      const items = lotes.filter(function (l) {
        return (l.calidadVerificada || l.calidadDeclarada) === c.id && l.estado !== "Rechazado";
      });
      return {
        id: c.id, nombre: c.nombre,
        kg: items.reduce(function (a, l) {
          return a + (Number(l.cajasRecibidas) || Number(l.cajasAnunciadas) || 0);
        }, 0),
        lotes: items.length
      };
    }).filter(function (x) { return x.kg > 0; });
  }

  function serie(filtros, granularidad) {
    const datos = filtrar(filtros);
    const corte = granularidad === "mes" ? 7 : 10;
    const mapa = {};

    function bucket(fecha) {
      const k = fecha.slice(0, corte);
      if (!mapa[k]) mapa[k] = { periodo: k, recibido: 0, procesado: 0, exportable: 0 };
      return mapa[k];
    }

    datos.lotes.forEach(function (l) {
      if (l.cajasRecibidas === null) return;
      bucket(l.fechaRecepcion || l.fecha).recibido += Number(l.cajasRecibidas) || 0;
    });
    datos.producciones.forEach(function (p) {
      const b = bucket(p.fecha);
      b.procesado += Number(p.cajasProcesadas) || 0;
      b.exportable += Number(p.cajasExportables) || 0;
    });

    return Object.keys(mapa).sort().map(function (k) {
      const m = mapa[k];
      m.tasaExportable = m.procesado > 0 ? m.exportable / m.procesado : 0;
      return m;
    });
  }

  /* ------------------------------------------------- planificación diaria */

  /* Dado un plan de produccion (cajas por linea) y los parametros de planta,
     calcula el takt time, la carga de cada linea y si el turno alcanza.
     Es el nucleo del modulo de planificacion diaria. */
  function planificar(plan) {
    const p = DB.parametros();
    const horas = Number(plan.horasTurno) || p.horasTurno;
    const operarios = Number(plan.operarios) || p.operariosDisponibles;
    const eficiencia = Number(plan.eficiencia) || p.eficienciaPlanta;

    /* Minutos productivos: el turno menos los suplementos de la OIT, y
       ajustado por la eficiencia observada de la planta. */
    const minutosTurno = horas * 60;
    const minutosNetosPorOperario = minutosTurno * (1 - p.suplementosOIT) * eficiencia;
    const capacidadTotalMin = minutosNetosPorOperario * operarios;

    const detalle = (plan.lineas || []).map(function (item) {
      const linea = DB.linea(item.lineaId);
      if (!linea) return null;
      const cajas = Number(item.cajas) || 0;
      const minutosRequeridos = cajas * linea.tiempoEstandarMin;
      const operariosNecesarios = minutosNetosPorOperario > 0
        ? minutosRequeridos / minutosNetosPorOperario : 0;

      return {
        lineaId: linea.id,
        nombre: linea.nombre,
        color: linea.color,
        cajas: cajas,
        tiempoEstandarMin: linea.tiempoEstandarMin,
        minutosRequeridos: minutosRequeridos,
        horasRequeridas: minutosRequeridos / 60,
        operariosNecesarios: operariosNecesarios,
        /* Takt time: cada cuantos minutos debe salir una caja para cumplir. */
        taktMin: cajas > 0 ? minutosTurno / cajas : 0,
        kg: cajas * linea.pesoCajaKg,
        valor: cajas * linea.precioCaja
      };
    }).filter(Boolean);

    const minutosRequeridos = detalle.reduce(function (a, d) { return a + d.minutosRequeridos; }, 0);
    const cajasTotales = detalle.reduce(function (a, d) { return a + d.cajas; }, 0);
    const operariosNecesarios = detalle.reduce(function (a, d) { return a + d.operariosNecesarios; }, 0);

    /* Carga: >1 significa que el plan no cabe en el turno con esa gente. */
    const carga = capacidadTotalMin > 0 ? minutosRequeridos / capacidadTotalMin : 0;

    detalle.forEach(function (d) {
      d.participacion = minutosRequeridos > 0 ? d.minutosRequeridos / minutosRequeridos : 0;
      d.operariosAsignados = operariosNecesarios > 0
        ? Math.round((d.operariosNecesarios / operariosNecesarios) * operarios * 10) / 10 : 0;
    });

    /* Materia prima realmente disponible en camara para cada linea. */
    const disponible = {};
    DB.all("lotes").forEach(function (l) {
      if (l.estado !== "Recibido") return;
      disponible[l.lineaId] = (disponible[l.lineaId] || 0) + (Number(l.cajasRecibidas) || 0);
    });
    detalle.forEach(function (d) {
      d.disponible = disponible[d.lineaId] || 0;
      d.faltante = Math.max(0, d.cajas - d.disponible);
    });

    return {
      detalle: detalle,
      cajasTotales: cajasTotales,
      kgTotales: detalle.reduce(function (a, d) { return a + d.kg; }, 0),
      valorTotal: detalle.reduce(function (a, d) { return a + d.valor; }, 0),
      minutosRequeridos: minutosRequeridos,
      horasRequeridas: minutosRequeridos / 60,
      capacidadTotalMin: capacidadTotalMin,
      capacidadHoras: capacidadTotalMin / 60,
      carga: carga,
      alcanza: carga <= 1,
      operarios: operarios,
      operariosNecesarios: operariosNecesarios,
      operariosFaltantes: Math.max(0, Math.ceil(operariosNecesarios - operarios)),
      horasTurno: horas,
      minutosNetosPorOperario: minutosNetosPorOperario,
      taktPromedio: cajasTotales > 0 ? minutosTurno / cajasTotales : 0,
      costoManoObra: (operarios * horas) * p.costoHoraHombre,
      hayFaltantes: detalle.some(function (d) { return d.faltante > 0; })
    };
  }

  /* ---------------------------------------------------- ficha del lote */

  function fichaLote(loteId) {
    const lote = DB.get("lotes", loteId);
    if (!lote) return null;
    const prod = DB.all("producciones").find(function (p) { return p.loteId === loteId; }) || null;
    const linea = DB.linea(lote.lineaId);

    const dif = lote.cajasRecibidas === null ? null : lote.cajasRecibidas - lote.cajasAnunciadas;
    const difKg = lote.kgRecibidos === null ? null : lote.kgRecibidos - (lote.kgAnunciados || 0);
    const kgMerma = prod ? totalMerma(prod) : 0;

    return {
      lote: lote,
      produccion: prod,
      linea: linea,
      proveedor: DB.get("proveedores", lote.proveedorId),
      diferenciaCajas: dif,
      tasaDiferencia: dif === null || !lote.cajasAnunciadas ? null : dif / lote.cajasAnunciadas,
      diferenciaKg: difKg,
      tasaDiferenciaKg: difKg === null || !lote.kgAnunciados ? null : difKg / lote.kgAnunciados,
      pesoCajaReal: lote.cajasRecibidas ? lote.kgRecibidos / lote.cajasRecibidas : null,
      valor: (lote.cajasRecibidas || 0) * (lote.precioCaja || 0),
      kgMerma: kgMerma,
      kgValorizado: prod ? mermaValorizada(prod) : 0,
      tasaValorizacion: prod && kgMerma > 0 ? mermaValorizada(prod) / kgMerma : null,
      valorDescarte: prod ? valorRecuperado(prod) : 0,
      tasaExportable: prod && prod.cajasProcesadas > 0
        ? prod.cajasExportables / prod.cajasProcesadas : null,
      meta: linea ? linea.metaExportable : null,
      tiempoEstandarMin: prod ? tiempoEstandar(prod) : 0,
      eficiencia: prod && prod.tiempoRealMin > 0 ? tiempoEstandar(prod) / prod.tiempoRealMin : null,
      mermas: prod ? (prod.mermas || []).slice().sort(function (a, b) { return b.kg - a.kg; }) : []
    };
  }

  /* ================================================================= costeo
     Cuánto cuesta cada causa raíz, en dinero. Es el puente entre el
     diagnóstico (kg perdidos por CR) y la decisión de inversión: mientras la
     pérdida se mide en kilos nadie la prioriza; medida en dólares al año, sí.

     El costo de una pérdida tiene tres partes, y las tres se suman:
       · la fruta        — lo que valía esa fruta puesta como exportación
       · la recuperación — lo que el destino devuelve (en relleno es NEGATIVA:
                           se paga por botar, de ahí el valorKg -0.02)
       · la transformación — las horas-hombre ya invertidas en fruta que al
                           final no se exportó; el estudio de tiempos las da
                           por caja, así que se prorratean por kilo.
     ==================================================================== */

  /* Días sobre los que se proyecta. Se toma el tramo que realmente tiene
     registros, no el rango del filtro: con un filtro muy ancho —o abierto—
     el rango diría "cien años" y la proyección anual saldría en nada. Si el
     filtro es más estrecho que los datos, manda el filtro. */
  function diasDelPeriodo(filtros, datos) {
    const f = filtros || {};
    let dias = null;
    if (f.desde && f.hasta) {
      const d = Math.round((new Date(f.hasta) - new Date(f.desde)) / 86400000) + 1;
      if (d > 0) dias = d;
    }
    const fechas = datos.producciones.map(function (p) { return p.fecha; })
      .concat(datos.lotes.map(function (l) { return l.fecha; }))
      .filter(Boolean).sort();
    if (fechas.length) {
      const d = Math.round(
        (new Date(fechas[fechas.length - 1]) - new Date(fechas[0])) / 86400000) + 1;
      if (d > 0) dias = dias === null ? d : Math.min(dias, d);
    }
    return dias === null || dias < 1 ? 1 : dias;
  }

  function costeo(filtros) {
    const p = DB.parametros();
    const datos = filtrar(filtros);
    const prod = datos.producciones;
    const dias = diasDelPeriodo(filtros, datos);
    const factorAnual = 365 / dias;

    const mapa = {};
    DB.all("causas").forEach(function (c) {
      mapa[c.id] = {
        causaId: c.id, codigo: c.codigo, nombre: c.nombre,
        etiqueta: c.codigo + " · " + c.nombre,
        origen: c.origen, definida: c.definida, principal: c.principal,
        descripcion: c.descripcion || "",
        kg: 0, kgSinValorizar: 0, cajasEquivalentes: 0,
        valorFruta: 0, valorRecuperado: 0, costoTransformacion: 0
      };
    });

    prod.forEach(function (pr) {
      const l = DB.linea(pr.lineaId);
      const peso = l && l.pesoCajaKg ? l.pesoCajaKg : DB.PESO_CAJA_KG;
      const valorKg = l ? l.precioCaja / peso : 0;
      const minutosPorKg = l ? l.tiempoEstandarMin / peso : 0;

      (pr.mermas || []).forEach(function (m) {
        const f = mapa[m.causaId];
        if (!f) return;
        const kg = Number(m.kg) || 0;
        const d = DB.destino(m.destinoId);
        f.kg += kg;
        f.cajasEquivalentes += kg / peso;
        f.valorFruta += kg * valorKg;
        f.valorRecuperado += kg * (d ? (Number(d.valorKg) || 0) : 0);
        f.costoTransformacion += (kg * minutosPorKg / 60) * p.costoHoraHombre;
        if (!d || !d.valoriza) f.kgSinValorizar += kg;
      });
    });

    const lista = Object.keys(mapa).map(function (k) { return mapa[k]; })
      .filter(function (x) { return x.kg > 0; });

    lista.forEach(function (x) {
      x.costoTotal = x.valorFruta - x.valorRecuperado + x.costoTransformacion;
      x.costoPorKg = x.kg > 0 ? x.costoTotal / x.kg : 0;
      x.costoDiario = x.costoTotal / dias;
      x.costoAnual = x.costoTotal * factorAnual;
      x.kgAnual = x.kg * factorAnual;
    });
    lista.sort(function (a, b) { return b.costoTotal - a.costoTotal; });

    const total = lista.reduce(function (a, x) { return a + x.costoTotal; }, 0);
    let acumulado = 0;
    lista.forEach(function (x) {
      x.porcentaje = total > 0 ? x.costoTotal / total : 0;
      acumulado += x.porcentaje;
      x.acumulado = acumulado;
      /* Pareto: las primeras causas hasta cubrir el 80% son las "vitales". */
      x.vital = x.acumulado - x.porcentaje < 0.8;
    });

    function sumar(campo) {
      return lista.reduce(function (a, x) { return a + x[campo]; }, 0);
    }

    return {
      lista: lista,
      dias: dias,
      factorAnual: factorAnual,
      costoHoraHombre: p.costoHoraHombre,
      kg: sumar("kg"),
      kgSinValorizar: sumar("kgSinValorizar"),
      cajasEquivalentes: sumar("cajasEquivalentes"),
      valorFruta: sumar("valorFruta"),
      valorRecuperado: sumar("valorRecuperado"),
      costoTransformacion: sumar("costoTransformacion"),
      costoTotal: total,
      costoDiario: total / dias,
      costoMensual: total * factorAnual / 12,
      costoAnual: total * factorAnual,
      /* Cuántas causas concentran el 80% del dinero perdido. */
      vitales: lista.filter(function (x) { return x.vital; }).length,
      sinClasificar: lista.filter(function (x) { return !x.definida; })
        .reduce(function (a, x) { return a + x.costoTotal; }, 0)
    };
  }

  /* ============================================================ simulador
     Escenario "con mejora": se decide cuánto se cree que baja cada causa y
     cuánto costaría lograrlo. Devuelve ahorro anual, recuperación de la
     inversión (payback) y el valor actual neto a tres años, para que la
     propuesta de la tesis se defienda con números y no con intenciones.

     Las reducciones son SUPUESTOS (origen S): el sistema las deja editar y
     las muestra como tales, nunca como dato medido.
     ==================================================================== */

  const TASA_DESCUENTO = 0.12;          // costo de oportunidad anual, supuesto
  const ANIOS_VAN = 3;

  /* Medidas del diagnóstico, con una estimación inicial editable. */
  const ESCENARIOS = [
    { id: "esc_segregacion", nombre: "Segregar la merma en la línea",
      causas: ["CR5"], reduccion: 0.35, valorizacion: 0.60, inversion: 1800,
      recurrenteAnual: 900,
      detalle: "Contenedores identificados por destino y un responsable por turno." },
    { id: "esc_proveedores", nombre: "Estandarizar la entrega del proveedor",
      causas: ["CR6"], reduccion: 0.30, valorizacion: 0.10, inversion: 1200,
      recurrenteAnual: 1400,
      detalle: "Ficha técnica, capacitación en campo y verificación de peso por caja." },
    { id: "esc_layout", nombre: "Reordenar el layout de planta",
      causas: ["CR7"], reduccion: 0.40, valorizacion: 0, inversion: 4500,
      recurrenteAnual: 0,
      detalle: "Recorrido en línea recta entre recepción, selección y empaque." },
    { id: "esc_sopleteado", nombre: "Balancear la estación de sopleteado",
      causas: ["CR8"], reduccion: 0.45, valorizacion: 0, inversion: 2600,
      recurrenteAnual: 300,
      detalle: "Reasignar operarios según el takt time y nivelar la carga." }
  ];

  function acotar(x) { return Math.max(0, Math.min(1, Number(x) || 0)); }

  /* esc = {
       filtros, reducciones:{CRx:0..1}, inversion, recurrenteAnual,
       valorizacion: 0..1 (cuánto del residuo que hoy va a relleno se
       valoriza), valorKgObjetivo: $/kg del destino al que se movería
     } */
  function simular(esc) {
    const e = esc || {};
    const base = costeo(e.filtros);
    const red = e.reducciones || {};
    const destinoObjetivo = DB.destino(e.destinoObjetivoId) ||
      DB.all("destinos").filter(function (d) { return d.valoriza; })
        .sort(function (a, b) { return b.valorKg - a.valorKg; })[1] || null;
    const relleno = DB.all("destinos").find(function (d) { return !d.valoriza; });
    const valorObjetivo = e.valorKgObjetivo !== undefined
      ? Number(e.valorKgObjetivo) || 0
      : (destinoObjetivo ? destinoObjetivo.valorKg : 0);
    const valorRelleno = relleno ? Number(relleno.valorKg) || 0 : 0;

    const detalle = base.lista.map(function (c) {
      const r = acotar(red[c.causaId]);
      return {
        causaId: c.causaId, codigo: c.codigo, nombre: c.nombre,
        etiqueta: c.etiqueta, principal: c.principal, definida: c.definida,
        reduccion: r,
        kgAnual: c.kgAnual,
        kgEvitadosAnual: c.kgAnual * r,
        costoAnual: c.costoAnual,
        costoAnualConMejora: c.costoAnual * (1 - r),
        ahorroAnual: c.costoAnual * r
      };
    });

    const ahorroCausas = detalle.reduce(function (a, x) { return a + x.ahorroAnual; }, 0);
    const kgEvitados = detalle.reduce(function (a, x) { return a + x.kgEvitadosAnual; }, 0);

    /* Lo que aun así se descarta y hoy termina en relleno: valorizarlo no
       evita la pérdida, pero recupera parte y deja de pagar disposición.

       Lo evitado no se resta en bruto: las reducciones actúan sobre TODA la
       merma, no solo sobre la que va al relleno. Se aplica la reducción
       media ponderada por kilo, que es la fracción del descarte que deja de
       existir; restar los kilos evitados sin más dejaba el relleno en cero y
       la valorización en cero con él. */
    const kgTotalAnual = base.lista.reduce(function (a, x) { return a + x.kgAnual; }, 0);
    const reduccionMedia = kgTotalAnual > 0 ? kgEvitados / kgTotalAnual : 0;
    const kgRellenoAnual = base.kgSinValorizar * base.factorAnual;
    const kgRellenoRestante = kgRellenoAnual * (1 - reduccionMedia);
    const fraccion = acotar(e.valorizacion);
    const kgValorizados = kgRellenoRestante * fraccion;
    const ahorroValorizacion = kgValorizados * (valorObjetivo - valorRelleno);

    const inversion = Math.max(0, Number(e.inversion) || 0);
    const recurrente = Math.max(0, Number(e.recurrenteAnual) || 0);
    const ahorroBruto = ahorroCausas + ahorroValorizacion;
    const ahorroNeto = ahorroBruto - recurrente;

    /* Payback simple sobre el flujo neto. Sin ahorro neto no hay retorno:
       se devuelve null y la pantalla lo dice, en vez de un número absurdo. */
    const paybackMeses = ahorroNeto > 0 && inversion > 0
      ? (inversion / ahorroNeto) * 12 : (inversion === 0 ? 0 : null);

    let van = -inversion;
    for (let t = 1; t <= ANIOS_VAN; t += 1) {
      van += ahorroNeto / Math.pow(1 + TASA_DESCUENTO, t);
    }

    /* Cómo quedarían los indicadores del periodo con la mejora aplicada. */
    const ind = calcular(e.filtros);
    const pesoCaja = DB.PESO_CAJA_KG;
    const cajasRecuperadas = (kgEvitados / base.factorAnual) / pesoCaja;
    const kgMermaConMejora = Math.max(0, ind.kgMerma - kgEvitados / base.factorAnual);
    const kgValorizadoConMejora = Math.min(
      kgMermaConMejora,
      ind.kgValorizado + kgValorizados / base.factorAnual
    );

    return {
      base: base,
      detalle: detalle,
      inversion: inversion,
      recurrenteAnual: recurrente,
      ahorroCausas: ahorroCausas,
      ahorroValorizacion: ahorroValorizacion,
      ahorroBruto: ahorroBruto,
      ahorroNeto: ahorroNeto,
      ahorroMensual: ahorroNeto / 12,
      kgEvitadosAnual: kgEvitados,
      kgValorizadosAnual: kgValorizados,
      valorKgObjetivo: valorObjetivo,
      destinoObjetivo: destinoObjetivo ? destinoObjetivo.nombre : "—",
      paybackMeses: paybackMeses,
      paybackAnios: paybackMeses === null ? null : paybackMeses / 12,
      van: van,
      tasaDescuento: TASA_DESCUENTO,
      aniosVan: ANIOS_VAN,
      /* Beneficio/costo: dólares ahorrados en el horizonte por dólar puesto. */
      beneficioCosto: inversion > 0 ? (ahorroNeto * ANIOS_VAN) / inversion : null,
      viable: ahorroNeto > 0 && van > 0,
      costoAnualActual: base.costoAnual,
      costoAnualConMejora: Math.max(0, base.costoAnual - ahorroBruto) + recurrente,
      indicadores: {
        tasaMerma: ind.tasaMerma,
        tasaMermaConMejora: ind.kgProcesados > 0 ? kgMermaConMejora / ind.kgProcesados : 0,
        tasaExportable: ind.tasaExportable,
        tasaExportableConMejora: ind.cajasProcesadas > 0
          ? Math.min(1, (ind.cajasExportables + cajasRecuperadas) / ind.cajasProcesadas)
          : 0,
        metaExportable: ind.metaExportable,
        tasaValorizacion: ind.tasaValorizacion,
        tasaValorizacionConMejora: kgMermaConMejora > 0
          ? kgValorizadoConMejora / kgMermaConMejora : 0,
        cajasRecuperadas: cajasRecuperadas
      }
    };
  }

  /* Escenario armado a partir de las medidas elegidas del diagnóstico. */
  function escenarioDeMedidas(ids, filtros) {
    const elegidas = ESCENARIOS.filter(function (m) { return ids.indexOf(m.id) !== -1; });
    const reducciones = {};
    let inversion = 0, recurrente = 0, valorizacion = 0;
    elegidas.forEach(function (m) {
      m.causas.forEach(function (c) {
        /* Dos medidas sobre la misma causa no suman linealmente: se combinan
           como reducciones sucesivas, que es lo que de verdad pasa. */
        const previa = reducciones[c] || 0;
        reducciones[c] = previa + m.reduccion * (1 - previa);
      });
      inversion += m.inversion;
      recurrente += m.recurrenteAnual;
      valorizacion = valorizacion + (m.valorizacion || 0) * (1 - valorizacion);
    });
    return {
      filtros: filtros, reducciones: reducciones, inversion: inversion,
      recurrenteAnual: recurrente, valorizacion: valorizacion,
      medidas: elegidas.map(function (m) { return m.id; })
    };
  }

  return {
    filtrar: filtrar,
    calcular: calcular,
    porProveedor: porProveedor,
    porLinea: porLinea,
    porCausaRaiz: porCausaRaiz,
    porDestino: porDestino,
    porCalidad: porCalidad,
    serie: serie,
    planificar: planificar,
    costeo: costeo,
    simular: simular,
    escenarioDeMedidas: escenarioDeMedidas,
    ESCENARIOS: ESCENARIOS,
    fichaLote: fichaLote,
    totalMerma: totalMerma,
    mermaValorizada: mermaValorizada,
    valorRecuperado: valorRecuperado,
    tiempoEstandar: tiempoEstandar,
    editable: editable,
    nombreLinea: nombreLinea,
    nombreProveedor: nombreProveedor,
    nombreUsuario: nombreUsuario,
    nombreCausa: nombreCausa,
    nombreDestino: nombreDestino,
    colorLinea: colorLinea
  };
})();

</script>

<script>
/* =========================================================================
   graficos.js — Gráficos en SVG generados a mano
   Sin librerías externas: la app debe poder ejecutarse sin internet.
   Cada función devuelve una cadena de marcado SVG lista para inyectar.
   ========================================================================= */

const Graficos = (function () {
  "use strict";

  /* Los tres primeros colores son los de las lineas de producto: pitahaya
     roja, tomate de arbol y granadilla. El resto completa la escala. */
  const PALETA = ["#c0246b", "#c85a1e", "#b8860b", "#2f6f8f", "#5b8c3a", "#7a5ba8"];

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fmt(n) {
    return new Intl.NumberFormat("es-EC", { maximumFractionDigits: 0 }).format(n);
  }

  function vacio(mensaje) {
    return '<p class="grafico-vacio">' + esc(mensaje || "Sin datos en el período seleccionado.") + "</p>";
  }

  function escalaBonita(max) {
    if (max <= 0) return 1;
    const exp = Math.pow(10, Math.floor(Math.log10(max)));
    const norm = max / exp;
    const paso = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return paso * exp;
  }

  /* ------------------------------------------------- líneas / tendencia */

  function lineas(puntos, opciones) {
    const o = opciones || {};
    if (!puntos.length) return vacio();

    const W = 720, H = 260;
    const m = { t: 16, r: 16, b: 34, l: 56 };
    const iw = W - m.l - m.r;
    const ih = H - m.t - m.b;

    const series = o.series || [
      { campo: "recibido", nombre: "Recibido", color: PALETA[0] },
      { campo: "procesado", nombre: "Procesado", color: PALETA[1] }
    ];

    let max = 0;
    puntos.forEach(function (p) {
      series.forEach(function (s) { max = Math.max(max, Number(p[s.campo]) || 0); });
    });
    max = escalaBonita(max);

    const x = function (i) {
      return m.l + (puntos.length === 1 ? iw / 2 : (i * iw) / (puntos.length - 1));
    };
    const y = function (v) {
      return m.t + ih - (Math.min(v, max) / max) * ih;
    };

    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" class="chart" role="img" ' +
      'aria-label="' + esc(o.titulo || "Tendencia") + '" preserveAspectRatio="xMidYMid meet">';

    /* Rejilla y eje Y */
    for (let g = 0; g <= 4; g += 1) {
      const v = (max / 4) * g;
      const yy = y(v);
      svg += '<line x1="' + m.l + '" y1="' + yy + '" x2="' + (W - m.r) + '" y2="' + yy +
        '" class="chart-grid"/>';
      svg += '<text x="' + (m.l - 8) + '" y="' + (yy + 4) + '" class="chart-tick chart-tick-y">' +
        fmt(v) + "</text>";
    }

    /* Eje X: como máximo 6 etiquetas para que no se encimen */
    const salto = Math.max(1, Math.ceil(puntos.length / 6));
    puntos.forEach(function (p, i) {
      if (i % salto !== 0 && i !== puntos.length - 1) return;
      svg += '<text x="' + x(i) + '" y="' + (H - 10) + '" class="chart-tick chart-tick-x">' +
        esc(p.periodo.slice(5)) + "</text>";
    });

    /* Series */
    series.forEach(function (s) {
      const d = puntos.map(function (p, i) {
        return (i === 0 ? "M" : "L") + x(i).toFixed(1) + " " + y(Number(p[s.campo]) || 0).toFixed(1);
      }).join(" ");
      const area = d + " L" + x(puntos.length - 1).toFixed(1) + " " + (m.t + ih) +
        " L" + x(0).toFixed(1) + " " + (m.t + ih) + " Z";
      svg += '<path d="' + area + '" fill="' + s.color + '" opacity="0.08"/>';
      svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.5" ' +
        'stroke-linejoin="round" stroke-linecap="round"/>';
      puntos.forEach(function (p, i) {
        if (puntos.length > 40 && i % salto !== 0) return;
        svg += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(Number(p[s.campo]) || 0).toFixed(1) +
          '" r="3" fill="' + s.color + '"><title>' + esc(p.periodo) + " · " + s.nombre + ": " +
          fmt(p[s.campo]) + " kg</title></circle>";
      });
    });

    svg += "</svg>";

    let leyenda = '<ul class="leyenda">';
    series.forEach(function (s) {
      leyenda += '<li><span class="punto" style="background:' + s.color + '"></span>' +
        esc(s.nombre) + "</li>";
    });
    leyenda += "</ul>";

    return svg + leyenda;
  }

  /* ------------------------------------------------- barras horizontales */

  function barras(datos, opciones) {
    const o = opciones || {};
    if (!datos.length) return vacio();

    const campo = o.campo || "valor";
    const filas = datos.slice(0, o.limite || 8);
    const alto = 34;
    const W = 720;
    const H = filas.length * alto + 12;
    const anchoEtiqueta = 190;
    const max = Math.max.apply(null, filas.map(function (d) { return Number(d[campo]) || 0; })) || 1;

    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" class="chart" role="img" ' +
      'aria-label="' + esc(o.titulo || "Comparativo") + '" preserveAspectRatio="xMidYMin meet">';

    filas.forEach(function (d, i) {
      const yy = i * alto + 6;
      const ancho = ((Number(d[campo]) || 0) / max) * (W - anchoEtiqueta - 90);
      const color = o.color || PALETA[i % PALETA.length];
      svg += '<text x="0" y="' + (yy + 15) + '" class="chart-label">' +
        esc(String(d.nombre).slice(0, 26)) + "</text>";
      svg += '<rect x="' + anchoEtiqueta + '" y="' + yy + '" width="' + Math.max(ancho, 2) +
        '" height="20" rx="4" fill="' + color + '"><title>' + esc(d.nombre) + ": " +
        fmt(d[campo]) + (o.sufijo || " kg") + "</title></rect>";
      svg += '<text x="' + (anchoEtiqueta + Math.max(ancho, 2) + 8) + '" y="' + (yy + 15) +
        '" class="chart-valor">' + fmt(d[campo]) + (o.sufijo || "") + "</text>";
    });

    return svg + "</svg>";
  }

  /* ------------------------------------------------------------- dona */

  function dona(datos, opciones) {
    const o = opciones || {};
    if (!datos.length) return vacio();

    const campo = o.campo || "kg";
    const total = datos.reduce(function (a, d) { return a + (Number(d[campo]) || 0); }, 0);
    if (total <= 0) return vacio();

    const S = 200, c = S / 2, R = 78, r = 48;
    let angulo = -Math.PI / 2;

    let svg = '<svg viewBox="0 0 ' + S + " " + S + '" class="chart chart-dona" role="img" ' +
      'aria-label="' + esc(o.titulo || "Distribución") + '">';

    datos.forEach(function (d, i) {
      const parte = (Number(d[campo]) || 0) / total;
      const fin = angulo + parte * Math.PI * 2;
      const grande = parte > 0.5 ? 1 : 0;
      const x1 = c + R * Math.cos(angulo), y1 = c + R * Math.sin(angulo);
      const x2 = c + R * Math.cos(fin), y2 = c + R * Math.sin(fin);
      const x3 = c + r * Math.cos(fin), y3 = c + r * Math.sin(fin);
      const x4 = c + r * Math.cos(angulo), y4 = c + r * Math.sin(angulo);

      /* Un único segmento al 100% no se puede dibujar con un solo arco. */
      const d1 = parte >= 0.999
        ? "M" + (c - R) + " " + c + " A" + R + " " + R + " 0 1 1 " + (c + R) + " " + c +
          " A" + R + " " + R + " 0 1 1 " + (c - R) + " " + c + " Z " +
          "M" + (c - r) + " " + c + " A" + r + " " + r + " 0 1 0 " + (c + r) + " " + c +
          " A" + r + " " + r + " 0 1 0 " + (c - r) + " " + c + " Z"
        : "M" + x1.toFixed(2) + " " + y1.toFixed(2) +
          " A" + R + " " + R + " 0 " + grande + " 1 " + x2.toFixed(2) + " " + y2.toFixed(2) +
          " L" + x3.toFixed(2) + " " + y3.toFixed(2) +
          " A" + r + " " + r + " 0 " + grande + " 0 " + x4.toFixed(2) + " " + y4.toFixed(2) + " Z";

      svg += '<path d="' + d1 + '" fill="' + PALETA[i % PALETA.length] + '" fill-rule="evenodd">' +
        "<title>" + esc(d.nombre) + ": " + fmt(d[campo]) + " kg (" +
        (parte * 100).toFixed(1) + "%)</title></path>";
      angulo = fin;
    });

    svg += '<text x="' + c + '" y="' + (c - 2) + '" class="dona-total">' + fmt(total) + "</text>";
    svg += '<text x="' + c + '" y="' + (c + 16) + '" class="dona-sub">kg</text>';
    svg += "</svg>";

    let leyenda = '<ul class="leyenda leyenda-col">';
    datos.forEach(function (d, i) {
      const pct = ((Number(d[campo]) || 0) / total) * 100;
      leyenda += '<li><span class="punto" style="background:' + PALETA[i % PALETA.length] + '"></span>' +
        esc(d.nombre) + ' <strong>' + pct.toFixed(1) + "%</strong></li>";
    });
    leyenda += "</ul>";

    return '<div class="dona-wrap">' + svg + leyenda + "</div>";
  }


  /* ------------------------------------------------- Pareto de mermas */

  /* Barras ordenadas de mayor a menor mas la curva de porcentaje acumulado.
     Sirve para ver que pocas causas explican la mayor parte de la merma. */
  function pareto(datos, opciones) {
    const o = opciones || {};
    if (!datos.length) return vacio();

    const filas = datos.slice(0, o.limite || 9);
    const W = 720, H = 300;
    const m = { t: 18, r: 46, b: 92, l: 58 };
    const iw = W - m.l - m.r;
    const ih = H - m.t - m.b;

    /* El Pareto sirve para kilos y para dinero: quien llama decide qué mide
       con o.valor y cómo se lee con o.unidad. */
    const valorDe = o.valor || function (d) { return d.kg; };
    const unidad = o.unidad === undefined ? " kg" : o.unidad;
    const max = escalaBonita(Math.max.apply(null, filas.map(valorDe)));
    const ancho = iw / filas.length;
    const y = function (v) { return m.t + ih - (v / max) * ih; };
    const yAcum = function (p) { return m.t + ih - p * ih; };

    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" class="chart" role="img" ' +
      'aria-label="' + esc(o.titulo || "Pareto de causas") + '" preserveAspectRatio="xMidYMid meet">';

    /* Rejilla: kilogramos a la izquierda, porcentaje acumulado a la derecha */
    for (let g = 0; g <= 4; g += 1) {
      const yy = y((max / 4) * g);
      svg += '<line x1="' + m.l + '" y1="' + yy + '" x2="' + (W - m.r) + '" y2="' + yy +
        '" class="chart-grid"/>';
      svg += '<text x="' + (m.l - 8) + '" y="' + (yy + 4) + '" class="chart-tick chart-tick-y">' +
        fmt((max / 4) * g) + "</text>";
      svg += '<text x="' + (W - m.r + 8) + '" y="' + (yy + 4) + '" class="chart-tick">' +
        (g * 25) + "%</text>";
    }

    filas.forEach(function (d, i) {
      const x = m.l + i * ancho;
      const bw = ancho * 0.62;
      const bx = x + (ancho - bw) / 2;
      const by = y(valorDe(d));
      const color = o.color ? o.color(d) : PALETA[i % PALETA.length];

      svg += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + (m.t + ih - by).toFixed(1) + '" rx="3" fill="' + color + '">' +
        "<title>" + esc(d.nombre) + ": " + fmt(valorDe(d)) + unidad + " · " +
        (d.porcentaje * 100).toFixed(1) + "% del total</title></rect>";

      /* Etiqueta girada: los nombres de causa no caben en horizontal */
      const eje = o.ejeX ? o.ejeX(d) : d.nombre;
      svg += '<text transform="translate(' + (x + ancho / 2).toFixed(1) + "," + (m.t + ih + 10) +
        ') rotate(-38)" class="chart-tick" text-anchor="end">' +
        esc(eje.length > 22 ? eje.slice(0, 21) + "…" : eje) + "</text>";
    });

    /* Curva acumulada */
    const linea = filas.map(function (d, i) {
      return (i === 0 ? "M" : "L") + (m.l + i * ancho + ancho / 2).toFixed(1) + " " +
        yAcum(d.acumulado).toFixed(1);
    }).join(" ");
    svg += '<path d="' + linea + '" fill="none" stroke="' + PALETA[3] +
      '" stroke-width="2" stroke-dasharray="4 3"/>';
    filas.forEach(function (d, i) {
      svg += '<circle cx="' + (m.l + i * ancho + ancho / 2).toFixed(1) + '" cy="' +
        yAcum(d.acumulado).toFixed(1) + '" r="3.5" fill="' + PALETA[3] + '">' +
        "<title>Acumulado: " + (d.acumulado * 100).toFixed(1) + "%</title></circle>";
    });

    /* Referencia del 80%: la frontera clasica del analisis de Pareto */
    svg += '<line x1="' + m.l + '" y1="' + yAcum(0.8).toFixed(1) + '" x2="' + (W - m.r) +
      '" y2="' + yAcum(0.8).toFixed(1) + '" stroke="' + PALETA[3] +
      '" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"/>';

    svg += "</svg>";

    let leyenda = '<ul class="leyenda">';
    (o.leyenda || []).forEach(function (t) {
      leyenda += '<li><span class="punto" style="background:' + t[1] + '"></span>' + esc(t[0]) + "</li>";
    });
    leyenda += '<li><span class="punto punto-linea" style="background:' + PALETA[3] +
      '"></span>% acumulado</li></ul>';

    return svg + leyenda;
  }

  /* ------------------------------------- barra de cumplimiento vs meta */

  function medidor(valor, meta, etiqueta, pie) {
    const pct = meta > 0 ? Math.min(valor / meta, 1.35) : 0;
    const ancho = Math.min(pct, 1) * 100;
    const estado = pct >= 1 ? "ok" : pct >= 0.9 ? "alerta" : "bajo";
    return '<div class="medidor medidor-' + estado + '">' +
      '<div class="medidor-cab"><span>' + esc(etiqueta) + "</span><strong>" +
      (valor * 100).toFixed(1) + "%</strong></div>" +
      '<div class="medidor-pista"><div class="medidor-barra" style="width:' + ancho.toFixed(1) + '%"></div>' +
      '<div class="medidor-meta" style="left:' + Math.min(100, 100).toFixed(1) + '%"></div></div>' +
      '<div class="medidor-pie">' +
      (pie || "Meta ponderada: " + (meta * 100).toFixed(1) + "%") + "</div></div>";
  }

  return {
    PALETA: PALETA,
    lineas: lineas,
    barras: barras,
    dona: dona,
    pareto: pareto,
    medidor: medidor,
    vacio: vacio
  };
})();

</script>

<script>
/* =========================================================================
   ui.js — Kit compartido por el Portal del Proveedor y el Sistema de Planta
   Formato de números, avisos, tablas, formularios y exportación.
   No sabe nada del dominio: eso vive en db.js e indicadores.js.
   ========================================================================= */

const UI = (function () {
  "use strict";

  const $ = function (sel, ctx) { return (ctx || document).querySelector(sel); };
  const $$ = function (sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  };

  /* ------------------------------------------------------------- formato */

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function nf(n, dec) {
    return new Intl.NumberFormat("es-EC", {
      minimumFractionDigits: dec || 0,
      maximumFractionDigits: dec === undefined ? 0 : dec
    }).format(Number(n) || 0);
  }

  function pct(n, dec) {
    return nf((Number(n) || 0) * 100, dec === undefined ? 1 : dec) + "%";
  }

  function pctFirmado(n) {
    const v = (Number(n) || 0) * 100;
    return (v > 0 ? "+" : "") + nf(v, 1) + "%";
  }

  function money(n) { return "$" + nf(n, 2); }

  function cajas(n) { return nf(n) + (Math.abs(Number(n)) === 1 ? " caja" : " cajas"); }

  function minutos(n) {
    /* Se redondea ANTES de partir en horas y minutos. Redondear despues
       produce "70 h 60 min" cuando el resto cae en 59,6. */
    const total = Math.round(Number(n) || 0);
    if (total < 60) return nf(total) + " min";
    const h = Math.floor(total / 60);
    const m = total % 60;
    return nf(h) + " h" + (m ? " " + nf(m) + " min" : "");
  }

  function fechaLarga(iso) {
    if (!iso) return "—";
    const d = new Date(iso.length > 10 ? iso : iso + "T12:00:00");
    return d.toLocaleDateString("es-EC", { day: "2-digit", month: "short", year: "numeric" });
  }

  function fechaCorta(iso) {
    if (!iso) return "—";
    const d = new Date(iso.length > 10 ? iso : iso + "T12:00:00");
    return d.toLocaleDateString("es-EC", { day: "2-digit", month: "short" });
  }

  /* Insignia del origen del dato: M medido, E estimado, S secundario.
     El estándar de rigor del proyecto exige declararlo en cada parámetro. */
  function origen(id) {
    const o = DB.ORIGENES.find(function (x) { return x.id === id; });
    if (!o) return "";
    return '<abbr class="origen origen-' + esc(id) + '" title="' +
      esc(o.nombre + ": " + o.ayuda) + '">' + esc(id) + "</abbr>";
  }

  /* --------------------------------------------------------------- avisos */

  function aviso(mensaje, tipo) {
    let cont = $("#avisos");
    if (!cont) {
      cont = document.createElement("div");
      cont.id = "avisos";
      cont.className = "avisos";
      cont.setAttribute("aria-live", "polite");
      document.body.appendChild(cont);
    }
    const div = document.createElement("div");
    div.className = "aviso aviso-" + (tipo || "ok");
    div.setAttribute("role", "status");
    div.textContent = mensaje;
    cont.appendChild(div);
    setTimeout(function () { div.classList.add("saliendo"); }, 3400);
    setTimeout(function () { div.remove(); }, 3900);
  }

  /* --------------------------------------------------------------- tablas */

  function tabla(columnas, filas, opciones) {
    const o = opciones || {};
    if (!filas.length) {
      return '<p class="vacio">' + esc(o.vacio || "No hay registros que coincidan con el filtro.") + "</p>";
    }
    let html = '<div class="tabla-scroll"><table class="tabla"><thead><tr>';
    columnas.forEach(function (c) {
      html += '<th scope="col"' + (c.num ? ' class="num"' : "") + ">" + esc(c.titulo) + "</th>";
    });
    html += "</tr></thead><tbody>";
    filas.forEach(function (f) {
      html += "<tr" + (o.filaClase ? ' class="' + o.filaClase(f) + '"' : "") + ">";
      columnas.forEach(function (c) {
        html += "<td" + (c.num ? ' class="num"' : "") + ">" + c.valor(f) + "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function kpi(etiqueta, valor, detalle, tono) {
    return '<article class="kpi kpi-' + (tono || "neutro") + '">' +
      '<p class="kpi-etiqueta">' + esc(etiqueta) + "</p>" +
      '<p class="kpi-valor">' + valor + "</p>" +
      '<p class="kpi-detalle">' + (detalle || "") + "</p></article>";
  }

  function insignia(estado) {
    return '<span class="estado estado-' + esc(String(estado).toLowerCase()) + '">' +
      esc(estado) + "</span>";
  }

  /* Etiqueta de línea de producto con su color propio. */
  function etiquetaLinea(lineaId) {
    const l = DB.linea(lineaId);
    if (!l) return "—";
    return '<span class="linea-tag" style="--linea:' + esc(l.color) + '">' +
      '<span class="linea-punto" aria-hidden="true"></span>' + esc(l.nombre) + "</span>";
  }

  /* ---------------------------------------------------------- formularios */

  function abrirFormulario(titulo, campos, onSubmit, opciones) {
    const o = opciones || {};
    const capa = document.createElement("div");
    capa.className = "modal-capa";
    capa.innerHTML =
      '<div class="modal' + (o.ancho ? " modal-ancho" : "") + '" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">' +
      '<header class="modal-cab"><h2 id="modalTitulo">' + esc(titulo) + "</h2>" +
      '<button type="button" class="modal-x" aria-label="Cerrar">&times;</button></header>' +
      '<form class="modal-cuerpo" novalidate>' +
      (o.nota ? '<p class="modal-nota">' + o.nota + "</p>" : "") +
      campos.map(campoHTML).join("") +
      '<p class="form-error" id="formError" role="alert" hidden></p>' +
      '<footer class="modal-pie">' +
      '<button type="button" class="btn btn-plano" data-cancelar>Cancelar</button>' +
      '<button type="submit" class="btn btn-primario">' + esc(o.aceptar || "Guardar") + "</button>" +
      "</footer></form></div>";

    document.body.appendChild(capa);
    document.body.classList.add("sin-scroll");

    const form = $("form", capa);
    const error = $("#formError", capa);

    function cerrar() {
      capa.remove();
      document.body.classList.remove("sin-scroll");
      document.removeEventListener("keydown", onEsc);
    }
    function onEsc(e) { if (e.key === "Escape") cerrar(); }

    document.addEventListener("keydown", onEsc);
    $(".modal-x", capa).addEventListener("click", cerrar);
    $("[data-cancelar]", capa).addEventListener("click", cerrar);
    capa.addEventListener("mousedown", function (e) { if (e.target === capa) cerrar(); });

    enlazarRepetibles(form, campos, o);

    if (o.alCambiar) {
      const refrescar = function () { o.alCambiar(leer(form, campos), form); };
      form.addEventListener("input", refrescar);
      form.addEventListener("change", refrescar);
      refrescar();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const datos = leer(form, campos);
      const problema = validar(campos, datos);
      if (problema) {
        error.innerHTML = problema;
        error.hidden = false;
        error.scrollIntoView({ block: "nearest" });
        return;
      }
      error.hidden = true;
      const resultado = onSubmit(datos);

      /* Si el guardado es asíncrono —derivar una contraseña, por ejemplo— el
         formulario NO se cierra hasta que termina. Cerrarlo antes deja la
         operación en el aire: basta con que la persona salga enseguida para
         que el cambio se pierda sin avisar. */
      if (resultado && typeof resultado.then === "function") {
        const boton = $("button[type=submit]", form);
        const textoPrevio = boton.textContent;
        boton.disabled = true;
        boton.textContent = "Guardando…";
        resultado.then(function (r) {
          if (r && r.error) {
            error.innerHTML = r.error;
            error.hidden = false;
            boton.disabled = false;
            boton.textContent = textoPrevio;
            return;
          }
          cerrar();
        }).catch(function (e) {
          error.textContent = "No se pudo guardar: " + (e && e.message ? e.message : "error inesperado");
          error.hidden = false;
          boton.disabled = false;
          boton.textContent = textoPrevio;
        });
        return;
      }

      if (resultado && resultado.error) {
        error.innerHTML = resultado.error;
        error.hidden = false;
        return;
      }
      cerrar();
    });

    const primero = $("input:not([readonly]), select:not([disabled]), textarea", form);
    if (primero) primero.focus();
    return { cerrar: cerrar, form: form };
  }

  function campoHTML(c) {
    if (c.tipo === "separador") return '<h3 class="form-sep">' + esc(c.etiqueta) + "</h3>";
    if (c.tipo === "html") return '<div class="campo campo-full">' + c.contenido + "</div>";

    if (c.tipo === "calculado") {
      return '<div class="campo campo-' + (c.ancho || "full") + ' campo-calculado">' +
        "<label>" + esc(c.etiqueta) + '</label><output id="' + esc(c.nombre) + '">—</output>' +
        (c.ayuda ? '<small class="ayuda">' + esc(c.ayuda) + "</small>" : "") + "</div>";
    }

    /* Campo repetible: una fila por elemento, con columnas configurables.
       Lo usa el reparto de mermas (causa raíz + kg + destino). */
    if (c.tipo === "repetible") {
      return '<div class="campo campo-full repetible" data-repetible="' + esc(c.nombre) + '">' +
        "<label>" + esc(c.etiqueta) + "</label>" +
        (c.ayuda ? '<small class="ayuda">' + esc(c.ayuda) + "</small>" : "") +
        '<div class="rep-filas"></div>' +
        '<button type="button" class="btn btn-plano btn-sm rep-agregar">+ ' +
        esc(c.textoAgregar || "Agregar") + "</button>" +
        '<div class="balance" data-balance></div></div>';
    }

    let control = "";
    const id = "campo_" + c.nombre;
    const base = 'id="' + id + '" name="' + esc(c.nombre) + '"' +
      (c.soloLectura ? " readonly" : "") + (c.requerido ? " required" : "");

    if (c.tipo === "select") {
      control = "<select " + base + (c.soloLectura ? " disabled" : "") + ">";
      if (c.vacio) control += '<option value="">' + esc(c.vacio) + "</option>";
      (c.opciones || []).forEach(function (op) {
        control += '<option value="' + esc(op.valor) + '"' +
          (String(c.valor) === String(op.valor) ? " selected" : "") + ">" + esc(op.texto) + "</option>";
      });
      control += "</select>";
      if (c.soloLectura) {
        control += '<input type="hidden" name="' + esc(c.nombre) + '" value="' + esc(c.valor || "") + '">';
      }
    } else if (c.tipo === "textarea") {
      control = "<textarea " + base + ' rows="3"' +
        (c.marcador ? ' placeholder="' + esc(c.marcador) + '"' : "") + ">" + esc(c.valor || "") + "</textarea>";
    } else if (c.tipo === "checkbox") {
      control = '<label class="check"><input type="checkbox" ' + base +
        (c.valor ? " checked" : "") + "> " + esc(c.textoCheck || "") + "</label>";
    } else {
      /* inputmode saca el teclado correcto en el móvil sin cambiar el tipo. */
      const modo = c.tipo === "number" ? ' inputmode="decimal"'
        : c.tipo === "tel" ? ' inputmode="tel"' : "";
      control = '<input type="' + (c.tipo || "text") + '"' + modo + " " + base +
        ' value="' + esc(c.valor === undefined || c.valor === null ? "" : c.valor) + '"' +
        (c.min !== undefined ? ' min="' + c.min + '"' : "") +
        (c.max !== undefined ? ' max="' + c.max + '"' : "") +
        (c.paso !== undefined ? ' step="' + c.paso + '"' : "") +
        (c.marcador ? ' placeholder="' + esc(c.marcador) + '"' : "") + ">";
    }

    return '<div class="campo campo-' + (c.ancho || "full") + '">' +
      (c.tipo === "checkbox" ? "" : '<label for="' + id + '">' + esc(c.etiqueta) +
        (c.requerido ? ' <span class="req" aria-hidden="true">*</span>' : "") + "</label>") +
      control +
      (c.ayuda ? '<small class="ayuda">' + esc(c.ayuda) + "</small>" : "") + "</div>";
  }

  /* Filas dinámicas de un campo repetible. */
  function enlazarRepetibles(form, campos, opciones) {
    campos.filter(function (c) { return c.tipo === "repetible"; }).forEach(function (c) {
      const bloque = $('[data-repetible="' + c.nombre + '"]', form);
      if (!bloque) return;
      const filas = $(".rep-filas", bloque);

      function agregar(valores) {
        const div = document.createElement("div");
        div.className = "rep-fila";
        let html = "";
        c.columnas.forEach(function (col) {
          const v = (valores && valores[col.nombre]) || "";
          if (col.tipo === "select") {
            html += '<select class="rep-campo" data-campo="' + esc(col.nombre) + '" aria-label="' +
              esc(col.etiqueta) + '">';
            col.opciones().forEach(function (op) {
              html += '<option value="' + esc(op.valor) + '"' +
                (String(v) === String(op.valor) ? " selected" : "") + ">" + esc(op.texto) + "</option>";
            });
            html += "</select>";
          } else {
            html += '<input type="number" inputmode="decimal" class="rep-campo" data-campo="' +
              esc(col.nombre) + '" min="0" step="0.1" placeholder="' + esc(col.etiqueta) +
              '" value="' + esc(v) + '" aria-label="' + esc(col.etiqueta) + '">';
          }
        });
        html += '<button type="button" class="btn-mini btn-mini-peligro rep-quitar" aria-label="Quitar fila">✕</button>';
        div.innerHTML = html;
        div.querySelector(".rep-quitar").addEventListener("click", function () {
          div.remove();
          form.dispatchEvent(new Event("input", { bubbles: true }));
        });
        filas.appendChild(div);
      }

      $(".rep-agregar", bloque).addEventListener("click", function () {
        agregar(null);
        form.dispatchEvent(new Event("input", { bubbles: true }));
      });

      (opciones.filasIniciales && opciones.filasIniciales[c.nombre] || []).forEach(agregar);
      if (!filas.children.length) agregar(null);
    });
  }

  function leerRepetible(form, nombre, columnas) {
    const bloque = $('[data-repetible="' + nombre + '"]', form);
    if (!bloque) return [];
    return $$(".rep-fila", bloque).map(function (fila) {
      const out = {};
      columnas.forEach(function (col) {
        const el = $('[data-campo="' + col.nombre + '"]', fila);
        if (!el) return;
        out[col.nombre] = col.tipo === "select" ? el.value : (Number(el.value) || 0);
      });
      return out;
    }).filter(function (x) {
      return columnas.some(function (col) { return col.tipo !== "select" && x[col.nombre] > 0; });
    });
  }

  function leer(form, campos) {
    const datos = {};
    campos.forEach(function (c) {
      if (c.tipo === "separador" || c.tipo === "calculado" || c.tipo === "html") return;
      if (c.tipo === "repetible") {
        datos[c.nombre] = leerRepetible(form, c.nombre, c.columnas);
        return;
      }
      const el = form.elements[c.nombre];
      if (!el) return;
      const nodo = el.length && !el.tagName ? el[el.length - 1] : el;
      if (c.tipo === "checkbox") datos[c.nombre] = nodo.checked;
      else if (c.tipo === "number") datos[c.nombre] = nodo.value === "" ? "" : Number(nodo.value);
      else datos[c.nombre] = String(nodo.value).trim();
    });
    return datos;
  }

  function validar(campos, datos) {
    for (let i = 0; i < campos.length; i += 1) {
      const c = campos[i];
      if (c.tipo === "separador" || c.tipo === "calculado" || c.tipo === "html") continue;
      const v = datos[c.nombre];
      if (c.requerido && (v === "" || v === null || v === undefined)) {
        return "El campo «" + esc(c.etiqueta) + "» es obligatorio.";
      }
      if (c.tipo === "number" && v !== "") {
        if (c.min !== undefined && v < c.min) {
          return "«" + esc(c.etiqueta) + "» no puede ser menor que " + nf(c.min, 1) + ".";
        }
        if (c.max !== undefined && v > c.max) {
          return "«" + esc(c.etiqueta) + "» no puede ser mayor que " + nf(c.max, 1) + ".";
        }
      }
      if (c.validar) {
        const err = c.validar(v, datos);
        if (err) return err;
      }
    }
    return null;
  }

  /* ---------------------------------------------------------- exportación */

  let guardadoDelVisor = null;

  function prepararGuardado() {
    if (typeof window === "undefined" || !window.claude ||
        typeof window.claude.use !== "function") return;
    window.claude.use("downloads")
      .then(function (d) { guardadoDelVisor = d; })
      .catch(function () { guardadoDelVisor = null; });
  }

  function descargar(blob, nombreArchivo) {
    if (guardadoDelVisor) {
      guardadoDelVisor.save({ filename: nombreArchivo, data: blob })
        .then(function () { aviso("Archivo guardado."); })
        .catch(function (e) {
          if (e && e.code === "declined") return;
          aviso("No se pudo guardar el archivo.", "error");
        });
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    aviso("Archivo descargado.");
  }

  function descargarCSV(nombre, columnas, filas) {
    const sep = ";";                       // Excel en español separa con ";"
    const lineas = [columnas.map(function (c) { return c.titulo; }).join(sep)];
    filas.forEach(function (f) {
      lineas.push(columnas.map(function (c) {
        const v = c.csv ? c.csv(f) : "";
        const s = String(v === null || v === undefined ? "" : v);
        return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(sep));
    });
    descargar(new Blob(["﻿" + lineas.join("\r\n")], { type: "text/csv;charset=utf-8;" }),
      nombre + "_" + DB.hoy() + ".csv");
  }

  /* ------------------------------------------------------------- sesión */

  /* La sesión puede vivir solo en la pestaña (por defecto) o recordarse en
     el dispositivo. En el celular del proveedor, recordarla es la
     diferencia entre usar la aplicación y abandonarla. */
  const DIAS_RECUERDO = 30;

  function abrirSesion(clave, usuarioId, recordar) {
    const dato = JSON.stringify({
      id: usuarioId,
      expira: Date.now() + DIAS_RECUERDO * 86400000
    });
    try {
      sessionStorage.setItem(clave, dato);
      if (recordar) localStorage.setItem(clave, dato);
      else localStorage.removeItem(clave);
    } catch (e) { /* modo privado */ }
  }

  function sesionAbierta(clave) {
    for (const almacen of ["sessionStorage", "localStorage"]) {
      try {
        const raw = window[almacen].getItem(clave);
        if (!raw) continue;
        const d = JSON.parse(raw);
        if (d && d.id && (!d.expira || d.expira > Date.now())) return d.id;
        window[almacen].removeItem(clave);
      } catch (e) { /* noop */ }
    }
    return null;
  }

  function cerrarSesion(clave) {
    try { sessionStorage.removeItem(clave); localStorage.removeItem(clave); }
    catch (e) { /* noop */ }
  }

  function guardarSesion(clave, valor) {
    try { sessionStorage.setItem(clave, valor); } catch (e) { /* modo privado */ }
  }

  function leerSesion(clave) {
    try { return sessionStorage.getItem(clave); } catch (e) { return null; }
  }

  function borrarSesion(clave) {
    try { sessionStorage.removeItem(clave); } catch (e) { /* noop */ }
  }

  /* ------------------------------------------- formularios en uso */

  /* Un repintado que llega solo —porque terminó la conexión o porque otro
     dispositivo cambió algo— no puede reconstruir la pantalla encima de
     alguien que está llenando un formulario: le borraría lo escrito. Aquí
     se marca cuándo hay un formulario empezado. */
  let formEnUso = false;

  function vigilarFormulario(form) {
    if (!form) return;
    const marcar = function () { formEnUso = true; };
    form.addEventListener("input", marcar);
    form.addEventListener("change", marcar);
  }

  function formularioEnUso() { return formEnUso; }

  /* Un repintado pedido por la propia persona sí puede seguir adelante. */
  function soltarFormulario() { formEnUso = false; }

  /* Decide si es seguro repintar ahora. Si no lo es, lo aplaza — pero SIEMPRE
     deja un reintento en marcha. Esperar solo al `blur` dejaba el cambio sin
     llegar nunca si la persona no volvía a tocar nada: quien mira la pantalla
     sin escribir tiene el mismo derecho a ver lo que pasó. */
  let reintentoPendiente = null;

  function repintarSiSeguro(repintar, reintentar) {
    const volver = function () { repintarSiSeguro(repintar, reintentar); };

    const activo = document.activeElement;
    const enCampo = activo && /^(INPUT|SELECT|TEXTAREA)$/.test(activo.tagName);

    if (enCampo || formEnUso) {
      if (enCampo) activo.addEventListener("blur", volver, { once: true });
      if (!reintentoPendiente) {
        reintentoPendiente = setTimeout(function () {
          reintentoPendiente = null;
          volver();
        }, 2500);
      }
      return false;
    }

    if (reintentoPendiente) { clearTimeout(reintentoPendiente); reintentoPendiente = null; }
    repintar();
    return true;
  }

  /* Enlace a la otra aplicación. Cambia según el despliegue: carpetas
     separadas en el repositorio, o rutas con # dentro de un solo paquete. */
  function rutaOtraApp(cual) {
    const rutas = (typeof window !== "undefined" && window.FLP_RUTAS) || null;
    if (rutas && rutas[cual]) return 'href="' + rutas[cual] + '"';
    return 'href="../' + cual + '/"';
  }

  /* Arranca cuando el DOM esté listo, incluso si ya lo estaba. */
  function alArrancar(fn) {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", fn);
    } else { fn(); }
  }

  return {
    $: $, $$: $$,
    esc: esc, nf: nf, pct: pct, pctFirmado: pctFirmado, money: money,
    cajas: cajas, minutos: minutos, fechaLarga: fechaLarga, fechaCorta: fechaCorta,
    origen: origen, aviso: aviso, tabla: tabla, kpi: kpi, insignia: insignia,
    etiquetaLinea: etiquetaLinea,
    abrirFormulario: abrirFormulario, leerRepetible: leerRepetible,
    prepararGuardado: prepararGuardado, descargar: descargar, descargarCSV: descargarCSV,
    abrirSesion: abrirSesion,
    sesionAbierta: sesionAbierta,
    cerrarSesion: cerrarSesion,
    guardarSesion: guardarSesion, leerSesion: leerSesion, borrarSesion: borrarSesion,
    vigilarFormulario: vigilarFormulario,
    formularioEnUso: formularioEnUso,
    soltarFormulario: soltarFormulario,
    repintarSiSeguro: repintarSiSeguro,
    rutaOtraApp: rutaOtraApp,
    alArrancar: alArrancar
  };
})();

</script>

<script>
/* =========================================================================
   portal.js — Portal del Proveedor (aplicación externa)

   Lo que el proveedor puede hacer: anunciar sus envíos y seguir el
   resultado de cada lote. Nada más.

   Aislamiento: todas las lecturas pasan por misLotes(), que filtra por el
   proveedor de la sesión. El portal nunca consulta las colecciones sin ese
   filtro, así que un proveedor no puede ver lotes de otro ni aunque
   manipule la interfaz. Tampoco ve las causas internas de planta: solo las
   de origen «Campo», que son las que dependen de él.
   ========================================================================= */

(function () {
  "use strict";

  const $ = UI.$, $$ = UI.$$;
  const esc = UI.esc, nf = UI.nf, pct = UI.pct, money = UI.money;
  const SESION = "flp.portal.sesion";

  let usuario = null;
  let vista = "inicio";

  /* ============================== sesión ============================== */

  async function entrar(acceso, clave, recordar) {
    const codigo = String(acceso).trim();
    if (!codigo) return { error: "Escribe tu código de proveedor." };
    if (!clave) return { error: "Escribe tu contraseña." };

    const espera = Auth.bloqueo(codigo);
    if (espera > 0) {
      return { error: "Demasiados intentos fallidos. Espera " + espera + " segundos." };
    }

    const u = DB.buscarPorAcceso(codigo);
    /* El mismo mensaje para código inexistente y contraseña equivocada: si
       se distinguieran, se podría averiguar qué códigos existen. */
    const generico = "Código o contraseña incorrectos.";

    if (!u || u.rol !== "proveedor") {
      const espera = Auth.anotarFallo(codigo);
      return { error: espera > 0
        ? "Demasiados intentos fallidos. Espera " + espera + " segundos."
        : generico };
    }
    if (!u.credencial) {
      return { error: "Tu cuenta aún no está activada. Usa «Activa tu cuenta aquí» " +
        "para crear tu contraseña." };
    }

    const vale = await Auth.verificar(clave, u.credencial);
    if (!vale) {
      const espera = Auth.anotarFallo(codigo);
      return { error: espera > 0
        ? "Demasiados intentos fallidos. Espera " + espera + " segundos."
        : generico };
    }
    if (!u.activo) return { error: "Tu acceso está desactivado. Comunícate con la planta." };

    Auth.limpiarFallos(codigo);
    usuario = u;
    DB.update("usuarios", u.id, { ultimoAcceso: new Date().toISOString() });
    UI.abrirSesion(SESION, u.id, recordar);
    DB.registrarBitacora(u.id, "Ingreso al portal", u.nombre);
    return { ok: true, debeCambiar: !!u.debeCambiar };
  }

  function salir() {
    if (usuario) DB.registrarBitacora(usuario.id, "Salida del portal", usuario.nombre);
    usuario = null;
    if (repintado) { clearTimeout(repintado); repintado = null; }
    vista = "inicio";
    UI.cerrarSesion(SESION);
    render();
  }

  function restaurar() {
    const id = UI.sesionAbierta(SESION);
    if (!id) return;
    const u = DB.get("usuarios", id);
    if (u && u.rol === "proveedor" && u.activo) usuario = u;
  }

  /* ========================= lectura aislada ========================== */

  /* Único punto de acceso a los datos del portal. */
  function misLotes() {
    if (!usuario) return [];
    return DB.all("lotes")
      .filter(function (l) { return l.proveedorId === usuario.proveedorId; })
      .sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0; });
  }

  function miProveedor() { return DB.get("proveedores", usuario.proveedorId); }

  function produccionDe(loteId) {
    return DB.all("producciones").find(function (p) { return p.loteId === loteId; }) || null;
  }

  /* Solo las causas que nacen en campo: son las que el proveedor puede
     corregir. Las de planta (layout, sopleteado) no son asunto suyo. */
  function causasDeCampo(prod) {
    if (!prod) return [];
    return (prod.mermas || []).filter(function (m) {
      const c = DB.causa(m.causaId);
      return c && c.origen === "Campo";
    }).sort(function (a, b) { return b.kg - a.kg; });
  }

  function resumen() {
    const lotes = misLotes();
    const enCurso = lotes.filter(function (l) {
      return l.estado === "Anunciado" || l.estado === "Recibido" || l.estado === "Procesado";
    });

    let cajasAnun = 0, cajasRec = 0, cajasProc = 0, cajasExp = 0, valor = 0, calA = 0, rech = 0;
    lotes.forEach(function (l) {
      cajasAnun += Number(l.cajasAnunciadas) || 0;
      if (l.estado === "Rechazado") { rech += 1; return; }
      if (l.cajasRecibidas === null) return;
      cajasRec += Number(l.cajasRecibidas) || 0;
      valor += (Number(l.cajasRecibidas) || 0) * (Number(l.precioCaja) || 0);
      if (l.calidadVerificada === "A") calA += Number(l.cajasRecibidas) || 0;
      const p = produccionDe(l.id);
      if (p) {
        cajasProc += Number(p.cajasProcesadas) || 0;
        cajasExp += Number(p.cajasExportables) || 0;
      }
    });

    const pesados = lotes.filter(function (l) {
      return l.cajasRecibidas !== null && l.estado !== "Rechazado";
    });
    const anunPesadas = pesados.reduce(function (a, l) { return a + l.cajasAnunciadas; }, 0);

    return {
      lotes: lotes.length, enCurso: enCurso.length, rechazados: rech,
      cajasAnunciadas: cajasAnun, cajasRecibidas: cajasRec,
      diferencia: cajasRec - anunPesadas,
      tasaDiferencia: anunPesadas > 0 ? (cajasRec - anunPesadas) / anunPesadas : 0,
      cajasExportables: cajasExp,
      tasaExportable: cajasProc > 0 ? cajasExp / cajasProc : 0,
      pctCalidadA: cajasRec > 0 ? calA / cajasRec : 0,
      valor: valor,
      tasaRechazo: lotes.length > 0 ? rech / lotes.length : 0
    };
  }

  /* =============================== vistas ============================= */

  function vistaInicio() {
    const r = resumen();
    const lotes = misLotes();
    const activos = lotes.filter(function (l) { return l.estado !== "Cerrado" && l.estado !== "Rechazado"; });

    let html = '<section class="portal-saludo">' +
      "<h1>Hola, " + esc(usuario.nombre.split(" ")[0]) + "</h1>" +
      '<p class="sub">' + esc(miProveedor().nombre) + "</p>" +
      '<button class="btn btn-primario btn-grande" data-ir="anunciar">' +
      "Anunciar un envío</button></section>";

    if (activos.length) {
      html += '<section class="panel"><h2>Tus envíos en curso</h2><div class="pila">';
      activos.slice(0, 6).forEach(function (l) { html += tarjetaLote(l); });
      html += "</div>";
      if (activos.length > 6) {
        html += '<button class="btn btn-plano btn-ancho" data-ir="lotes">Ver los ' +
          activos.length + " envíos</button>";
      }
      html += "</section>";
    } else {
      html += '<section class="panel"><p class="vacio">No tienes envíos en curso. ' +
        "Cuando anuncies uno, aquí verás en qué punto va.</p></section>";
    }

    html += '<section class="kpis kpis-portal">';
    html += UI.kpi("Cajas entregadas", nf(r.cajasRecibidas),
      r.lotes + " envíos en total", "linea1");
    html += UI.kpi("Exactitud al declarar", UI.pctFirmado(r.tasaDiferencia),
      "Diferencia entre lo que anuncias y lo que pesa la planta",
      Math.abs(r.tasaDiferencia) <= 0.01 ? "bien" : Math.abs(r.tasaDiferencia) <= 0.03 ? "regular" : "mal");
    html += UI.kpi("Tu fruta exportable", pct(r.tasaExportable),
      "De cada 100 cajas que entregas", r.tasaExportable >= 0.78 ? "bien" : "regular");
    html += UI.kpi("Valor liquidado", money(r.valor),
      pct(r.pctCalidadA) + " de tu fruta entra como calidad A", "neutro");
    html += "</section>";

    return html;
  }

  function tarjetaLote(l) {
    const linea = DB.linea(l.lineaId);
    const paso = DB.ESTADOS.find(function (e) { return e.id === l.estado; });
    const orden = paso ? paso.orden : 0;

    const sinEnviar = DB.estaPendiente("lotes", l.id);

    let html = '<article class="lote-tarjeta' + (sinEnviar ? " lote-pendiente" : "") +
      '" data-ficha="' + esc(l.id) + '" tabindex="0" role="button">' +
      '<div class="lote-cab"><span class="lote-codigo">' + esc(l.codigoLote) + "</span>" +
      (sinEnviar
        ? '<span class="estado estado-pendienteenvio">Pendiente de enviar</span>'
        : UI.insignia(l.estado)) + "</div>" +
      '<div class="lote-cuerpo">' + UI.etiquetaLinea(l.lineaId) +
      "<strong>" + nf(l.cajasAnunciadas) + " cajas</strong>" +
      '<span class="tenue">' + UI.fechaCorta(l.fecha) + "</span></div>";

    /* Pasos del recorrido: el proveedor ve dónde está su fruta. */
    if (l.estado !== "Rechazado") {
      html += '<ol class="pasos" aria-label="Avance del lote">';
      ["Anunciado", "Recibido", "Procesado", "Cerrado"].forEach(function (nombre, i) {
