      valorizacion = valorizacion + (m.valorizacion || 0) * (1 - valorizacion);
    });
    return {
      filtros: filtros, reducciones: reducciones, inversion: inversion,
      recurrenteAnual: recurrente, valorizacion: valorizacion,
      medidas: elegidas.map(function (m) { return m.id; })
    };
  }

  return {
    filtrar: filtrar,
    coincideTexto: coincideTexto,
    calcular: calcular,
    porProveedor: porProveedor,
    porLinea: porLinea,
    porCausaRaiz: porCausaRaiz,
    porDestino: porDestino,
    porCalidad: porCalidad,
    serie: serie,
    planificar: planificar,
    estudioTiempos: estudioTiempos,
    estudioTodas: estudioTodas,
    costeo: costeo,
    simular: simular,
    escenarioDeMedidas: escenarioDeMedidas,
    ESCENARIOS: ESCENARIOS,
    MEDIDAS: MEDIDAS,
    matrizKPI: matrizKPI,
    fichaLote: fichaLote,
    liquidacion: liquidacion,
    resumenMensual: resumenMensual,
    mesesArchivables: mesesArchivables,
    liquidaciones: liquidaciones,
    totalMerma: totalMerma,
    mermaValorizada: mermaValorizada,
    valorRecuperado: valorRecuperado,
    tiempoEstandar: tiempoEstandar,
    editable: editable,
    nombreLinea: nombreLinea,
    nombreProveedor: nombreProveedor,
    nombreUsuario: nombreUsuario,
    nombreCausa: nombreCausa,
    nombreDestino: nombreDestino,
    colorLinea: colorLinea
  };
})();

</script>

<script>
/* =========================================================================
   graficos.js — Gráficos en SVG generados a mano
   Sin librerías externas: la app debe poder ejecutarse sin internet.
   Cada función devuelve una cadena de marcado SVG lista para inyectar.
   ========================================================================= */

const Graficos = (function () {
  "use strict";

  /* Los tres primeros colores son los de las lineas de producto: pitahaya
     roja, tomate de arbol y granadilla. El resto completa la escala. */
  const PALETA = ["#c0246b", "#c85a1e", "#b8860b", "#2f6f8f", "#5b8c3a", "#7a5ba8"];

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fmt(n) {
    return new Intl.NumberFormat("es-EC", { maximumFractionDigits: 0 }).format(n);
  }

  function vacio(mensaje) {
    return '<p class="grafico-vacio">' + esc(mensaje || "Sin datos en el período seleccionado.") + "</p>";
  }

  function escalaBonita(max) {
    if (max <= 0) return 1;
    const exp = Math.pow(10, Math.floor(Math.log10(max)));
    const norm = max / exp;
    const paso = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return paso * exp;
  }

  /* ------------------------------------------------- líneas / tendencia */

  function lineas(puntos, opciones) {
    const o = opciones || {};
    if (!puntos.length) return vacio();

    const W = 720, H = 260;
    const m = { t: 16, r: 16, b: 34, l: 56 };
    const iw = W - m.l - m.r;
    const ih = H - m.t - m.b;

    const series = o.series || [
      { campo: "recibido", nombre: "Recibido", color: PALETA[0] },
      { campo: "procesado", nombre: "Procesado", color: PALETA[1] }
    ];

    let max = 0;
    puntos.forEach(function (p) {
      series.forEach(function (s) { max = Math.max(max, Number(p[s.campo]) || 0); });
    });
    max = escalaBonita(max);

    const x = function (i) {
      return m.l + (puntos.length === 1 ? iw / 2 : (i * iw) / (puntos.length - 1));
    };
    const y = function (v) {
      return m.t + ih - (Math.min(v, max) / max) * ih;
    };

    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" class="chart" role="img" ' +
      'aria-label="' + esc(o.titulo || "Tendencia") + '" preserveAspectRatio="xMidYMid meet">';

    /* Rejilla y eje Y */
    for (let g = 0; g <= 4; g += 1) {
      const v = (max / 4) * g;
      const yy = y(v);
      svg += '<line x1="' + m.l + '" y1="' + yy + '" x2="' + (W - m.r) + '" y2="' + yy +
        '" class="chart-grid"/>';
      svg += '<text x="' + (m.l - 8) + '" y="' + (yy + 4) + '" class="chart-tick chart-tick-y">' +
        fmt(v) + "</text>";
    }

    /* Eje X: como máximo 6 etiquetas para que no se encimen */
    const salto = Math.max(1, Math.ceil(puntos.length / 6));
    puntos.forEach(function (p, i) {
      if (i % salto !== 0 && i !== puntos.length - 1) return;
      svg += '<text x="' + x(i) + '" y="' + (H - 10) + '" class="chart-tick chart-tick-x">' +
        esc(p.periodo.slice(5)) + "</text>";
    });

    /* Series */
    series.forEach(function (s) {
      const d = puntos.map(function (p, i) {
        return (i === 0 ? "M" : "L") + x(i).toFixed(1) + " " + y(Number(p[s.campo]) || 0).toFixed(1);
      }).join(" ");
      const area = d + " L" + x(puntos.length - 1).toFixed(1) + " " + (m.t + ih) +
        " L" + x(0).toFixed(1) + " " + (m.t + ih) + " Z";
      svg += '<path d="' + area + '" fill="' + s.color + '" opacity="0.08"/>';
      svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.5" ' +
        'stroke-linejoin="round" stroke-linecap="round"/>';
      puntos.forEach(function (p, i) {
        if (puntos.length > 40 && i % salto !== 0) return;
        svg += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(Number(p[s.campo]) || 0).toFixed(1) +
          '" r="3" fill="' + s.color + '"><title>' + esc(p.periodo) + " · " + s.nombre + ": " +
          fmt(p[s.campo]) + " kg</title></circle>";
      });
    });

    svg += "</svg>";

    let leyenda = '<ul class="leyenda">';
    series.forEach(function (s) {
      leyenda += '<li><span class="punto" style="background:' + s.color + '"></span>' +
        esc(s.nombre) + "</li>";
    });
    leyenda += "</ul>";

    return svg + leyenda;
  }

  /* ------------------------------------------------- barras horizontales */

  function barras(datos, opciones) {
    const o = opciones || {};
    if (!datos.length) return vacio();

    const campo = o.campo || "valor";
    const filas = datos.slice(0, o.limite || 8);
    const alto = 34;
    const W = 720;
    const H = filas.length * alto + 12;
    const anchoEtiqueta = 190;
    const max = Math.max.apply(null, filas.map(function (d) { return Number(d[campo]) || 0; })) || 1;

    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" class="chart" role="img" ' +
      'aria-label="' + esc(o.titulo || "Comparativo") + '" preserveAspectRatio="xMidYMin meet">';

    filas.forEach(function (d, i) {
      const yy = i * alto + 6;
      const ancho = ((Number(d[campo]) || 0) / max) * (W - anchoEtiqueta - 90);
      const color = o.color || PALETA[i % PALETA.length];
      svg += '<text x="0" y="' + (yy + 15) + '" class="chart-label">' +
        esc(String(d.nombre).slice(0, 26)) + "</text>";
      svg += '<rect x="' + anchoEtiqueta + '" y="' + yy + '" width="' + Math.max(ancho, 2) +
        '" height="20" rx="4" fill="' + color + '"><title>' + esc(d.nombre) + ": " +
        fmt(d[campo]) + (o.sufijo || " kg") + "</title></rect>";
      svg += '<text x="' + (anchoEtiqueta + Math.max(ancho, 2) + 8) + '" y="' + (yy + 15) +
        '" class="chart-valor">' + fmt(d[campo]) + (o.sufijo || "") + "</text>";
    });

    return svg + "</svg>";
  }

  /* ------------------------------------------------------------- dona */

  function dona(datos, opciones) {
    const o = opciones || {};
    if (!datos.length) return vacio();

    const campo = o.campo || "kg";
    const total = datos.reduce(function (a, d) { return a + (Number(d[campo]) || 0); }, 0);
    if (total <= 0) return vacio();

    const S = 200, c = S / 2, R = 78, r = 48;
    let angulo = -Math.PI / 2;

    let svg = '<svg viewBox="0 0 ' + S + " " + S + '" class="chart chart-dona" role="img" ' +
      'aria-label="' + esc(o.titulo || "Distribución") + '">';

    datos.forEach(function (d, i) {
      const parte = (Number(d[campo]) || 0) / total;
      const fin = angulo + parte * Math.PI * 2;
      const grande = parte > 0.5 ? 1 : 0;
      const x1 = c + R * Math.cos(angulo), y1 = c + R * Math.sin(angulo);
      const x2 = c + R * Math.cos(fin), y2 = c + R * Math.sin(fin);
      const x3 = c + r * Math.cos(fin), y3 = c + r * Math.sin(fin);
      const x4 = c + r * Math.cos(angulo), y4 = c + r * Math.sin(angulo);

      /* Un único segmento al 100% no se puede dibujar con un solo arco. */
      const d1 = parte >= 0.999
        ? "M" + (c - R) + " " + c + " A" + R + " " + R + " 0 1 1 " + (c + R) + " " + c +
          " A" + R + " " + R + " 0 1 1 " + (c - R) + " " + c + " Z " +
          "M" + (c - r) + " " + c + " A" + r + " " + r + " 0 1 0 " + (c + r) + " " + c +
          " A" + r + " " + r + " 0 1 0 " + (c - r) + " " + c + " Z"
        : "M" + x1.toFixed(2) + " " + y1.toFixed(2) +
          " A" + R + " " + R + " 0 " + grande + " 1 " + x2.toFixed(2) + " " + y2.toFixed(2) +
          " L" + x3.toFixed(2) + " " + y3.toFixed(2) +
          " A" + r + " " + r + " 0 " + grande + " 0 " + x4.toFixed(2) + " " + y4.toFixed(2) + " Z";

      svg += '<path d="' + d1 + '" fill="' + PALETA[i % PALETA.length] + '" fill-rule="evenodd">' +
        "<title>" + esc(d.nombre) + ": " + fmt(d[campo]) + " kg (" +
        (parte * 100).toFixed(1) + "%)</title></path>";
      angulo = fin;
    });

    svg += '<text x="' + c + '" y="' + (c - 2) + '" class="dona-total">' + fmt(total) + "</text>";
    svg += '<text x="' + c + '" y="' + (c + 16) + '" class="dona-sub">kg</text>';
    svg += "</svg>";

    let leyenda = '<ul class="leyenda leyenda-col">';
    datos.forEach(function (d, i) {
      const pct = ((Number(d[campo]) || 0) / total) * 100;
      leyenda += '<li><span class="punto" style="background:' + PALETA[i % PALETA.length] + '"></span>' +
        esc(d.nombre) + ' <strong>' + pct.toFixed(1) + "%</strong></li>";
    });
    leyenda += "</ul>";

    return '<div class="dona-wrap">' + svg + leyenda + "</div>";
  }


  /* ------------------------------------------------- Pareto de mermas */

  /* Barras ordenadas de mayor a menor mas la curva de porcentaje acumulado.
     Sirve para ver que pocas causas explican la mayor parte de la merma. */
  function pareto(datos, opciones) {
    const o = opciones || {};
    if (!datos.length) return vacio();

    const filas = datos.slice(0, o.limite || 9);
    const W = 720, H = 300;
    const m = { t: 18, r: 46, b: 92, l: 58 };
    const iw = W - m.l - m.r;
    const ih = H - m.t - m.b;

    /* El Pareto sirve para kilos y para dinero: quien llama decide qué mide
       con o.valor y cómo se lee con o.unidad. */
    const valorDe = o.valor || function (d) { return d.kg; };
    const unidad = o.unidad === undefined ? " kg" : o.unidad;
    const max = escalaBonita(Math.max.apply(null, filas.map(valorDe)));
    const ancho = iw / filas.length;
    const y = function (v) { return m.t + ih - (v / max) * ih; };
    const yAcum = function (p) { return m.t + ih - p * ih; };

    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" class="chart" role="img" ' +
      'aria-label="' + esc(o.titulo || "Pareto de causas") + '" preserveAspectRatio="xMidYMid meet">';

    /* Rejilla: kilogramos a la izquierda, porcentaje acumulado a la derecha */
    for (let g = 0; g <= 4; g += 1) {
      const yy = y((max / 4) * g);
      svg += '<line x1="' + m.l + '" y1="' + yy + '" x2="' + (W - m.r) + '" y2="' + yy +
        '" class="chart-grid"/>';
      svg += '<text x="' + (m.l - 8) + '" y="' + (yy + 4) + '" class="chart-tick chart-tick-y">' +
        fmt((max / 4) * g) + "</text>";
      svg += '<text x="' + (W - m.r + 8) + '" y="' + (yy + 4) + '" class="chart-tick">' +
        (g * 25) + "%</text>";
    }

    filas.forEach(function (d, i) {
      const x = m.l + i * ancho;
      const bw = ancho * 0.62;
      const bx = x + (ancho - bw) / 2;
      const by = y(valorDe(d));
      const color = o.color ? o.color(d) : PALETA[i % PALETA.length];

      svg += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + (m.t + ih - by).toFixed(1) + '" rx="3" fill="' + color + '">' +
        "<title>" + esc(d.nombre) + ": " + fmt(valorDe(d)) + unidad + " · " +
        (d.porcentaje * 100).toFixed(1) + "% del total</title></rect>";

      /* Etiqueta girada: los nombres de causa no caben en horizontal */
      const eje = o.ejeX ? o.ejeX(d) : d.nombre;
      svg += '<text transform="translate(' + (x + ancho / 2).toFixed(1) + "," + (m.t + ih + 10) +
        ') rotate(-38)" class="chart-tick" text-anchor="end">' +
        esc(eje.length > 22 ? eje.slice(0, 21) + "…" : eje) + "</text>";
    });

    /* Curva acumulada */
    const linea = filas.map(function (d, i) {
      return (i === 0 ? "M" : "L") + (m.l + i * ancho + ancho / 2).toFixed(1) + " " +
        yAcum(d.acumulado).toFixed(1);
    }).join(" ");
    svg += '<path d="' + linea + '" fill="none" stroke="' + PALETA[3] +
      '" stroke-width="2" stroke-dasharray="4 3"/>';
    filas.forEach(function (d, i) {
      svg += '<circle cx="' + (m.l + i * ancho + ancho / 2).toFixed(1) + '" cy="' +
        yAcum(d.acumulado).toFixed(1) + '" r="3.5" fill="' + PALETA[3] + '">' +
        "<title>Acumulado: " + (d.acumulado * 100).toFixed(1) + "%</title></circle>";
    });

    /* Referencia del 80%: la frontera clasica del analisis de Pareto */
    svg += '<line x1="' + m.l + '" y1="' + yAcum(0.8).toFixed(1) + '" x2="' + (W - m.r) +
      '" y2="' + yAcum(0.8).toFixed(1) + '" stroke="' + PALETA[3] +
      '" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"/>';

    svg += "</svg>";

    let leyenda = '<ul class="leyenda">';
    (o.leyenda || []).forEach(function (t) {
      leyenda += '<li><span class="punto" style="background:' + t[1] + '"></span>' + esc(t[0]) + "</li>";
    });
    leyenda += '<li><span class="punto punto-linea" style="background:' + PALETA[3] +
      '"></span>% acumulado</li></ul>';

    return svg + leyenda;
  }

  /* ------------------------------------- barra de cumplimiento vs meta */

  function medidor(valor, meta, etiqueta, pie) {
    const pct = meta > 0 ? Math.min(valor / meta, 1.35) : 0;
    const ancho = Math.min(pct, 1) * 100;
    const estado = pct >= 1 ? "ok" : pct >= 0.9 ? "alerta" : "bajo";
    return '<div class="medidor medidor-' + estado + '">' +
      '<div class="medidor-cab"><span>' + esc(etiqueta) + "</span><strong>" +
      (valor * 100).toFixed(1) + "%</strong></div>" +
      '<div class="medidor-pista"><div class="medidor-barra" style="width:' + ancho.toFixed(1) + '%"></div>' +
      '<div class="medidor-meta" style="left:' + Math.min(100, 100).toFixed(1) + '%"></div></div>' +
      '<div class="medidor-pie">' +
      (pie || "Meta ponderada: " + (meta * 100).toFixed(1) + "%") + "</div></div>";
  }

  return {
    PALETA: PALETA,
    lineas: lineas,
    barras: barras,
    dona: dona,
    pareto: pareto,
    medidor: medidor,
    vacio: vacio
  };
})();

</script>

<script>
/* =========================================================================
   ui.js — Kit compartido por el Portal del Proveedor y el Sistema de Planta
   Formato de números, avisos, tablas, formularios y exportación.
   No sabe nada del dominio: eso vive en db.js e indicadores.js.
   ========================================================================= */

const UI = (function () {
  "use strict";

  const $ = function (sel, ctx) { return (ctx || document).querySelector(sel); };
  const $$ = function (sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  };

  /* ------------------------------------------------------------- formato */

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function nf(n, dec) {
    return new Intl.NumberFormat("es-EC", {
      minimumFractionDigits: dec || 0,
      maximumFractionDigits: dec === undefined ? 0 : dec
    }).format(Number(n) || 0);
  }

  function pct(n, dec) {
    return nf((Number(n) || 0) * 100, dec === undefined ? 1 : dec) + "%";
  }

  function pctFirmado(n) {
    const v = (Number(n) || 0) * 100;
    return (v > 0 ? "+" : "") + nf(v, 1) + "%";
  }

  function money(n) { return "$" + nf(n, 2); }

  function cajas(n) { return nf(n) + (Math.abs(Number(n)) === 1 ? " caja" : " cajas"); }

  function minutos(n) {
    /* Se redondea ANTES de partir en horas y minutos. Redondear despues
       produce "70 h 60 min" cuando el resto cae en 59,6. */
    const total = Math.round(Number(n) || 0);
    if (total < 60) return nf(total) + " min";
    const h = Math.floor(total / 60);
    const m = total % 60;
    return nf(h) + " h" + (m ? " " + nf(m) + " min" : "");
  }

  function fechaLarga(iso) {
    if (!iso) return "—";
    const d = new Date(iso.length > 10 ? iso : iso + "T12:00:00");
    return d.toLocaleDateString("es-EC", { day: "2-digit", month: "short", year: "numeric" });
  }

  function fechaCorta(iso) {
    if (!iso) return "—";
    const d = new Date(iso.length > 10 ? iso : iso + "T12:00:00");
    return d.toLocaleDateString("es-EC", { day: "2-digit", month: "short" });
  }

  /* Insignia del origen del dato: M medido, E estimado, S secundario.
     El estándar de rigor del proyecto exige declararlo en cada parámetro. */
  function origen(id) {
    const o = DB.ORIGENES.find(function (x) { return x.id === id; });
    if (!o) return "";
    return '<abbr class="origen origen-' + esc(id) + '" title="' +
      esc(o.nombre + ": " + o.ayuda) + '">' + esc(id) + "</abbr>";
  }

  /* --------------------------------------------------------------- avisos */

  function aviso(mensaje, tipo) {
    let cont = $("#avisos");
    if (!cont) {
      cont = document.createElement("div");
      cont.id = "avisos";
      cont.className = "avisos";
      cont.setAttribute("aria-live", "polite");
      document.body.appendChild(cont);
    }
    const div = document.createElement("div");
    div.className = "aviso aviso-" + (tipo || "ok");
    div.setAttribute("role", "status");
    div.textContent = mensaje;
    cont.appendChild(div);
    setTimeout(function () { div.classList.add("saliendo"); }, 3400);
    setTimeout(function () { div.remove(); }, 3900);
  }

  /* --------------------------------------------------------------- tablas */

  /* La ayuda de un campo se escapa, porque puede venir de un dato. Cuando
     hace falta resaltar una cifra dentro de ella, se usa `ayudaHTML`, que
     es siempre texto escrito en el código, nunca de origen externo. */
  function textoAyuda(c) {
    if (c.ayudaHTML) return '<small class="ayuda">' + c.ayudaHTML + "</small>";
    if (c.ayuda) return '<small class="ayuda">' + esc(c.ayuda) + "</small>";
    return "";
  }

  function tabla(columnas, filas, opciones) {
    const o = opciones || {};
    if (!filas.length) {
      return '<p class="vacio">' + esc(o.vacio || "No hay registros que coincidan con el filtro.") + "</p>";
    }
    let html = '<div class="tabla-scroll"><table class="tabla"><thead><tr>';
    columnas.forEach(function (c) {
      html += '<th scope="col"' + (c.num ? ' class="num"' : "") + ">" + esc(c.titulo) + "</th>";
    });
    html += "</tr></thead><tbody>";
    filas.forEach(function (f) {
      html += "<tr" + (o.filaClase ? ' class="' + o.filaClase(f) + '"' : "") + ">";
      columnas.forEach(function (c) {
        html += "<td" + (c.num ? ' class="num"' : "") + ">" + c.valor(f) + "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function kpi(etiqueta, valor, detalle, tono) {
    return '<article class="kpi kpi-' + (tono || "neutro") + '">' +
      '<p class="kpi-etiqueta">' + esc(etiqueta) + "</p>" +
      '<p class="kpi-valor">' + valor + "</p>" +
      '<p class="kpi-detalle">' + (detalle || "") + "</p></article>";
  }

  /* ---------------------------------------------------------- campana */

  /* El botón y el panel son iguales en las dos aplicaciones; lo que cambia
     es a dónde lleva cada aviso, y de eso se encarga quien la monta. */
  function campana(sinVer) {
    return '<button class="btn btn-plano campana" id="btnCampana" aria-haspopup="true" ' +
      'aria-expanded="false" title="Novedades">' +
      '<span aria-hidden="true">🔔</span>' +
      (sinVer > 0
        ? '<span class="campana-contador">' + (sinVer > 9 ? "9+" : sinVer) + "</span>" +
          '<span class="sr">' + sinVer + " novedades sin ver</span>"
        : '<span class="sr">Novedades</span>') + "</button>";
  }

  function panelNovedades(lista) {
    let html = '<div class="novedades" id="panelNovedades" role="dialog" ' +
      'aria-label="Novedades"><header class="novedades-cab"><strong>Novedades</strong>' +
      '<button type="button" class="modal-x" id="cerrarNovedades" aria-label="Cerrar">&times;</button>' +
      "</header>";

    if (!lista.length) {
      html += '<p class="novedades-vacio">Nada nuevo por ahora. Cuando algo cambie, ' +
        "aparecerá aquí.</p></div>";
      return html;
    }

    html += '<ul class="novedades-lista">';
    lista.forEach(function (n) {
      html += '<li class="novedad novedad-' + esc(n.tipo) + (n.nuevo ? " novedad-nueva" : "") +
        '"><button type="button" class="novedad-btn" data-novedad="' + esc(n.ir) + '"' +
        (n.lote ? ' data-novedad-lote="' + esc(n.lote) + '"' : "") + ">" +
        '<span class="novedad-icono" aria-hidden="true">' + esc(n.icono) + "</span>" +
        '<span class="novedad-texto"><strong>' + esc(n.titulo) + "</strong>" +
        "<small>" + esc(n.detalle) + "</small></span>" +
        '<span class="novedad-fecha">' + fechaCorta(n.fecha) + "</span>" +
        (n.nuevo ? '<span class="novedad-punto" aria-label="sin ver"></span>' : "") +
        "</button></li>";
    });
    return html + "</ul></div>";
  }

  function insignia(estado) {
    return '<span class="estado estado-' + esc(String(estado).toLowerCase()) + '">' +
      esc(estado) + "</span>";
  }

  /* Etiqueta de línea de producto con su color propio. */
  function etiquetaLinea(lineaId) {
    const l = DB.linea(lineaId);
    if (!l) return "—";
    return '<span class="linea-tag" style="--linea:' + esc(l.color) + '">' +
      '<span class="linea-punto" aria-hidden="true"></span>' + esc(l.nombre) + "</span>";
  }

  /* ---------------------------------------------------------- formularios */

  function abrirFormulario(titulo, campos, onSubmit, opciones) {
    const o = opciones || {};
    const capa = document.createElement("div");
    capa.className = "modal-capa";
    capa.innerHTML =
      '<div class="modal' + (o.ancho ? " modal-ancho" : "") + '" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">' +
      '<header class="modal-cab"><h2 id="modalTitulo">' + esc(titulo) + "</h2>" +
      '<button type="button" class="modal-x" aria-label="Cerrar">&times;</button></header>' +
      '<form class="modal-cuerpo" novalidate>' +
      (o.nota ? '<p class="modal-nota">' + o.nota + "</p>" : "") +
      campos.map(campoHTML).join("") +
      '<p class="form-error" id="formError" role="alert" hidden></p>' +
      '<footer class="modal-pie">' +
      '<button type="button" class="btn btn-plano" data-cancelar>Cancelar</button>' +
      /* Un formulario que borra se confirma con un botón que lo parece. */
      '<button type="submit" class="btn ' + (o.peligro ? "btn-peligro" : "btn-primario") +
      '">' + esc(o.aceptar || "Guardar") + "</button>" +
      "</footer></form></div>";

    document.body.appendChild(capa);
    document.body.classList.add("sin-scroll");

    const form = $("form", capa);
    const error = $("#formError", capa);

    function cerrar() {
      capa.remove();
      document.body.classList.remove("sin-scroll");
      document.removeEventListener("keydown", onEsc);
    }
    function onEsc(e) { if (e.key === "Escape") cerrar(); }

    document.addEventListener("keydown", onEsc);
    $(".modal-x", capa).addEventListener("click", cerrar);
    $("[data-cancelar]", capa).addEventListener("click", cerrar);
    capa.addEventListener("mousedown", function (e) { if (e.target === capa) cerrar(); });

    enlazarRepetibles(form, campos, o);

    if (o.alCambiar) {
      const refrescar = function () { o.alCambiar(leer(form, campos), form); };
      form.addEventListener("input", refrescar);
      form.addEventListener("change", refrescar);
      refrescar();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const datos = leer(form, campos);
      const problema = validar(campos, datos);
      if (problema) {
        error.innerHTML = problema;
        error.hidden = false;
        error.scrollIntoView({ block: "nearest" });
        return;
      }
      error.hidden = true;
      const resultado = onSubmit(datos);

      /* Si el guardado es asíncrono —derivar una contraseña, por ejemplo— el
         formulario NO se cierra hasta que termina. Cerrarlo antes deja la
         operación en el aire: basta con que la persona salga enseguida para
         que el cambio se pierda sin avisar. */
      if (resultado && typeof resultado.then === "function") {
        const boton = $("button[type=submit]", form);
        const textoPrevio = boton.textContent;
        boton.disabled = true;
        boton.textContent = "Guardando…";
        resultado.then(function (r) {
          if (r && r.error) {
            error.innerHTML = r.error;
            error.hidden = false;
            boton.disabled = false;
            boton.textContent = textoPrevio;
            return;
          }
          cerrar();
        }).catch(function (e) {
          error.textContent = "No se pudo guardar: " + (e && e.message ? e.message : "error inesperado");
          error.hidden = false;
          boton.disabled = false;
          boton.textContent = textoPrevio;
        });
        return;
      }

      if (resultado && resultado.error) {
        error.innerHTML = resultado.error;
        error.hidden = false;
        return;
      }
      cerrar();
    });

    const primero = $("input:not([readonly]), select:not([disabled]), textarea", form);
    if (primero) primero.focus();
    return { cerrar: cerrar, form: form };
  }

  function campoHTML(c) {
    if (c.tipo === "separador") return '<h3 class="form-sep">' + esc(c.etiqueta) + "</h3>";
    if (c.tipo === "html") return '<div class="campo campo-full">' + c.contenido + "</div>";

    if (c.tipo === "calculado") {
      return '<div class="campo campo-' + (c.ancho || "full") + ' campo-calculado">' +
        "<label>" + esc(c.etiqueta) + '</label><output id="' + esc(c.nombre) + '">—</output>' +
        textoAyuda(c) + "</div>";
    }

    /* Campo repetible: una fila por elemento, con columnas configurables.
       Lo usa el reparto de mermas (causa raíz + kg + destino). */
    if (c.tipo === "repetible") {
      return '<div class="campo campo-full repetible" data-repetible="' + esc(c.nombre) + '">' +
        "<label>" + esc(c.etiqueta) + "</label>" +
        textoAyuda(c) +
        '<div class="rep-filas"></div>' +
        '<button type="button" class="btn btn-plano btn-sm rep-agregar">+ ' +
        esc(c.textoAgregar || "Agregar") + "</button>" +
        '<div class="balance" data-balance></div></div>';
    }

    let control = "";
    const id = "campo_" + c.nombre;
    const base = 'id="' + id + '" name="' + esc(c.nombre) + '"' +
      (c.soloLectura ? " readonly" : "") + (c.requerido ? " required" : "");

    if (c.tipo === "select") {
      control = "<select " + base + (c.soloLectura ? " disabled" : "") + ">";
      if (c.vacio) control += '<option value="">' + esc(c.vacio) + "</option>";
      (c.opciones || []).forEach(function (op) {
        control += '<option value="' + esc(op.valor) + '"' +
          (String(c.valor) === String(op.valor) ? " selected" : "") + ">" + esc(op.texto) + "</option>";
      });
      control += "</select>";
      if (c.soloLectura) {
        control += '<input type="hidden" name="' + esc(c.nombre) + '" value="' + esc(c.valor || "") + '">';
      }
    } else if (c.tipo === "textarea") {
      control = "<textarea " + base + ' rows="3"' +
        (c.marcador ? ' placeholder="' + esc(c.marcador) + '"' : "") + ">" + esc(c.valor || "") + "</textarea>";
    } else if (c.tipo === "checkbox") {
      control = '<label class="check"><input type="checkbox" ' + base +
        (c.valor ? " checked" : "") + "> " + esc(c.textoCheck || "") + "</label>";
    } else {
      /* inputmode saca el teclado correcto en el móvil sin cambiar el tipo. */
      const modo = c.tipo === "number" ? ' inputmode="decimal"'
        : c.tipo === "tel" ? ' inputmode="tel"' : "";
      control = '<input type="' + (c.tipo || "text") + '"' + modo + " " + base +
        ' value="' + esc(c.valor === undefined || c.valor === null ? "" : c.valor) + '"' +
        (c.min !== undefined ? ' min="' + c.min + '"' : "") +
        (c.max !== undefined ? ' max="' + c.max + '"' : "") +
        (c.paso !== undefined ? ' step="' + c.paso + '"' : "") +
        (c.marcador ? ' placeholder="' + esc(c.marcador) + '"' : "") + ">";
    }

    return '<div class="campo campo-' + (c.ancho || "full") + '">' +
      (c.tipo === "checkbox" ? "" : '<label for="' + id + '">' + esc(c.etiqueta) +
        (c.requerido ? ' <span class="req" aria-hidden="true">*</span>' : "") + "</label>") +
      control +
      textoAyuda(c) + "</div>";
  }

  /* Filas dinámicas de un campo repetible. */
  function enlazarRepetibles(form, campos, opciones) {
    campos.filter(function (c) { return c.tipo === "repetible"; }).forEach(function (c) {
      const bloque = $('[data-repetible="' + c.nombre + '"]', form);
      if (!bloque) return;
      const filas = $(".rep-filas", bloque);

      function agregar(valores) {
        const div = document.createElement("div");
        div.className = "rep-fila";
        let html = "";
        c.columnas.forEach(function (col) {
          const v = (valores && valores[col.nombre]) || "";
          if (col.tipo === "select") {
            html += '<select class="rep-campo" data-campo="' + esc(col.nombre) + '" aria-label="' +
              esc(col.etiqueta) + '">';
            col.opciones().forEach(function (op) {
              html += '<option value="' + esc(op.valor) + '"' +
                (String(v) === String(op.valor) ? " selected" : "") + ">" + esc(op.texto) + "</option>";
            });
            html += "</select>";
          } else {
            html += '<input type="number" inputmode="decimal" class="rep-campo" data-campo="' +
              esc(col.nombre) + '" min="0" step="0.1" placeholder="' + esc(col.etiqueta) +
              '" value="' + esc(v) + '" aria-label="' + esc(col.etiqueta) + '">';
          }
        });
        html += '<button type="button" class="btn-mini btn-mini-peligro rep-quitar" aria-label="Quitar fila">✕</button>';
        div.innerHTML = html;
        div.querySelector(".rep-quitar").addEventListener("click", function () {
          div.remove();
          form.dispatchEvent(new Event("input", { bubbles: true }));
        });
        filas.appendChild(div);
      }

      $(".rep-agregar", bloque).addEventListener("click", function () {
        agregar(null);
        form.dispatchEvent(new Event("input", { bubbles: true }));
      });

      (opciones.filasIniciales && opciones.filasIniciales[c.nombre] || []).forEach(agregar);
      if (!filas.children.length) agregar(null);
    });
  }

  function leerRepetible(form, nombre, columnas) {
    const bloque = $('[data-repetible="' + nombre + '"]', form);
    if (!bloque) return [];
    return $$(".rep-fila", bloque).map(function (fila) {
      const out = {};
      columnas.forEach(function (col) {
        const el = $('[data-campo="' + col.nombre + '"]', fila);
        if (!el) return;
        out[col.nombre] = col.tipo === "select" ? el.value : (Number(el.value) || 0);
      });
      return out;
    }).filter(function (x) {
      return columnas.some(function (col) { return col.tipo !== "select" && x[col.nombre] > 0; });
    });
  }

  function leer(form, campos) {
    const datos = {};
    campos.forEach(function (c) {
      if (c.tipo === "separador" || c.tipo === "calculado" || c.tipo === "html") return;
      if (c.tipo === "repetible") {
        datos[c.nombre] = leerRepetible(form, c.nombre, c.columnas);
        return;
      }
      const el = form.elements[c.nombre];
      if (!el) return;
      const nodo = el.length && !el.tagName ? el[el.length - 1] : el;
      if (c.tipo === "checkbox") datos[c.nombre] = nodo.checked;
      else if (c.tipo === "number") datos[c.nombre] = nodo.value === "" ? "" : Number(nodo.value);
      else datos[c.nombre] = String(nodo.value).trim();
    });
    return datos;
  }

  function validar(campos, datos) {
    for (let i = 0; i < campos.length; i += 1) {
      const c = campos[i];
      if (c.tipo === "separador" || c.tipo === "calculado" || c.tipo === "html") continue;
      const v = datos[c.nombre];
      if (c.requerido && (v === "" || v === null || v === undefined)) {
        return "El campo «" + esc(c.etiqueta) + "» es obligatorio.";
      }
      if (c.tipo === "number" && v !== "") {
        if (c.min !== undefined && v < c.min) {
          return "«" + esc(c.etiqueta) + "» no puede ser menor que " + nf(c.min, 1) + ".";
        }
        if (c.max !== undefined && v > c.max) {
          return "«" + esc(c.etiqueta) + "» no puede ser mayor que " + nf(c.max, 1) + ".";
        }
      }
      if (c.validar) {
        const err = c.validar(v, datos);
        if (err) return err;
      }
    }
    return null;
  }

  /* ---------------------------------------------------------- exportación */

  let guardadoDelVisor = null;

  function prepararGuardado() {
    if (typeof window === "undefined" || !window.claude ||
        typeof window.claude.use !== "function") return;
    window.claude.use("downloads")
      .then(function (d) { guardadoDelVisor = d; })
      .catch(function () { guardadoDelVisor = null; });
  }

  function descargar(blob, nombreArchivo) {
    if (guardadoDelVisor) {
      guardadoDelVisor.save({ filename: nombreArchivo, data: blob })
        .then(function () { aviso("Archivo guardado."); })
        .catch(function (e) {
          if (e && e.code === "declined") return;
          aviso("No se pudo guardar el archivo.", "error");
        });
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    aviso("Archivo descargado.");
  }

  function descargarCSV(nombre, columnas, filas) {
    const sep = ";";                       // Excel en español separa con ";"
    const lineas = [columnas.map(function (c) { return c.titulo; }).join(sep)];
    filas.forEach(function (f) {
      lineas.push(columnas.map(function (c) {
        const v = c.csv ? c.csv(f) : "";
        const s = String(v === null || v === undefined ? "" : v);
        return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(sep));
    });
    descargar(new Blob(["﻿" + lineas.join("\r\n")], { type: "text/csv;charset=utf-8;" }),
      nombre + "_" + DB.hoy() + ".csv");
  }

  /* ------------------------------------------------------------- sesión */

  /* La sesión puede vivir solo en la pestaña (por defecto) o recordarse en
     el dispositivo. En el celular del proveedor, recordarla es la
     diferencia entre usar la aplicación y abandonarla. */
  const DIAS_RECUERDO = 30;

  function abrirSesion(clave, usuarioId, recordar) {
    const dato = JSON.stringify({
      id: usuarioId,
      expira: Date.now() + DIAS_RECUERDO * 86400000
    });
    try {
      sessionStorage.setItem(clave, dato);
      if (recordar) localStorage.setItem(clave, dato);
      else localStorage.removeItem(clave);
    } catch (e) { /* modo privado */ }
  }

  function sesionAbierta(clave) {
    for (const almacen of ["sessionStorage", "localStorage"]) {
      try {
        const raw = window[almacen].getItem(clave);
        if (!raw) continue;
        const d = JSON.parse(raw);
        if (d && d.id && (!d.expira || d.expira > Date.now())) return d.id;
        window[almacen].removeItem(clave);
      } catch (e) { /* noop */ }
    }
    return null;
  }

  function cerrarSesion(clave) {
    try { sessionStorage.removeItem(clave); localStorage.removeItem(clave); }
    catch (e) { /* noop */ }
  }

  function guardarSesion(clave, valor) {
    try { sessionStorage.setItem(clave, valor); } catch (e) { /* modo privado */ }
  }

  function leerSesion(clave) {
    try { return sessionStorage.getItem(clave); } catch (e) { return null; }
  }

  function borrarSesion(clave) {
    try { sessionStorage.removeItem(clave); } catch (e) { /* noop */ }
  }

  /* ------------------------------------------- formularios en uso */

  /* Un repintado que llega solo —porque terminó la conexión o porque otro
     dispositivo cambió algo— no puede reconstruir la pantalla encima de
     alguien que está llenando un formulario: le borraría lo escrito. Aquí
     se marca cuándo hay un formulario empezado. */
  let formEnUso = false;

  function vigilarFormulario(form) {
    if (!form) return;
    const marcar = function () { formEnUso = true; };
    form.addEventListener("input", marcar);
    form.addEventListener("change", marcar);
  }

  function formularioEnUso() { return formEnUso; }

  /* Un repintado pedido por la propia persona sí puede seguir adelante. */
  function soltarFormulario() { formEnUso = false; }

  /* Decide si es seguro repintar ahora. Si no lo es, lo aplaza — pero SIEMPRE
     deja un reintento en marcha. Esperar solo al `blur` dejaba el cambio sin
     llegar nunca si la persona no volvía a tocar nada: quien mira la pantalla
     sin escribir tiene el mismo derecho a ver lo que pasó. */
  let reintentoPendiente = null;

  function repintarSiSeguro(repintar, reintentar) {
    const volver = function () { repintarSiSeguro(repintar, reintentar); };

    const activo = document.activeElement;
    const enCampo = activo && /^(INPUT|SELECT|TEXTAREA)$/.test(activo.tagName);

    if (enCampo || formEnUso) {
      if (enCampo) activo.addEventListener("blur", volver, { once: true });
      if (!reintentoPendiente) {
        reintentoPendiente = setTimeout(function () {
          reintentoPendiente = null;
          volver();
        }, 2500);
      }
      return false;
    }

    if (reintentoPendiente) { clearTimeout(reintentoPendiente); reintentoPendiente = null; }
    repintar();
    return true;
  }

  /* Enlace a la otra aplicación. Cambia según el despliegue: carpetas
     separadas en el repositorio, o rutas con # dentro de un solo paquete. */
  function rutaOtraApp(cual) {
    const rutas = (typeof window !== "undefined" && window.FLP_RUTAS) || null;
    if (rutas && rutas[cual]) return 'href="' + rutas[cual] + '"';
    return 'href="../' + cual + '/"';
  }

  /* Arranca cuando el DOM esté listo, incluso si ya lo estaba. */
  function alArrancar(fn) {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", fn);
    } else { fn(); }
  }

  return {
    $: $, $$: $$,
    esc: esc, nf: nf, pct: pct, pctFirmado: pctFirmado, money: money,
    cajas: cajas, minutos: minutos, fechaLarga: fechaLarga, fechaCorta: fechaCorta,
    origen: origen, aviso: aviso, tabla: tabla, kpi: kpi, insignia: insignia,
    campana: campana, panelNovedades: panelNovedades,
    etiquetaLinea: etiquetaLinea,
    abrirFormulario: abrirFormulario, leerRepetible: leerRepetible,
    prepararGuardado: prepararGuardado, descargar: descargar, descargarCSV: descargarCSV,
    abrirSesion: abrirSesion,
    sesionAbierta: sesionAbierta,
    cerrarSesion: cerrarSesion,
    guardarSesion: guardarSesion, leerSesion: leerSesion, borrarSesion: borrarSesion,
    vigilarFormulario: vigilarFormulario,
    formularioEnUso: formularioEnUso,
    soltarFormulario: soltarFormulario,
    repintarSiSeguro: repintarSiSeguro,
    rutaOtraApp: rutaOtraApp,
    alArrancar: alArrancar
  };
})();

</script>

<script>
/* =========================================================================
   novedades.js — "¿Qué pasó desde la última vez que entré?"

   Sin esto, saber si algo cambió obliga a entrar a mirar: el proveedor
   revisa si ya pesaron su fruta, Recepción revisa si llegó un anuncio,
   Supervisión revisa si quedó algo sin cerrar. Esta campana lo dice sola.

   No se guarda una lista de avisos en ningún lado: se DEDUCEN del estado
   actual de los lotes cada vez que hace falta. Lo único que se guarda, y
   solo en el propio equipo, es qué avisos ya vio esta persona. Así no hay
   nada que sincronizar, nada que se desfase y nada que limpiar.
   ========================================================================= */

const Novedades = (function () {
  "use strict";

  const TOPE = 40;          // lo que se muestra; más abajo está el historial
  const TOPE_VISTOS = 400;  // claves recordadas antes de empezar a podar

  function clave(usuarioId) { return "flp.visto." + usuarioId; }

  function leerVistos(usuarioId) {
    try {
      const raw = localStorage.getItem(clave(usuarioId));
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function guardarVistos(usuarioId, lista) {
    try {
      localStorage.setItem(clave(usuarioId), JSON.stringify(lista.slice(-TOPE_VISTOS)));
    } catch (e) { /* sin espacio: se vuelve a avisar, que es el lado seguro */ }
  }

  function fechaDe(l) {
    return l.fechaCierre || l.fechaRecepcion || l.fecha;
  }

  /* ---------------------------------------------------- qué le importa */

  /* El proveedor se entera de lo que le pasó a SU fruta. Nada del interior
     de la planta: ni causas, ni mermas, ni lo de otros proveedores. */
  function paraProveedor(proveedorId) {
    const out = [];
    DB.all("lotes").forEach(function (l) {
      if (l.proveedorId !== proveedorId) return;

      if (l.estado === "Rechazado") {
        out.push({
          id: "rech:" + l.id, tipo: "alerta", icono: "⛔",
          titulo: "Rechazaron el lote " + l.codigoLote,
          detalle: l.observacionesRecepcion || "Sin motivo anotado.",
          fecha: fechaDe(l), ir: "lotes", lote: l.id
        });
        return;
      }
      if (l.cajasRecibidas !== null) {
        const dif = l.cajasRecibidas - l.cajasAnunciadas;
        out.push({
          id: "pesado:" + l.id, tipo: dif < 0 ? "alerta" : "info", icono: "⚖️",
          titulo: "Pesaron tu lote " + l.codigoLote,
          detalle: "Anunciaste " + l.cajasAnunciadas + " cajas y se recibieron " +
            l.cajasRecibidas + (dif === 0 ? "." : dif > 0 ? ", " + dif + " más." : ", " + Math.abs(dif) + " menos."),
          fecha: l.fechaRecepcion || fechaDe(l), ir: "lotes", lote: l.id
        });
      }
      if (l.estado === "Cerrado" && l.reporteEnviado) {
        out.push({
          id: "reporte:" + l.id, tipo: "bueno", icono: "📄",
          titulo: "Ya tienes el reporte del lote " + l.codigoLote,
          detalle: "La planta cerró el lote. Puedes ver el resultado completo.",
          fecha: l.fechaReporte || l.fechaCierre, ir: "lotes", lote: l.id
        });
      }
    });
    return out;
  }

  /* Cada rol de planta ve el trabajo que le está esperando a ÉL. */
  function paraPlanta(rol) {
    const out = [];
    const lotes = DB.all("lotes");

    if (rol === "recepcion" || rol === "supervisor") {
      lotes.filter(function (l) { return l.estado === "Anunciado"; }).forEach(function (l) {
        out.push({
          id: "anuncio:" + l.id, tipo: "info", icono: "🚚",
          titulo: "Envío anunciado: " + l.codigoLote,
          detalle: Indicadores.nombreProveedor(l.proveedorId) + " · " +
            l.cajasAnunciadas + " cajas de " + Indicadores.nombreLinea(l.lineaId) +
            ". Esperando pesaje.",
          fecha: l.fecha, ir: "recepcion", lote: l.id
        });
      });
    }

    if (rol === "produccion" || rol === "supervisor") {
      lotes.filter(function (l) { return l.estado === "Recibido"; }).forEach(function (l) {
        out.push({
          id: "porprocesar:" + l.id, tipo: "info", icono: "🏭",
          titulo: "Listo para procesar: " + l.codigoLote,
          detalle: l.cajasRecibidas + " cajas en cámara · " +
            Indicadores.nombreLinea(l.lineaId) + ".",
          fecha: l.fechaRecepcion || l.fecha, ir: "produccion", lote: l.id
        });
      });
    }

    if (rol === "supervisor") {
      lotes.filter(function (l) { return l.estado === "Procesado"; }).forEach(function (l) {
        const dias = Math.round((new Date(DB.hoy()) - new Date(l.fecha)) / 86400000);
        out.push({
          id: "porcerrar:" + l.id, tipo: dias > 7 ? "alerta" : "info", icono: "✅",
          titulo: "Esperando tu cierre: " + l.codigoLote,
          detalle: Indicadores.nombreProveedor(l.proveedorId) +
            (dias > 7 ? " · lleva " + dias + " días abierto." : " · terminado en planta."),
          fecha: l.fecha, ir: "lotes", lote: l.id
        });
      });

      /* Una cuenta entregada y nunca usada suele ser un acceso que se
         perdió por el camino: conviene saberlo, no descubrirlo tarde. */
      DB.all("usuarios").filter(function (u) {
        return u.activo && u.debeCambiar && !u.ultimoAcceso;
      }).forEach(function (u) {
        out.push({
          id: "sinusar:" + u.id, tipo: "alerta", icono: "🔑",
          titulo: "Acceso sin estrenar: " + u.nombre,
          detalle: "Se le entregó una clave temporal y todavía no ha entrado.",
          fecha: DB.hoy(), ir: "usuarios"
        });
      });
    }

    return out;
  }

  /* ------------------------------------------------------------ lista */

  function listar(usuario) {
    if (!usuario) return [];
    const lista = usuario.rol === "proveedor"
      ? paraProveedor(usuario.proveedorId)
      : paraPlanta(usuario.rol);

    const vistos = leerVistos(usuario.id);
    lista.forEach(function (n) { n.nuevo = vistos.indexOf(n.id) === -1; });

    /* Lo nuevo primero y, dentro de cada grupo, lo más reciente arriba:
       quien abre la campana quiere ver antes lo que no sabía. */
    lista.sort(function (a, b) {
      if (a.nuevo !== b.nuevo) return a.nuevo ? -1 : 1;
      return a.fecha < b.fecha ? 1 : -1;
    });
    return lista.slice(0, TOPE);
  }

  function sinVer(usuario) {
    return listar(usuario).filter(function (n) { return n.nuevo; }).length;
  }

  /* Se marcan como vistos los que de verdad se le mostraron. */
  function marcarVistos(usuario, lista) {
    if (!usuario) return;
    const vistos = leerVistos(usuario.id);
    lista.forEach(function (n) {
      if (vistos.indexOf(n.id) === -1) vistos.push(n.id);
    });
    guardarVistos(usuario.id, vistos);
  }

  function olvidar(usuario) {
    if (!usuario) return;
    try { localStorage.removeItem(clave(usuario.id)); } catch (e) { /* noop */ }
  }

  return {
    listar: listar, sinVer: sinVer, marcarVistos: marcarVistos, olvidar: olvidar
  };
})();

</script>

<script>
/* =========================================================================
   guia.js — La guía de uso, dentro de la propia aplicación

   Un manual aparte envejece y nadie lo abre. Esta guía vive en el sistema,
   se imprime desde él y habla de lo que la persona tiene delante: se arma
   con los catálogos reales (líneas, estados, causas, destinos), así que si
   mañana cambia un parámetro, la guía cambia con él.

   Cada rol ve primero lo suyo y después el resto, porque entender el
   recorrido completo es justamente lo que hace que cada quien registre
   bien su parte.
   ========================================================================= */

const Guia = (function () {
  "use strict";

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ------------------------------------------------------------ piezas */

  function seccion(id, titulo, cuerpo) {
    return '<section class="guia-seccion" id="guia-' + esc(id) + '">' +
      "<h2>" + esc(titulo) + "</h2>" + cuerpo + "</section>";
  }

  /* El título del paso se escapa: va en negrita y no admite marcado, para
     que nadie pueda meter HTML por aquí el día que estos textos salgan de
     un catálogo en vez de estar escritos a mano. El cuerpo sí lo admite. */
  function pasos(lista) {
    let html = '<ol class="guia-pasos">';
    lista.forEach(function (p) {
      html += "<li><strong>" + esc(p[0]) + "</strong><span>" + p[1] + "</span></li>";
    });
    return html + "</ol>";
  }

  function preguntas(lista) {
    let html = '<div class="guia-faq">';
    lista.forEach(function (p) {
      html += "<details><summary>" + esc(p[0]) + "</summary><div>" + p[1] + "</div></details>";
    });
    return html + "</div>";
  }

  function tarjetasRol(resaltado) {
    let html = '<div class="guia-roles">';
    DB.ROLES.forEach(function (r) {
      html += '<div class="guia-rol' + (r.id === resaltado ? " guia-rol-tuyo" : "") + '">' +
        '<span class="guia-rol-icono" aria-hidden="true">' + esc(r.icono) + "</span>" +
        "<strong>" + esc(r.nombre) + (r.id === resaltado ? " · tú" : "") + "</strong>" +
        "<small>" + esc(r.lema) + "</small></div>";
    });
    return html + "</div>";
  }

  /* Lo que el proveedor ve de cada paso. La ayuda del catálogo está escrita
     para planta —habla de causas raíz y de mermas— y eso ni le sirve ni le
     corresponde: ve el recorrido de SU fruta, no el interior del proceso. */
  const PASO_PROVEEDOR = {
    Anunciado: "Avisaste que envías. La planta ya lo tiene en su cola y lo espera.",
    Recibido: "Tu fruta llegó: contaron las gavetas y la pesaron en báscula.",
    Procesado: "La planta ya trabajó tu lote. Falta que lo revisen y lo cierren.",
    Cerrado: "Terminado. Aquí ves cuántas cajas salieron para exportación.",
    Rechazado: "La fruta no cumplió los mínimos y no entró. Verás el motivo escrito."
  };

  /* El recorrido del pedido, estado por estado, con quién lo mueve. */
  function recorrido(paraProveedor) {
    let html = '<ol class="guia-recorrido">';
    DB.ESTADOS.filter(function (e) { return e.id !== "Rechazado"; })
      .sort(function (a, b) { return a.orden - b.orden; })
      .forEach(function (e) {
        const rol = DB.ROLES.find(function (r) { return r.id === e.rol; });
        html += '<li><span class="guia-estado">' + esc(e.nombre) + "</span>" +
          '<span class="guia-quien">' + esc(rol ? rol.icono + " " + rol.nombre : "—") + "</span>" +
          "<span>" + esc(paraProveedor ? (PASO_PROVEEDOR[e.id] || e.ayuda) : e.ayuda) +
          "</span></li>";
      });
    const rech = DB.ESTADOS.find(function (e) { return e.id === "Rechazado"; });
    if (rech) {
      html += '<li class="guia-recorrido-desvio"><span class="guia-estado">' + esc(rech.nombre) +
        '</span><span class="guia-quien">⚖️ Recepción</span><span>' +
        esc(paraProveedor ? PASO_PROVEEDOR.Rechazado
          : rech.ayuda + " El proveedor lo ve en su portal con el motivo.") +
        "</span></li>";
    }
    return html + "</ol>";
  }

  function sinSenal() {
    return "<p>La app <strong>no se cae si se cae la señal</strong>. Lo que registres " +
      "queda guardado en el propio equipo y sale solo cuando vuelva la conexión. " +
      "Mientras tanto verás una franja arriba que dice cuántos registros están " +
      "sin enviar, y cada uno aparece marcado como <em>Pendiente de enviar</em>.</p>" +
      "<p class='guia-ojo'>Lo que <strong>no</strong> hay que hacer: volver a registrar " +
      "lo mismo porque parece que no se guardó. Se guardó. Repetirlo crea un duplicado " +
      "que después hay que limpiar a mano.</p>";
  }

  function origenes() {
    return "<p>Junto a muchos números verás una letra pequeña. Dice de dónde sale ese dato, " +
      "y está ahí porque el documento del proyecto exige declararlo:</p>" +
      '<ul class="guia-origenes">' +
      "<li>" + UI.origen("M") + " <strong>Medido</strong> — cronometrado o pesado en planta.</li>" +
      "<li>" + UI.origen("E") + " <strong>Estimado</strong> — valor de trabajo, pendiente de " +
      "confirmar con la empresa.</li>" +
      "<li>" + UI.origen("S") + " <strong>Fuente secundaria</strong> — tomado de norma o " +
      "bibliografía (por ejemplo los suplementos de la OIT).</li></ul>" +
      "<p>Un número con <strong>E</strong> no está mal: está sin confirmar. Antes de usar " +
      "la app para decidir algo serio, conviene revisar esos en <em>Parámetros</em>.</p>";
  }

  /* ===================================================== guía de planta */

  function planta(rol) {
    const esSupervisor = rol === "supervisor";
    const esRecepcion = rol === "recepcion";
    const esProduccion = rol === "produccion";

    let html = '<div class="guia">';

    html += '<header class="guia-cab"><p class="guia-eyebrow">' + esc(DB.EMPRESA.razonSocial) +
      '</p><h1>Guía del Sistema de Planta</h1>' +
      '<p class="sub">Qué hace cada quien, en qué orden, y qué significa lo que se ve ' +
      "en pantalla. Se puede imprimir y dejar en el escritorio de planta.</p></header>";

    html += seccion("quien", "Quién hace qué",
      "<p>Son cuatro papeles. Cada pedido pasa por los cuatro, en este orden, y nadie " +
      "puede hacer el paso de otro: así cada dato lo captura quien lo conoce de " +
      "primera mano.</p>" + tarjetasRol(rol));

    html += seccion("recorrido", "El recorrido de un pedido",
      "<p>Un pedido (en el sistema, un <strong>lote</strong>) nace cuando el proveedor " +
      "anuncia el envío desde su celular y termina cuando Supervisión lo cierra.</p>" +
      "<p class='guia-ojo'><strong>Dos unidades, no una.</strong> Del campo llega la " +
      "<strong>gaveta</strong> (11 kg en pitahaya, 20 en tomate, 12 en granadilla). Al " +
      "contenedor sale la <strong>caja de exportación</strong> (3 / 2,5 / 2 kg). " +
      "Todo lo que se cuenta en recepción y en proceso son gavetas; las cajas aparecen " +
      "al empacar. Confundirlas hace que ningún indicador signifique nada.</p>" +
      recorrido() +
      "<p class='guia-ojo'><strong>Ningún estado se marca a mano.</strong> Cada uno se " +
      "alcanza haciendo el trabajo: el lote pasa a <em>Recibido</em> cuando Recepción lo " +
      "pesa, a <em>Procesado</em> cuando Producción registra lo que salió, y a " +
      "<em>Cerrado</em> cuando Supervisión lo cierra. En la ficha de cualquier lote, " +
      "arriba, dice qué sigue y a quién le toca.</p>" +
      "<p class='guia-ojo'>Mientras un lote no esté <strong>Cerrado</strong>, se puede " +
      "corregir. Una vez cerrado, no: hay que reabrirlo, y eso queda anotado.</p>");

    /* --- lo tuyo primero --- */
    if (esRecepcion || esSupervisor) {
      html += seccion("pesar", "Recibir y pesar lo que llega",
        pasos([
          ["Abre «Recepción y pesaje»",
           "Arriba está <em>Esperando en el patio</em>: todo lo que los proveedores " +
           "anunciaron y aún no se ha pesado. El número rojo del menú es esa misma cola."],
          ["Pulsa «Pesar» en el lote que acaba de llegar",
           "Verás lo que el proveedor declaró. Escribe las gavetas que realmente contaste " +
           "y los kilos de la báscula."],
          ["Mira la diferencia que calcula la pantalla",
           "Si lo pesado se aparta mucho de lo anunciado, el sistema lo señala. Esa " +
           "diferencia es la causa raíz <strong>CR6</strong> hecha número, y es la base " +
           "de la conversación con el proveedor."],
          ["Verifica la calidad",
           "Puedes confirmar la calidad declarada o corregirla. Si la fruta no cumple, " +
           "usa <em>Rechazar</em> y escribe el motivo: el proveedor lo verá."],
          ["¿Te equivocaste al teclear?",
           "<em>Corregir pesaje</em>, en la misma fila. Se puede mientras el lote no esté " +
           "cerrado, y la bitácora guarda el valor anterior, quién lo cambió y cuándo."]
        ]));
    }

    if (esProduccion || esSupervisor) {
      html += seccion("procesar", "Registrar la producción",
        pasos([
          ["Abre «Producción» y elige un lote recibido",
           "Solo aparecen los que Recepción ya pesó."],
          ["Anota gavetas procesadas, cajas exportables y el tiempo real",
           "El tiempo es el que de verdad tomó. El sistema lo compara contra el " +
           "<strong>contenido de trabajo</strong> del estudio de tiempos —minutos-persona, " +
           "no minutos de reloj— y de ahí sale la eficiencia."],
          ["Reparte la merma por causa y por destino",
           "Cada kilo de descarte lleva dos cosas: <strong>por qué</strong> se perdió " +
           "(la causa raíz) y <strong>a dónde</strong> fue. Ese segundo dato es el que " +
           "hace posible la economía circular; sin él, todo el descarte parece basura."],
          ["Cuadra el balance de masa, en kilos",
           "Lo empacado más la merma tiene que dar lo que entró a proceso. Se cuadra en " +
           "<strong>kilos</strong>, no en bultos, porque la gaveta que entra y la caja que " +
           "sale pesan cosas distintas. La pantalla no deja guardar si no cuadra: es lo " +
           "que evita que los indicadores salgan mentirosos."],
          ["Al guardar, el pedido pasa a Supervisión",
           "Queda en estado <em>Procesado</em>, esperando el cierre."]
        ]));
    }

    if (esSupervisor) {
      html += seccion("cerrar", "Cerrar el pedido  ·  dónde está",
        "<p>Es el paso que termina el ciclo, y solo lo puede hacer Supervisión. Hay " +
        "<strong>tres sitios</strong> desde donde se hace, todos llevan a lo mismo:</p>" +
        pasos([
          ["Menú «Lotes» → bloque «Terminados, esperando el cierre»",
           "Es la vía normal. Ese bloque junta todos los pedidos ya procesados y sin " +
           "cerrar, con los días que llevan abiertos. El número junto a <em>Lotes</em> " +
           "en el menú es esa misma cuenta."],
          ["Desde la ficha del pedido",
           "Abre <em>Ficha</em> en cualquier lote procesado: abajo tienes " +
           "<em>Cerrar pedido</em>."],
          ["En la tabla de todos los lotes",
           "El botón <em>Cerrar</em> aparece en la fila de cualquier lote en estado " +
           "<em>Procesado</em>."]
        ]) +
        "<p>Antes de cerrar verás la ficha completa para revisarla. En el cuadro de " +
        "cierre hay una casilla: <strong>publicar el reporte en el portal del " +
        "proveedor</strong>. Si la dejas marcada, el proveedor ve el resultado de su " +
        "lote en cuanto cierras.</p>" +
        "<p class='guia-ojo'>Un pedido cerrado <strong>no admite cambios</strong>. Si " +
        "hace falta enmendarlo, usa <em>Reabrir</em> en la fila del lote: vuelve a " +
        "<em>Procesado</em> y la reapertura queda en la bitácora con tu nombre.</p>");

      html += seccion("tiempos", "Estudio de tiempos y asignación",
        "<p>En <em>Estudio de tiempos</em> está la cadena completa, actividad por " +
        "actividad: la lectura del cronómetro (TO), la valoración del ritmo, el " +
        "suplemento de la OIT y el tiempo estándar que sale de ahí. <strong>El estándar " +
        "no se teclea: se calcula.</strong> Cuando se cronometren ciclos nuevos, basta " +
        "cambiar la lectura y se recalculan solos el takt, los operarios, el costo por " +
        "caja y el costeo de las causas.</p>" +
        "<p><strong>Hay dos relojes y conviene no mezclarlos:</strong></p>" +
        '<dl class="guia-defs">' +
        "<dt>Tiempo de ciclo (min por gaveta)</dt><dd>Lo que tarda una gaveta en recorrer " +
        "la línea. Sirve para prometer entregas y para compararse con el takt. No depende " +
        "de cuánta gente haya.</dd>" +
        "<dt>Contenido de trabajo (minutos-persona por gaveta)</dt><dd>La mano de obra que " +
        "consume esa misma gaveta. Sirve para asignar personal y para costear. Sí depende: " +
        "una actividad atendida por dos personas tarda lo mismo y cuesta el doble.</dd></dl>" +
        "<p>La gente se asigna con el segundo dividido para el takt, y por estación, no en " +
        "bloque. La estación que concentra más contenido es la que manda: es donde una " +
        "mejora de método se nota, y donde un operario de más se desperdicia.</p>" +
        "<p class='guia-ojo'>Si una lectura tiene pocas repeticiones, el estándar que sale " +
        "de ella es frágil. La columna de origen lo dice: " + UI.origen("M") + " es " +
        "cronometrado, " + UI.origen("E") + " es estimado y hay que confirmarlo midiendo.</p>");

      html += seccion("planificar", "Planificar el día",
        "<p>En <em>Planificación diaria</em> escribes cuántas <strong>gavetas</strong> hay " +
        "que procesar por línea y el sistema responde tres cosas: cuánta mano de obra pide " +
        "(el contenido de trabajo), cuántos operarios hacen falta y cada cuántos minutos " +
        "debe salir una gaveta (el <em>takt time</em>). Si el plan no cabe en el turno, lo dice y calcula " +
        "cuánta gente falta. También avisa si no hay materia prima suficiente en cámara.</p>");

      html += seccion("costeo", "Costeo y simulador de mejora",
        "<p>En <em>Costeo y mejora</em> la pérdida deja de estar en kilos y pasa a " +
        "dólares al año, causa por causa. El costo de cada causa suma tres cosas: la " +
        "fruta que no se exportó, menos lo que el destino recupera, más las horas-hombre " +
        "que ya se gastaron en esa fruta.</p>" +
        "<p>Debajo está el simulador: activas las medidas que se proponen, o mueves a " +
        "mano cuánto crees que bajaría cada causa, y te devuelve el ahorro al año, en " +
        "cuánto se recupera la inversión y los indicadores antes y después.</p>" +
        "<p class='guia-ojo'>Todo lo del simulador es <strong>supuesto</strong> " +
        "(" + UI.origen("S") + "), no medido. Sirve para decidir y para defender la " +
        "propuesta, no para prometer un resultado.</p>");

      html += seccion("liquidar", "Pagar al proveedor",
        "<p>En <em>Liquidaciones</em> está, por proveedor y por período, lo que hay que " +
        "pagarle. <strong>Se liquida sobre el kilo de báscula</strong> —no sobre lo que el " +
        "proveedor declaró ni sobre bultos—, porque es el único dato que las dos partes " +
        "vieron.</p>" +
        "<p>Cada proveedor tiene su documento imprimible, con el detalle lote por lote, el " +
        "total y dos espacios de firma. El mismo período y el mismo proveedor dan siempre " +
        "el mismo número de documento, así que reimprimirlo no crea uno nuevo.</p>" +
        "<p class='guia-ojo'>Dos cosas que conviene saber antes de la primera discusión: " +
        "un lote <strong>ya pesado se paga aunque siga en planta</strong> —se liquida lo " +
        "que entró, no lo que salió— y un lote <strong>rechazado aparece igual</strong>, " +
        "con importe cero y su motivo escrito. No decirlo es lo que genera la llamada.</p>" +
        "<p>El proveedor ve su propia liquidación en el portal, en <em>Pagos</em>, con el " +
        "mismo cálculo. Si una cifra no le cuadra, tiene el detalle de cada lote en " +
        "<em>Mis envíos</em>.</p>");

      html += seccion("gente", "Dar acceso a alguien",
        pasos([
          ["Persona de planta",
           "<em>Usuarios</em> → <em>Nuevo usuario</em>. El sistema genera una clave " +
           "temporal que <strong>se muestra una sola vez</strong>: anótala o imprímela y " +
           "entrégala. Quien entre con ella tendrá que cambiarla de inmediato."],
          ["Proveedor nuevo",
           "<em>Proveedores</em> → <em>Nuevo</em>. Se le entrega un código de activación " +
           "y él mismo crea su contraseña desde el portal, con su documento. Nadie en " +
           "planta conoce la clave de un proveedor."],
          ["Se le olvidó la contraseña",
           "No se puede recuperar, solo reemplazar: <em>Restablecer</em> junto a la " +
           "persona. A un proveedor se le vuelve a habilitar la activación."]
        ]));
    }

    /* --- lo común --- */
    html += seccion("indicadores", "Cómo leer los indicadores",
      '<dl class="guia-defs">' +
      "<dt>Rendimiento exportable</dt><dd>De cada 100 kilos que entran a proceso, cuántos " +
      "salen empacados. Se mide <strong>en kilos</strong>, no en bultos: la gaveta que " +
      "entra y la caja que sale pesan cosas distintas, así que contar bultos no diría " +
      "nada. Se compara contra la meta de cada línea.</dd>" +
      "<dt>Merma</dt><dd>Kilos perdidos sobre kilos procesados. El Pareto por causa raíz " +
      "dice de dónde viene y cuáles pocas causas explican la mayor parte.</dd>" +
      "<dt>Aprovechado</dt><dd>Qué parte del descarte NO fue al relleno sanitario. Es el " +
      "indicador de economía circular.</dd>" +
      "<dt>Eficiencia</dt><dd>Contenido de trabajo estándar dividido para el tiempo que " +
      "de verdad consumió la gente. Por debajo de 100% la línea tardó más de lo que el " +
      "estudio de tiempos dice.</dd>" +
      "<dt>Diferencia en gavetas y en kilos</dt><dd>Lo pesado contra lo que el proveedor " +
      "declaró. Pueden llegar todas las gavetas y aun así pesar menos, si vienen " +
      "incompletas: por eso son dos indicadores y no uno.</dd></dl>");

    html += seccion("origen", "La letra pequeña junto a los números", origenes());
    html += seccion("senal", "Cuando no hay señal", sinSenal());

    html += seccion("dudas", "Dudas frecuentes", preguntas([
      ["¿Dónde marco que un lote ya fue procesado?",
       "En ningún sitio: <strong>no hay un botón de «marcar como procesado»</strong>. El " +
       "lote pasa a <em>Procesado</em> solo, en cuanto Producción registra el trabajo " +
       "—cajas obtenidas, tiempo y reparto de la merma— desde <em>Producción</em>. Lo " +
       "mismo vale para los demás estados: ninguno se marca a mano, cada uno se alcanza " +
       "haciendo su parte. Si tienes dudas con un lote concreto, abre su <em>Ficha</em>: " +
       "arriba dice qué sigue y a quién le toca."],
      ["No encuentro el botón para cerrar un pedido.",
       "Solo aparece en pedidos en estado <em>Procesado</em> y solo para Supervisión. " +
       "Si el lote todavía no tiene la producción registrada, no hay nada que cerrar."],
      ["Me equivoqué y el lote ya está cerrado.",
       "Supervisión puede reabrirlo desde <em>Lotes</em>. Vuelve a <em>Procesado</em>, se " +
       "corrige y se vuelve a cerrar. Todo queda en la bitácora."],
      ["¿Por qué no me deja guardar la producción?",
       "Casi siempre es el balance de masa: exportable + merma debe igualar lo procesado. " +
       "La pantalla muestra en rojo cuánto falta o sobra."],
      ["Dos personas tocaron el mismo lote a la vez.",
       "Queda lo que guardó el último. Conviene que cada rol trabaje lo suyo; si pasa, " +
       "la bitácora muestra los dos movimientos."],
      ["¿Los datos son reales?",
       "No. Lo que viene cargado son datos de demostración con semilla fija, para que " +
       "las capturas del documento se puedan repetir. Antes de concluir algo hay que " +
       "reemplazarlos por registros reales."]
    ]));

    html += '<footer class="guia-pie"><p>' + esc(DB.EMPRESA.sistema) + " · " +
      esc(DB.EMPRESA.descripcion) + " · Guía generada el " +
      UI.fechaLarga(DB.hoy()) + ".</p></footer>";

    return html + "</div>";
  }

  /* ==================================================== guía del portal */

  function portal() {
    let html = '<div class="guia">';

    html += '<header class="guia-cab"><h1>Cómo usar el portal</h1>' +
      '<p class="sub">Todo lo que hace falta saber para anunciar tus envíos y seguir ' +
      "cada lote. Son cinco minutos de lectura.</p></header>";

    html += seccion("para-que", "¿Para qué sirve este portal?",
      "<p>Para dos cosas, y las dos te ahorran llamadas:</p>" +
      "<ul><li><strong>Avisar que envías fruta</strong>, antes de que el camión llegue. " +
      "La planta ve tu envío en su cola en el mismo instante y lo espera.</li>" +
      "<li><strong>Ver qué pasó con tu fruta</strong>: cuántas gavetas se recibieron de " +
      "verdad, cuántas salieron para exportación y cómo quedó tu lote.</li></ul>" +
      "<p>Solo ves lo tuyo. Ningún otro proveedor ve tus envíos, y tú no ves los suyos.</p>");

    html += seccion("anunciar", "Anunciar un envío",
      pasos([
        ["Pulsa el botón grande «Anunciar envío»", "Está en la pantalla de inicio."],
        ["Elige la línea y escribe las gavetas",
         "Pitahaya, tomate de árbol o granadilla. Son las gavetas que vas a mandar, " +
         "tal como salen de la finca —no las cajas de exportación, que las arma la planta."],
        ["Indica el peso aproximado de cada gaveta",
         "No tiene que ser exacto. Sirve para que planta sepa cuánto peso esperar, y " +
         "para ir comparando lo declarado con la báscula."],
        ["Declara la calidad y, si quieres, deja una observación",
         "Por ejemplo, si parte del lote viene de una cosecha distinta."],
        ["Guarda",
         "Listo. El lote queda en estado <em>Anunciado</em> y lo ves en <em>Mis envíos</em>."]
      ]) +
      "<p class='guia-ojo'>Anunciar no es un compromiso de facturación: es un aviso. " +
      "Lo que vale para la liquidación es lo que la báscula de planta registre.</p>");

    html += seccion("seguir", "Seguir tu lote",
      "<p>En <em>Mis envíos</em> cada tarjeta muestra en qué punto va:</p>" + recorrido(true) +
      "<p>Cuando Supervisión cierra el lote y publica el reporte, en tu tarjeta aparece " +
      "el resultado: cajas recibidas, diferencia con lo que anunciaste y cuántas cajas " +
      "salieron para exportación.</p>" +
      "<p class='guia-ojo'>Verás el resultado de <strong>tu</strong> fruta, no el detalle " +
      "interno de la planta. Las causas de pérdida del proceso no se publican.</p>");

    html += seccion("pagos", "Lo que te van a pagar",
      "<p>En <em>Pagos</em> está el total del período y el detalle de cada entrega: " +
      "kilos de báscula, precio por kilo e importe. Se paga <strong>por kilo pesado en " +
      "planta</strong>, no por lo que declaraste al enviar ni por gavetas.</p>" +
      "<p>Una entrega <strong>ya pesada cuenta aunque siga en planta</strong>: se paga lo " +
      "que entró, no lo que salió. Y si una entrega fue rechazada, aparece con importe " +
      "cero y el motivo escrito, para que sepas exactamente por qué.</p>" +
      "<p class='guia-ojo'>Si una cifra no te cuadra, entra a <em>Mis envíos</em>: ahí " +
      "está, lote por lote, lo que declaraste y lo que marcó la báscula.</p>");

    html += seccion("desempeno", "Tu desempeño",
      "<p>La sección <em>Mi desempeño</em> es la que más conviene mirar cada mes. " +
      "Compara lo que declaras con lo que la báscula encuentra. Si la diferencia es " +
      "pequeña y constante, tu fruta entra sin fricción; si es grande o cambia mucho de " +
      "un envío a otro, es señal de algo corregible: cajas mal llenadas, pesaje en " +
      "finca, o cosecha despareja.</p>" +
      "<p>Esa constancia es, para la planta, tan importante como el volumen.</p>");

    html += seccion("cuenta", "Tu cuenta y tu contraseña",
      pasos([
        ["La primera vez: activas tú mismo",
         "Con el código que te dio la empresa y tu número de documento. La contraseña la " +
         "eliges tú y nadie de la planta la conoce."],
        ["Si la olvidas",
         "No se puede recuperar, solo cambiar. Pide a la empresa que habilite otra vez la " +
         "activación y vuelves a elegir una."],
        ["En tu teléfono de siempre",
         "Marca <em>Recordarme</em> y no tendrás que escribirla cada vez."]
      ]));

    html += seccion("senal", "Si no hay señal en la finca", sinSenal());

    html += '<footer class="guia-pie"><p>Portal del Proveedor · ' +
      esc(DB.EMPRESA.nombre) + " · Guía generada el " + UI.fechaLarga(DB.hoy()) +
      ".</p></footer>";

    return html + "</div>";
  }

  /* Un <details> cerrado no se imprime: el navegador oculta su contenido y
     ninguna regla de CSS lo saca. Se abren antes de imprimir y se devuelven
     a como estaban después, para que la guía en papel salga completa. */
  if (typeof window !== "undefined") {
    window.addEventListener("beforeprint", function () {
      Array.prototype.forEach.call(
        document.querySelectorAll(".guia-faq details:not([open])"), function (d) {
          d.dataset.reabrir = "1";
          d.open = true;
        });
    });
    window.addEventListener("afterprint", function () {
      Array.prototype.forEach.call(
        document.querySelectorAll(".guia-faq details[data-reabrir]"), function (d) {
          d.open = false;
          delete d.dataset.reabrir;
        });
    });
  }

  return { planta: planta, portal: portal };
})();

</script>

<script>
/* =========================================================================
   portal.js — Portal del Proveedor (aplicación externa)

   Lo que el proveedor puede hacer: anunciar sus envíos y seguir el
   resultado de cada lote. Nada más.

   Aislamiento: todas las lecturas pasan por misLotes(), que filtra por el
   proveedor de la sesión. El portal nunca consulta las colecciones sin ese
   filtro, así que un proveedor no puede ver lotes de otro ni aunque
   manipule la interfaz. Tampoco ve las causas internas de planta: solo las
   de origen «Campo», que son las que dependen de él.
   ========================================================================= */

(function () {
  "use strict";

  const $ = UI.$, $$ = UI.$$;
  const esc = UI.esc, nf = UI.nf, pct = UI.pct, money = UI.money;
  const SESION = "flp.portal.sesion";

  let usuario = null;
  let vista = "inicio";
  let novedadesAbiertas = false;
  /* Texto escrito en el buscador de «Mis envíos». */
  let busqueda = "";

  /* ============================== sesión ============================== */

  async function entrar(acceso, clave, recordar) {
    const codigo = String(acceso).trim();
    if (!codigo) return { error: "Escribe tu código de proveedor." };
    if (!clave) return { error: "Escribe tu contraseña." };

    const espera = Auth.bloqueo(codigo);
    if (espera > 0) {
      return { error: "Demasiados intentos fallidos. Espera " + espera + " segundos." };
    }

    const u = DB.buscarPorAcceso(codigo);
    /* El mismo mensaje para código inexistente y contraseña equivocada: si
       se distinguieran, se podría averiguar qué códigos existen. */
    const generico = "Código o contraseña incorrectos.";

    if (!u || u.rol !== "proveedor") {
      const espera = Auth.anotarFallo(codigo);
      return { error: espera > 0
        ? "Demasiados intentos fallidos. Espera " + espera + " segundos."
        : generico };
    }
    if (!u.credencial) {
      return { error: "Tu cuenta aún no está activada. Usa «Activa tu cuenta aquí» " +
        "para crear tu contraseña." };
    }

    const vale = await Auth.verificar(clave, u.credencial);
    if (!vale) {
      const espera = Auth.anotarFallo(codigo);
      return { error: espera > 0
        ? "Demasiados intentos fallidos. Espera " + espera + " segundos."
        : generico };
    }
    if (!u.activo) return { error: "Tu acceso está desactivado. Comunícate con la planta." };

    Auth.limpiarFallos(codigo);
    usuario = u;
    DB.update("usuarios", u.id, { ultimoAcceso: new Date().toISOString() });
    UI.abrirSesion(SESION, u.id, recordar);
    DB.registrarBitacora(u.id, "Ingreso al portal", u.nombre);
    return { ok: true, debeCambiar: !!u.debeCambiar };
  }

  function salir() {
    novedadesAbiertas = false;
    busqueda = "";
    if (usuario) DB.registrarBitacora(usuario.id, "Salida del portal", usuario.nombre);
    usuario = null;
    if (repintado) { clearTimeout(repintado); repintado = null; }
    vista = "inicio";
    UI.cerrarSesion(SESION);
    render();
  }

  function restaurar() {
    const id = UI.sesionAbierta(SESION);
    if (!id) return;
    const u = DB.get("usuarios", id);
    if (u && u.rol === "proveedor" && u.activo) usuario = u;
  }

  /* ========================= lectura aislada ========================== */

  /* Único punto de acceso a los datos del portal. */
  function misLotes() {
    if (!usuario) return [];
    return DB.all("lotes")
      .filter(function (l) { return l.proveedorId === usuario.proveedorId; })
      .sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0; });
  }

  function miProveedor() { return DB.get("proveedores", usuario.proveedorId); }

  function produccionDe(loteId) {
    return DB.all("producciones").find(function (p) { return p.loteId === loteId; }) || null;
  }

  /* Solo las causas que nacen en campo: son las que el proveedor puede
     corregir. Las de planta (layout, sopleteado) no son asunto suyo. */
  function causasDeCampo(prod) {
    if (!prod) return [];
    return (prod.mermas || []).filter(function (m) {
      const c = DB.causa(m.causaId);
      return c && c.origen === "Campo";
    }).sort(function (a, b) { return b.kg - a.kg; });
  }

  function resumen() {
    const lotes = misLotes();
    const enCurso = lotes.filter(function (l) {
      return l.estado === "Anunciado" || l.estado === "Recibido" || l.estado === "Procesado";
    });

    let cajasAnun = 0, cajasRec = 0, cajasProc = 0, cajasExp = 0, valor = 0, calA = 0, rech = 0;
    let kgProc = 0, kgExp = 0;
    lotes.forEach(function (l) {
      cajasAnun += Number(l.gavetasAnunciadas) || 0;
      if (l.estado === "Rechazado") { rech += 1; return; }
      if (l.gavetasRecibidas === null) return;
      cajasRec += Number(l.gavetasRecibidas) || 0;
      valor += (Number(l.kgRecibidos) || 0) * (Number(l.precioKg) || 0);
      if (l.calidadVerificada === "A") calA += Number(l.gavetasRecibidas) || 0;
      const p = produccionDe(l.id);
      if (p) {
        cajasProc += Number(p.gavetasProcesadas) || 0;
        cajasExp += Number(p.cajasExportables) || 0;
        /* El rendimiento se mide en kilos: la gaveta que entrega y la caja
           que sale pesan cosas distintas. */
        kgProc += Number(p.kgProcesados) || 0;
        kgExp += Number(p.kgExportable) || 0;
      }
    });

    const pesados = lotes.filter(function (l) {
      return l.gavetasRecibidas !== null && l.estado !== "Rechazado";
    });
    const anunPesadas = pesados.reduce(function (a, l) { return a + l.gavetasAnunciadas; }, 0);

    return {
      lotes: lotes.length, enCurso: enCurso.length, rechazados: rech,
      gavetasAnunciadas: cajasAnun, gavetasRecibidas: cajasRec,
      diferencia: cajasRec - anunPesadas,
      tasaDiferencia: anunPesadas > 0 ? (cajasRec - anunPesadas) / anunPesadas : 0,
      cajasExportables: cajasExp,
      tasaExportable: kgProc > 0 ? kgExp / kgProc : 0,
      pctCalidadA: cajasRec > 0 ? calA / cajasRec : 0,
      valor: valor,
      tasaRechazo: lotes.length > 0 ? rech / lotes.length : 0
    };
  }

  /* =============================== vistas ============================= */

  function vistaInicio() {
    const r = resumen();
    const lotes = misLotes();
    const activos = lotes.filter(function (l) { return l.estado !== "Cerrado" && l.estado !== "Rechazado"; });

    let html = '<section class="portal-saludo">' +
      "<h1>Hola, " + esc(usuario.nombre.split(" ")[0]) + "</h1>" +
      '<p class="sub">' + esc(miProveedor().nombre) + "</p>" +
      '<button class="btn btn-primario btn-grande" data-ir="anunciar">' +
      "Anunciar un envío</button></section>";

    if (activos.length) {
      html += '<section class="panel"><h2>Tus envíos en curso</h2><div class="pila">';
      activos.slice(0, 6).forEach(function (l) { html += tarjetaLote(l); });
      html += "</div>";
