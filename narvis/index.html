<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Narvis</title>
  <meta name="description" content="Asistente personal por voz en español, enfocado en noticias y temas importantes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- La interfaz la dibuja js/app.js. app.html es la misma app para publicarla en Claude. -->
  <main id="narvis" class="shell">
    <!-- js/app.js reemplaza este contenido. Si se queda visible, la app no cargó. -->
    <p class="note">Narvis no cargó. Si abriste este archivo con doble clic, ciérralo e inicia Narvis con
      <strong>iniciar-narvis.bat</strong> (Windows) o <strong>iniciar-narvis.command</strong> (Mac), y entra a
      <strong>http://localhost:8000</strong>.</p>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
